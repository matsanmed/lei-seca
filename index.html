                rows="3"
                data-note-art-id="${art.id}"
                oninput="updateArticleNote('${art.id}', this.value)"
                placeholder="Anote pegadinhas de banca, súmulas, jurisprudência ou mnemônicos..."
                class="w-full p-3 rounded-xl text-sm bg-white dark:bg-slate-900 border border-amber-200 dark:border-amber-800/60 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400/50 leading-relaxed resize-y"
              >${escapeHtml(art.note || '')}</textarea>
            </div>
          `
          : '';

        // Gaveta do Botão 3 (Modificações estilo Planalto)
        const modsItems = modsCount === 0
          ? `<p class="text-xs text-slate-500 dark:text-slate-400 italic py-1">Nenhuma modificação legislativa cadastrada para este artigo.</p>`
          : art.modifications.map(mod => {
              const isStruck = mod.type === 'Redação Anterior' || mod.type === 'Revogado';
              const badgeCls =
                mod.type === 'Revogado'
                  ? 'bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800'
                  : mod.type === 'Incluído'
                  ? 'bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'
                  : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-600';

              return `
                <div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/80 space-y-1.5">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-1.5">
                      <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase border ${badgeCls}">
                        ${escapeHtml(mod.type || 'Alteração')}
                      </span>
                      ${mod.device ? `<span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${escapeHtml(mod.device)}</span>` : ''}
                      ${mod.norm ? `<span class="text-xs text-indigo-600 dark:text-indigo-400 font-medium">(${escapeHtml(mod.norm)})</span>` : ''}
                    </div>
                    <button type="button" onclick="deleteModification('${art.id}', '${mod.id}')" title="Remover registro"
                      class="p-1 rounded-lg text-slate-400 hover:text-rose-500 transition-colors shrink-0">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                      </svg>
                    </button>
                  </div>
                  <p class="text-xs sm:text-sm leading-relaxed ${
                    isStruck ? 'line-through text-slate-500 dark:text-slate-400' : 'text-slate-700 dark:text-slate-300'
                  }">${escapeHtml(mod.text)}</p>
                </div>
              `;
            }).join('');

        const addModForm = isModFormOpen
          ? `
            <form onsubmit="handleAddModification(event, '${art.id}')" class="mt-3 p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-indigo-200 dark:border-indigo-800 space-y-3">
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <input id="mod-device-${art.id}" type="text" placeholder="Dispositivo (ex: Inciso II, § 1º)"
                  class="px-3 py-2 rounded-lg text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
                <select id="mod-type-${art.id}"
                  class="px-3 py-2 rounded-lg text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
                  <option value="Redação Anterior">Redação Anterior (Tachado)</option>
                  <option value="Revogado">Revogado (Tachado)</option>
                  <option value="Alterado">Alterado</option>
                  <option value="Incluído">Incluído</option>
                </select>
                <input id="mod-norm-${art.id}" type="text" required placeholder="Norma (ex: Redação dada pela Lei nº 13.853/2019)"
                  class="px-3 py-2 rounded-lg text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40" />
              </div>
              <textarea id="mod-text-${art.id}" rows="2" required placeholder="Texto da redação anterior ou resumo da alteração..."
                class="w-full px-3 py-2 rounded-lg text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"></textarea>
              <div class="flex justify-end gap-2">
                <button type="button" onclick="toggleModForm('${art.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
                <button type="submit" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white">Salvar Registro</button>
              </div>
            </form>
          `
          : '';

        const modsDrawer = isModOpen
          ? `
            <div class="border-t border-slate-200 dark:border-slate-800 bg-slate-50/90 dark:bg-slate-800/40 px-5 py-4">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                <div class="flex items-center gap-2">
                  <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-200">
                    Modificações (Estilo Planalto) — ${escapeHtml(art.number)}
                  </span>
                </div>
                <button type="button" onclick="toggleModForm('${art.id}')"
                  class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-100/80 dark:bg-indigo-950/60 hover:bg-indigo-200/80 transition-colors">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                  </svg>
                  <span>Adicionar registro</span>
                </button>
              </div>
              <div class="space-y-2">${modsItems}</div>
              ${addModForm}
            </div>
          `
          : '';

        return `
          ${sectionBanner}
          <article id="card-${art.id}"
            class="rounded-2xl bg-white dark:bg-slate-900 border-2 transition-all overflow-hidden shadow-sm ${
              isEditing
                ? 'border-indigo-500 ring-4 ring-indigo-500/10'
                : 'border-slate-200/90 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700'
            }">
            ${editorToolbar}

            <div class="px-5 sm:px-6 pt-5 pb-3">
              <div id="body-${art.id}"
                class="article-body ${serifClass} text-slate-800 dark:text-slate-200 ${isEditing ? 'cursor-text rounded-xl p-2 -m-2 bg-slate-50/70 dark:bg-slate-800/30' : ''}"
                style="${fontSizeStyle}"
                ${isEditing ? `contenteditable="true" oninput="handleArticleEditInput('${art.id}')" onpaste="handleSafePaste(event)"` : ''}
              >${sanitizeHtml(art.html)}</div>
            </div>

            <!-- Rodapé do Cartão com os 3 Botões no Canto Inferior Direito -->
            <div class="px-5 sm:px-6 pb-4 pt-2 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                ${isEdited ? `
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-medium bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200/70 dark:border-emerald-800/60">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    Grifado / Editado
                  </span>
                ` : ''}
                <button type="button" onclick="confirmDeleteArticle('${art.id}')" title="Excluir artigo"
                  class="text-[11px] text-slate-400 hover:text-rose-500 transition-colors px-1.5 py-0.5 rounded-md">
                  Excluir
                </button>
              </div>

              <!-- 3 BOTÕES NO CANTO INFERIOR DIREITO -->
              <div class="flex items-center gap-2 ml-auto">
                <!-- Botão 1: Editar -->
                <button type="button" onclick="toggleEditArticle('${art.id}')" title="Editar texto, negrito, marca-texto e cores"
                  class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border transition-all ${
                    isEditing
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400'
                  }">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                  </svg>
                  <span>${isEditing ? 'Editando' : 'Editar'}</span>
                </button>

                <!-- Botão 2: Observações -->
                <button type="button" onclick="toggleNotes('${art.id}')" title="Abrir observações do artigo"
                  class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border transition-all ${
                    isNoteOpen
                      ? 'bg-amber-500 text-white border-amber-500 shadow-sm'
                      : hasNote
                      ? 'bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-700 hover:border-amber-400'
                      : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-amber-400 hover:text-amber-600 dark:hover:text-amber-400'
                  }">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                  </svg>
                  <span>Observações</span>
                  <span id="note-dot-${art.id}" class="${hasNote ? '' : 'hidden'} w-2 h-2 rounded-full ${isNoteOpen ? 'bg-white' : 'bg-amber-500'}"></span>
                </button>

                <!-- Botão 3: Modificações -->
                <button type="button" onclick="toggleMods('${art.id}')" title="Histórico de modificações legislativas"
                  class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border transition-all ${
                    isModOpen
                      ? 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 border-slate-800 dark:border-slate-200 shadow-sm'
                      : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-500'
                  }">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span>Modificações</span>
                  ${modsCount > 0 ? `
                    <span class="px-1.5 rounded-md text-[10px] font-bold ${
                      isModOpen ? 'bg-white/20 dark:bg-slate-900/20' : 'bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300'
                    }">${modsCount}</span>
                  ` : ''}
                </button>
              </div>
            </div>

            ${notesDrawer}
            ${modsDrawer}
          </article>
        `;
      }).join('');

      const paginationFooter = remainingCount > 0
        ? `
          <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-2.5">
            <button type="button" onclick="loadMoreArticles(${LOAD_MORE_STEP})"
              class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition-colors">
              <span>Carregar mais ${Math.min(LOAD_MORE_STEP, remainingCount)} artigos (exibindo ${visibleSlice.length} de ${filtered.length})</span>
            </button>
            <button type="button" onclick="showAllArticles()"
              class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:border-indigo-400 transition-colors">
              Mostrar todos (${filtered.length})
            </button>
          </div>
        `
        : '';

      container.innerHTML = cardsHtml + paginationFooter;
    }

    function resetAllFilters() {
      filterAnnotatedOnly = false;
      filterModsOnly = false;
      visibleArticlesLimit = INITIAL_VISIBLE_ARTICLES;
      clearSearch();
      updateFilterButtons();
      renderArticles();
    }

    // -----------------------------------------------------------------------
    // 11. AÇÕES DOS 3 BOTÕES DE CADA ARTIGO
    // -----------------------------------------------------------------------
    function getArticleById(articleId) {
      if (!activeLawDoc) return null;
      return (activeLawDoc.articles || []).find(a => a.id === articleId) || null;
    }

    function toggleEditArticle(articleId) {
      if (editingArticleId === articleId) {
        finishEditing(articleId, true);
        return;
      }
      if (editingArticleId) finishEditing(editingArticleId, false);
      editingArticleId = articleId;
      renderArticles();
      document.getElementById(`body-${articleId}`)?.focus();
    }

    function handleSafePaste(event) {
      event.preventDefault();
      const plain = (event.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, plain);
    }

    function handleArticleEditInput(articleId) {
      const art = getArticleById(articleId);
      const bodyEl = document.getElementById(`body-${articleId}`);
      if (!art || !bodyEl) return;
      art.html = sanitizeHtml(bodyEl.innerHTML);
      scheduleSaveActiveLaw(false, articleId);
    }

    function finishEditing(articleId, shouldRender = true) {
      const art = getArticleById(articleId);
      const bodyEl = document.getElementById(`body-${articleId}`);
      if (art && bodyEl) {
        art.html = sanitizeHtml(bodyEl.innerHTML);
        scheduleSaveActiveLaw(true, articleId);
      }
      editingArticleId = null;
      if (shouldRender) {
        renderArticles();
        showToast('Alterações salvas na nuvem!');
      }
    }

    function execFormat(command) {
      try {
        document.execCommand('styleWithCSS', false, true);
        document.execCommand(command, false, null);
        if (editingArticleId) handleArticleEditInput(editingArticleId);
      } catch (err) {
        console.error('Erro ao formatar:', err);
      }
    }

    function applyHighlight(color) {
      try {
        document.execCommand('styleWithCSS', false, true);
        const ok = document.execCommand('hiliteColor', false, color);
        if (!ok) document.execCommand('backColor', false, color);
        if (editingArticleId) handleArticleEditInput(editingArticleId);
      } catch (err) {
        console.error('Erro ao grifar:', err);
      }
    }

    function applyTextColor(color) {
      try {
        document.execCommand('styleWithCSS', false, true);
        const resolved = color === 'default'
          ? (workspace.preferences.darkMode ? '#e2e8f0' : '#1e293b')
          : color;
        document.execCommand('foreColor', false, resolved);
        if (editingArticleId) handleArticleEditInput(editingArticleId);
      } catch (err) {
        console.error('Erro ao alterar cor:', err);
      }
    }

    function confirmRestoreOriginal(articleId) {
      const art = getArticleById(articleId);
      if (!art) return;
      openConfirmModal(
        'Restaurar texto original?',
        `Todas as marcações e edições feitas em "${art.number}" voltarão ao texto original.`,
        () => {
          art.html = sanitizeHtml(art.originalHtml);
          scheduleSaveActiveLaw(true, articleId);
          renderArticles();
          showToast(`${art.number} restaurado ao original.`, 'info');
        },
        'Restaurar'
      );
    }

    function toggleNotes(articleId) {
      if (openNotes.has(articleId)) openNotes.delete(articleId);
      else openNotes.add(articleId);
      renderArticles();
    }

    function updateArticleNote(articleId, value) {
      const art = getArticleById(articleId);
      if (!art) return;
      art.note = value;
      const dot = document.getElementById(`note-dot-${articleId}`);
      if (dot) dot.classList.toggle('hidden', value.trim().length === 0);
      scheduleSaveActiveLaw(false, articleId);
      renderHeader(getFilteredArticles().length);
    }

    function toggleMods(articleId) {
      if (openMods.has(articleId)) openMods.delete(articleId);
      else openMods.add(articleId);
      renderArticles();
    }

    function toggleModForm(articleId) {
      if (openModForms.has(articleId)) openModForms.delete(articleId);
      else openModForms.add(articleId);
      renderArticles();
    }

    function handleAddModification(event, articleId) {
      event.preventDefault();
      const art = getArticleById(articleId);
      if (!art) return;

      const device = document.getElementById(`mod-device-${articleId}`).value.trim();
      const type = document.getElementById(`mod-type-${articleId}`).value;
      const norm = document.getElementById(`mod-norm-${articleId}`).value.trim();
      const text = document.getElementById(`mod-text-${articleId}`).value.trim();
      if (!norm || !text) return;

      if (!Array.isArray(art.modifications)) art.modifications = [];
      art.modifications.push({ id: generateId('mod'), device, type, norm, text });
      openModForms.delete(articleId);
      scheduleSaveActiveLaw(true, articleId);
      renderArticles();
      showToast('Modificação registrada na nuvem!');
    }

    function deleteModification(articleId, modId) {
      const art = getArticleById(articleId);
      if (!art) return;
      art.modifications = (art.modifications || []).filter(m => m.id !== modId);
      scheduleSaveActiveLaw(true, articleId);
      renderArticles();
      showToast('Registro removido.', 'info');
    }

    // -----------------------------------------------------------------------
    // 12. CRUD DE MATÉRIAS, LEIS E ARTIGOS
    // -----------------------------------------------------------------------
    function openSubjectModal() {
      document.getElementById('newSubjectName').value = '';
      openModal('subjectModal');
      setTimeout(() => document.getElementById('newSubjectName')?.focus(), 50);
    }

    function handleCreateSubject(event) {
      event.preventDefault();
      if (!currentUser) return;
      const name = document.getElementById('newSubjectName').value.trim();
      if (!name) return;

      workspace.subjects.push({
        id: generateId('sub'),
        name,
        order: workspace.subjects.length + 1
      });
      scheduleSaveWorkspace(true);
      closeModal('subjectModal');
      renderSidebar();
      showToast(`Matéria "${name}" criada!`);
    }

    function openRenameSubjectModal(subjectId) {
      const sub = workspace.subjects.find(s => s.id === subjectId);
      if (!sub) return;
      renameTargetSubjectId = subjectId;
      document.getElementById('renameSubjectInput').value = sub.name;
      openModal('renameSubjectModal');
      setTimeout(() => document.getElementById('renameSubjectInput')?.focus(), 50);
    }

    function handleRenameSubject(event) {
      event.preventDefault();
      if (!currentUser || !renameTargetSubjectId) return;
      const newName = document.getElementById('renameSubjectInput').value.trim();
      const sub = workspace.subjects.find(s => s.id === renameTargetSubjectId);
      if (!newName || !sub) return;

      sub.name = newName;
      renameTargetSubjectId = null;
      scheduleSaveWorkspace(true);
      closeModal('renameSubjectModal');
      renderSidebar();
      renderHeader();
      showToast('Matéria renomeada!');
    }

    function confirmDeleteSubject(subjectId) {
      const sub = workspace.subjects.find(s => s.id === subjectId);
      if (!sub || !currentUser) return;
      const relatedLaws = workspace.lawIndex.filter(l => l.subjectId === subjectId);

      openConfirmModal(
        'Excluir Matéria?',
        `A matéria "${sub.name}" e ${relatedLaws.length} lei(s) vinculadas serão removidas permanentemente da nuvem.`,
        async () => {
          if (!currentUser) return;
          setSyncStatus('saving', 'Excluindo...');
          try {
            // Remove primeiro subcoleções de chunks de cada lei vinculada
            for (const l of relatedLaws) {
              await deleteLawChunks(currentUser.uid, l.id, 0);
            }

            const batch = writeBatch(db);
            relatedLaws.forEach(l => batch.delete(lawDocRef(currentUser.uid, l.id)));

            workspace.subjects = workspace.subjects.filter(s => s.id !== subjectId);
            workspace.lawIndex = workspace.lawIndex.filter(l => l.subjectId !== subjectId);

            if (relatedLaws.some(l => l.id === workspace.preferences.activeLawId)) {
              const fallback = workspace.lawIndex[0] || null;
              workspace.preferences.activeLawId = fallback ? fallback.id : '';
              workspace.preferences.activeSubjectId = fallback ? fallback.subjectId : (workspace.subjects[0]?.id || '');
            }

            batch.set(workspaceDocRef(currentUser.uid), {
              preferences: workspace.preferences,
              subjects: workspace.subjects,
              lawIndex: workspace.lawIndex,
              updatedAt: Date.now()
            }, { merge: true });

            await batch.commit();
            setSyncStatus('synced');
            showToast(`Matéria "${sub.name}" excluída.`, 'info');
          } catch (err) {
            console.error('Erro ao excluir matéria:', err);
            setSyncStatus('error');
            showToast(translateFirebaseError(err), 'error');
          }
        },
        'Excluir Matéria'
      );
    }

    function confirmDeleteLaw(lawId) {
      const meta = workspace.lawIndex.find(l => l.id === lawId);
      if (!meta || !currentUser) return;

      openConfirmModal(
        'Excluir Lei?',
        `A lei "${meta.title}" e todas as suas anotações e grifos serão excluídas permanentemente.`,
        async () => {
          if (!currentUser) return;
          setSyncStatus('saving', 'Excluindo lei...');
          try {
            // Remove primeiro todos os blocos (chunks) se a lei for fragmentada
            await deleteLawChunks(currentUser.uid, lawId, 0);

            const batch = writeBatch(db);
            batch.delete(lawDocRef(currentUser.uid, lawId));

            workspace.lawIndex = workspace.lawIndex.filter(l => l.id !== lawId);
            if (workspace.preferences.activeLawId === lawId) {
              const fallback = workspace.lawIndex[0] || null;
              workspace.preferences.activeLawId = fallback ? fallback.id : '';
              workspace.preferences.activeSubjectId = fallback ? fallback.subjectId : (workspace.subjects[0]?.id || '');
            }

            batch.set(workspaceDocRef(currentUser.uid), {
              preferences: workspace.preferences,
              subjects: workspace.subjects,
              lawIndex: workspace.lawIndex,
              updatedAt: Date.now()
            }, { merge: true });

            await batch.commit();
            setSyncStatus('synced');
            showToast(`Lei "${meta.shortName || meta.title}" excluída.`, 'info');
          } catch (err) {
            console.error('Erro ao excluir lei:', err);
            setSyncStatus('error');
            showToast(translateFirebaseError(err), 'error');
          }
        },
        'Excluir Lei'
      );
    }

    function openAddArticleModal() {
      if (!activeLawDoc) {
        showToast('Selecione ou importe uma lei primeiro.', 'error');
        return;
      }
      document.getElementById('manualArtNumber').value = `Art. ${(activeLawDoc.articles || []).length + 1}º`;
      document.getElementById('manualArtSection').value = '';
      document.getElementById('manualArtBody').value = '';
      openModal('addArticleModal');
      setTimeout(() => document.getElementById('manualArtBody')?.focus(), 50);
    }

    function handleAddArticle(event) {

          showToast(`${art.number} removido.`, 'info');

    /**
     * Limpeza rigorosa de marcação inline (HTML de ruído + Markdown cru) em texto bruto:
     * - Remove tags <u>, <a>, <span>, <font>, <div>, <p> mantendo o texto interno
     * - Converte <b> -> <strong>, <i> -> <em>, <s> -> <del>
     * - Converte **texto**, __texto__, ~~texto~~, `texto`, *texto*
     * - Elimina quaisquer resíduos literais de **, __, ` ou entidades &lt;u&gt;, &lt;b&gt;, &lt;i&gt;
     */
    function cleanRawInlineToHtml(rawLine) {
      let s = String(rawLine || '');
      s = s.replace(/[\uE000-\uF8FF]/g, '');
      s = s.replace(/`{3}[a-zA-Z0-9_-]*/g, '');
      s = s.replace(/\[URL\s*🔗?\]\([^)]*\)/gi, '');
      s = s.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
      s = s.replace(/\\([$*_[\]])/g, '$1');

      // Remove tags HTML de ruído (cruas ou já escapadas) preservando o texto interno
      s = s.replace(/&lt;\/?(?:u|a|span|font|div|p)\b[^&]*?&gt;/gi, '');
      s = s.replace(/<\/?(?:u|a|span|font|div|p)\b[^>]*>/gi, '');

      // Normaliza <b>, <i>, <s> (cruas ou escapadas) antes do escapeHtml
      s = s.replace(/&lt;(\/?)(?:b|strong)\b[^&]*?&gt;/gi, '<$1strong>');
      s = s.replace(/&lt;(\/?)(?:i|em)\b[^&]*?&gt;/gi, '<$1em>');
      s = s.replace(/&lt;(\/?)(?:s|strike|del)\b[^&]*?&gt;/gi, '<$1del>');
      s = s.replace(/<(\/?)(?:b|strong)\b[^>]*>/gi, (_, sl) => (sl ? '@@/STRONG@@' : '@@STRONG@@'));
      s = s.replace(/<(\/?)(?:i|em)\b[^>]*>/gi, (_, sl) => (sl ? '@@/EM@@' : '@@EM@@'));
      s = s.replace(/<(\/?)(?:s|strike|del)\b[^>]*>/gi, (_, sl) => (sl ? '@@/DEL@@' : '@@DEL@@'));

      // Escapa qualquer outro HTML potencialmente perigoso
      s = escapeHtml(s);

      // Restaura marcadores seguros
      s = s.replace(/@@STRONG@@/g, '<strong>').replace(/@@\/STRONG@@/g, '</strong>');
      s = s.replace(/@@EM@@/g, '<em>').replace(/@@\/EM@@/g, '</em>');
      s = s.replace(/@@DEL@@/g, '<del>').replace(/@@\/DEL@@/g, '</del>');

      // Converte Markdown inline
      s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');
      s = s.replace(/~~([^~\n]+?)~~/g, '<del>$1</del>');
      s = s.replace(/`([^`\n]+?)`/g, '$1');
      s = s.replace(/(^|[\s([{"'“])\*([^*\s][^*\n]*?[^*\s]|[^*\s])\*(?=[\s.,;:!?)\]}"'”]|$)/g, '$1<em>$2</em>');

      // Limpa quaisquer resíduos órfãos para que NUNCA apareçam literais na tela
      s = s.replace(/\*\*|__|`/g, '');
      s = s.replace(/&lt;\/?(?:u|b|i|s|strong|em|del|a|span|font|div|p)\b[^&]*?&gt;/gi, '');
      return s.replace(/\s{2,}/g, ' ').trim();
    }

    function formatPlainArticleToHtml(text, fallbackNumber = '') {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return `<p><strong>${escapeHtml(fallbackNumber)}</strong></p>`;

      return lines.map((line, idx) => {
        const cleaned = cleanRawInlineToHtml(line).replace(
          /(\((?:Redação dada|Incluíd[oa]|Revogad[oa]|Renumerad[oa]|Numerad[oa]|Vide|Vigência|Produção de efeito|Regulamento|VETADO|Promulgação)[^)]*\))/gi,
          '<span class="text-xs text-slate-500 dark:text-slate-400">$1</span>'
        );

        const plainForTest = line.replace(/[*_`~]/g, '').replace(/<\/?[^>]+>/g, '').trim();

        if (idx === 0) {
          return `<p>${cleaned.replace(
            /^(?:<strong>)?(Art\.?\s*\d+(?:\s*-\s*[A-Z](?=[\s.,;:º°]|$))?(?:\s*[º°]\.?|\s+o(?=\s)|\.?))(?:<\/strong>)?/,
            '<strong>$1</strong>'
          )}</p>`;
        }
        if (/^(§\s*\d+(?:\s*-\s*[A-Z])?(?:\.?\s*[º°]\.?|\s+o(?=\s)|\.?)|Parágrafo único\.?)/i.test(plainForTest)) {
          return `<p class="law-paragrafo">${cleaned.replace(
            /^(?:<strong>)?(§\s*\d+(?:\s*-\s*[A-Z])?(?:\.?\s*[º°]\.?|\s+o(?=\s)|\.?)|Parágrafo único\.?)(?:<\/strong>)?/i,
            '<strong>$1</strong>'
          )}</p>`;
        }
        if (/^[a-z]\s*\)\s+/.test(plainForTest)) {
          return `<p class="law-alinea">${cleaned}</p>`;
        }
        if (/^[IVXLCDM]+(?:-[A-Z])?\s*[-–—]+\s+/.test(plainForTest)) {
          return `<p class="law-inciso">${cleaned}</p>`;
        }
        return `<p>${cleaned}</p>`;
      }).join('');
    }

    /**
     * Parser inteligente de Markdown/Texto do Planalto (inclui arquivos convertidos de PDF como CF/88):
     * - Remove cercas ``` preservando o texto jurídico interno
     * - Remove cabeçalhos de data/hora e rodapés de URL + paginação (ex: 1/197)
     * - Remove glifos Unicode de Área de Uso Privado (ex: )
     * - Limpa links, tags HTML de ruído e Markdown cru
     * - Une linhas quebradas no meio de frase preservando dispositivos estruturais
     * - Diferencia "Art." (início de artigo) de "art." (citação no meio do texto)
     * - Consolida redações anteriores consecutivas para a aba Modificações
     */
    function parseLawText(rawText, options = { cleanPlanalto: true, extractMods: true }) {
      let text = (rawText || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // Remove glifos de ícones Unicode PUA (ex: ) e cercas de bloco de código Markdown (```)
      text = text.replace(/[\uE000-\uF8FF]/g, '');
      text = text.replace(/^\s*`{3}[^\n]*$/gm, '');

      if (options.cleanPlanalto) {
        // Remove cabeçalhos de impressão (ex: "26/11/2026, 11:48 Constituição")
        text = text.replace(/^\s*\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AP]M)?\s+.*$/gim, '');
        // Remove rodapés de URL + paginação (ex: "https://www.planalto.gov.br/... 1/197")
        text = text.replace(/^\s*(?:https?:\/\/|www\.planalto\.gov\.br)\S+(?:\s+\d+\s*\/\s*\d+)?\s*$/gim, '');
        // Remove links do Planalto e preserva texto de links Markdown
        text = text.replace(/\[URL\s*🔗?\]\([^)]*\)/gi, '');
        text = text.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
        // Desescapa caracteres Markdown
        text = text.replace(/\\([$*_[\]])/g, '$1');
        // Remove tags HTML de ruído (<u>, <a>, <span>, etc.) mantendo texto interno
        text = text.replace(/&lt;\/?(?:u|a|span|font|div|p)\b[^&]*?&gt;/gi, '');
        text = text.replace(/<\/?(?:u|a|span|font|div|p)\b[^>]*>/gi, '');
        // Remove marcadores de lista antes de dispositivos legais
        text = text.replace(/^\s*[-*]\s+(?=(?:Art\.|§|Parágrafo|[IVXLCDM]+(?:-[A-Z])?\s*[-–—]|[a-z]\s*\)))/gm, '');
        // Remove linhas isoladas de metadados de topo do Planalto
        text = text.replace(/^\s*(?:Texto compilado|Mensagem de veto|Vigência|ÍNDICE TEMÁTICO)\s*$/gim, '');
      }

      const rawLines = text.split('\n');
      const logicalLines = [];
      const structuralStartRegex =
        /^(?:(?:#{1,6}\s*)|(?:TÍTULO|CAPÍTULO|SEÇÃO|SUBSEÇÃO|LIVRO|PARTE)\s+[IVXLCDM0-9]+|ATO DAS DISPOSIÇÕES|PREÂMBULO|Art\.?\s*\d+|§\s*\d+|Parágrafo único|[IVXLCDM]+(?:-[A-Z])?\s*[-–—]+\s|[a-z]\s*\)\s+|~~)/;

      for (let i = 0; i < rawLines.length; i++) {
        const line = rawLines[i].trim();
        if (!line) continue;

        const isHeading = /^#{1,6}\s+/.test(line);
        const cleanLine = line.replace(/^#{1,6}\s+/, '').trim();
        if (!cleanLine) continue;

        const prevIsSection =
          logicalLines.length > 0 && logicalLines[logicalLines.length - 1].startsWith('__SECTION__');

        const isExplicitSection =
          isHeading ||
          /^(?:TÍTULO|CAPÍTULO|SEÇÃO|SUBSEÇÃO|LIVRO|PARTE)\s+[IVXLCDM0-9]+(?:-[A-Z])?\b/i.test(cleanLine) ||
          /^ATO DAS DISPOSIÇÕES CONSTITUCIONAIS TRANSITÓRIAS\b/i.test(cleanLine);

        // Subtítulo em caixa alta logo após TÍTULO / CAPÍTULO / SEÇÃO (ex: "DOS PRINCÍPIOS FUNDAMENTAIS")
        const isSectionSubtitle =
          prevIsSection &&
          cleanLine.length <= 130 &&
          !structuralStartRegex.test(cleanLine) &&
          !/^[a-z]/.test(cleanLine) &&
          cleanLine === cleanLine.toUpperCase() &&
          /[A-ZÀ-Ú]{3,}/.test(cleanLine) &&
          !/\.$/.test(cleanLine);

        if (isExplicitSection || isSectionSubtitle) {
          logicalLines.push(`__SECTION__${cleanLine}`);
          continue;
        }

        if (options.cleanPlanalto && !/^["“]/.test(cleanLine)) {
          const splitInline = cleanLine
            .replace(/([;.:])\s+(?=(?:[IVXLCDM]+(?:-[A-Z])?\s*[-–—]+\s|§\s*\d+(?:\s*-\s*[A-Z])?(?:\.?\s*[º°]|\s+o\b)|Parágrafo único\.?))/g, '$1\n')
            .split('\n')
            .map(s => s.trim())
            .filter(Boolean);

          for (const part of splitInline) {
            if (
              logicalLines.length > 0 &&
              !structuralStartRegex.test(part) &&
              !logicalLines[logicalLines.length - 1].startsWith('__SECTION__') &&
              !/^["“]/.test(part)
            ) {
              logicalLines[logicalLines.length - 1] += ' ' + part;
            } else {
              logicalLines.push(part);
            }
          }
        } else {
          logicalLines.push(cleanLine);
        }
      }

      const rawArticles = [];
      let pendingSection = '';
      let currentArticle = null;
      // Exige "Art." maiúsculo no início da linha (aceita "Art. 1º", "Art. 6 o", "Art. 29-A.", "Art.246.")
      const articleStartRegex = /^(Art\.?\s*(\d+(?:\s*-\s*[A-Z](?=[\s.,;:º°]|$))?)(?:\s*[º°]\.?|\s+o(?=\s)|\.?))(?=\s|$|[-–—])/;

      for (const line of logicalLines) {
        if (line.startsWith('__SECTION__')) {
          const secText = line.replace('__SECTION__', '').replace(/\*\*|__|`/g, '').trim();
          if (!/^(?:Presidência da República|Casa Civil|Subchefia|LEI Nº)/i.test(secText)) {
            pendingSection = pendingSection ? `${pendingSection} • ${secText}` : secText;
          }
          continue;
        }

        const plainLine = line.replace(/^\*\*|\*\*$/g, '').trim();
        const artMatch = !/^["“]/.test(plainLine) ? plainLine.match(articleStartRegex) : null;
        if (artMatch) {
          if (currentArticle) rawArticles.push(currentArticle);
          const normalizedNum = artMatch[1]
            .replace(/\s+/g, ' ')
            .replace(/^Art\.(\d)/, 'Art. $1')
            .replace(/\s+o$/, 'º')
            .trim();
          const baseKey = `art-${artMatch[2].toLowerCase().replace(/\s+/g, '')}`;
          currentArticle = {
            number: normalizedNum,
            key: baseKey,
            sectionHeader: pendingSection,
            lines: [line]
          };
          pendingSection = '';
        } else if (currentArticle) {
          currentArticle.lines.push(line);
        }
      }
      if (currentArticle) rawArticles.push(currentArticle);

      if (rawArticles.length === 0 && rawText.trim().length > 0) {
        const html = sanitizeHtml(formatPlainArticleToHtml(rawText.trim(), 'Texto Importado'));
        return {
          articles: [{
            id: generateId('art'),
            number: 'Texto Importado',
            sectionHeader: '',
            originalHtml: html,
            html,
            note: '',
            modifications: []
          }],
          totalModsExtracted: 0
        };
      }

      // Consolida artigos repetidos CONSECUTIVOS (mantém a redação mais recente no cartão e move anteriores para Modificações)
      // Como só consolida consecutivos, Art. 1º do ADCT fica preservado separado do Art. 1º da CF/88.
      const consolidated = [];
      let totalModsExtracted = 0;

      for (const item of rawArticles) {
        const last = consolidated[consolidated.length - 1];
        if (options.extractMods && last && last.key === item.key) {
          const oldText = last.lines.join('\n').replace(/\*\*|__|`/g, '');
          const normMatch = oldText.match(/\(([^)]*(?:Emenda Constitucional|Medida Provisória|Lei nº|Redação dada|Revogad[oa])[^)]*)\)/i);
          const inheritedMods = last.modifications || [];
          inheritedMods.push({
            id: generateId('mod'),
            device: 'Redação anterior do artigo',
            type: /Revogad[oa]/i.test(oldText) ? 'Revogado' : 'Redação Anterior',
            norm: normMatch ? normMatch[1] : 'Redação anterior (extraída)',
            text: oldText
          });
          totalModsExtracted++;
          item.sectionHeader = last.sectionHeader || item.sectionHeader;
          item.modifications = inheritedMods;
          consolidated[consolidated.length - 1] = item;
        } else {
          item.modifications = [];
          consolidated.push(item);
        }
      }

      const finalArticles = consolidated.map(item => {
        const activeLines = [];
        const mods = [...(item.modifications || [])];

        if (options.extractMods) {
          const prefixIndices = new Map();
          const linesWithMeta = item.lines.map(l => {
            const isStruck = /^~~[\s\S]*~~$/.test(l.trim());
            const prefixMatch = l.match(/^(§\s*\d+(?:\s*-\s*[A-Z])?(?:\.?\s*[º°]|\s+o\b)?|Parágrafo único|[IVXLCDM]+(?:-[A-Z])?\s*[-–—]+|[a-z]\s*\))/);
            const prefixKey = prefixMatch
              ? prefixMatch[1].toLowerCase().replace(/[º°.\s–—-]+/g, '')
              : null;
            return { text: l, isStruck, prefixKey };
          });

          linesWithMeta.forEach((meta, idx) => {
            if (!meta.isStruck && meta.prefixKey) {
              const prevIdx = prefixIndices.get(meta.prefixKey);
              if (prevIdx !== undefined) {
                const isNearby = idx - prevIdx <= 6;
                const hasLegNote =
                  /\((?:Redação dada|Incluíd[oa]|Revogad[oa]|Emenda Constitucional|Medida Provisória|Lei nº)/i.test(meta.text) ||
                  /\((?:Redação dada|Incluíd[oa]|Revogad[oa]|Emenda Constitucional|Medida Provisória|Lei nº)/i.test(linesWithMeta[prevIdx].text);
                if (isNearby || hasLegNote) {
                  linesWithMeta[prevIdx].superseded = true;
                }
              }
              prefixIndices.set(meta.prefixKey, idx);
            }
          });

          for (const meta of linesWithMeta) {
            if (meta.isStruck) {
              const cleanStruck = meta.text.replace(/^~~|~~$/g, '').replace(/\*\*|__|`/g, '').trim();
              const normMatch = cleanStruck.match(/\(([^)]*(?:Emenda|Lei|MP|Medida Provisória|Revogad[oa]|Redação)[^)]*)\)/i);
              mods.push({
                id: generateId('mod'),
                device: meta.prefixKey ? meta.prefixKey.toUpperCase() : 'Trecho tachado',
                type: /Revogad[oa]/i.test(cleanStruck) ? 'Revogado' : 'Redação Anterior',
                norm: normMatch ? normMatch[1] : 'Texto tachado no original',
                text: cleanStruck
              });
              totalModsExtracted++;
            } else if (meta.superseded) {
              const cleanPrev = meta.text.replace(/\*\*|__|`/g, '').trim();
              const normMatch = cleanPrev.match(/\(([^)]*(?:Emenda|Lei|MP|Medida Provisória|Revogad[oa]|Redação)[^)]*)\)/i);
              mods.push({
                id: generateId('mod'),
                device: meta.prefixKey ? meta.prefixKey.toUpperCase() : 'Dispositivo',
                type: /Revogad[oa]/i.test(cleanPrev) ? 'Revogado' : 'Redação Anterior',
                norm: normMatch ? normMatch[1] : 'Redação anterior',
                text: cleanPrev
              });
              totalModsExtracted++;
            } else {
              let cleanedLine = meta.text;
              const inlineStruck = cleanedLine.match(/~~([^~]+)~~/g);
              if (inlineStruck) {
                inlineStruck.forEach(chunk => {
                  const inner = chunk.replace(/^~~|~~$/g, '').replace(/\*\*|__|`/g, '').trim();
                  mods.push({
                    id: generateId('mod'),
                    device: 'Trecho tachado',
                    type: 'Redação Anterior',
                    norm: 'Extraído do texto tachado',
                    text: inner
                  });
                  totalModsExtracted++;
                });
                cleanedLine = cleanedLine.replace(/~~([^~]+)~~/g, '').replace(/\s{2,}/g, ' ').trim();
              }
              if (cleanedLine) activeLines.push(cleanedLine);
            }
          }
        } else {
          activeLines.push(...item.lines);
        }

        const html = sanitizeHtml(formatPlainArticleToHtml(activeLines.join('\n'), item.number));
        return {
          id: generateId('art'),
          number: item.number,
          sectionHeader: item.sectionHeader || '',
          originalHtml: html,
          html,
          note: '',
          modifications: mods
        };
      });

      return { articles: finalArticles, totalModsExtracted };
    }

    /**
     * Limpa artefatos literais de Markdown/HTML já salvos no Firestore
     * preservando intactos os marca-textos (<mark> / <span style="...">), cores e observações do usuário.
     */
    function isPrintNoiseText(str) {
      const t = String(str || '').trim();
      if (!t) return true;
      if (/^`{3}[a-zA-Z0-9_-]*$/.test(t)) return true;
      if (/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AP]M)?\s+/.test(t)) return true;
      if (/^(?:https?:\/\/|www\.planalto\.gov\.br)\S+(?:\s+\d+\s*\/\s*\d+)?$/i.test(t)) return true;
      return false;
    }

    function cleanTextNodeToFragment(rawText) {
      let s = String(rawText || '');
      s = s.replace(/[\uE000-\uF8FF]/g, '');
      s = s.replace(/`{3}[a-zA-Z0-9_-]*/g, '');
      s = s.replace(/\b\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AP]M)?\s+[^\n]*?(?=\s+https?:|$)/gi, '');
      s = s.replace(/https?:\/\/www\.planalto\.gov\.br\/\S+(?:\s+\d+\s*\/\s*\d+)?/gi, '');
      s = s.replace(/\[URL\s*🔗?\]\([^)]*\)/gi, '');
      s = s.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
      s = s.replace(/\\([$*_[\]])/g, '$1');

      // Remove tags HTML literais de ruído que ficaram como texto (ex: <u>, </u>, <a>, <span>)
      s = s.replace(/<\/?(?:u|a|span|font|div|p)\b[^>]*>/gi, '');
      // Converte <b>, <i>, <s> literais em marcação para virar elementos DOM reais
      s = s.replace(/<(?:b|strong)\b[^>]*>([\s\S]*?)<\/(?:b|strong)>/gi, '**$1**');
      s = s.replace(/<(?:i|em)\b[^>]*>([\s\S]*?)<\/(?:i|em)>/gi, '*$1*');
      s = s.replace(/<(?:s|strike|del)\b[^>]*>([\s\S]*?)<\/(?:s|strike|del)>/gi, '~~$1~~');
      s = s.replace(/<\/?(?:b|strong|i|em|s|strike|del)\b[^>]*>/gi, '');

      const frag = document.createDocumentFragment();
      const tokenRegex = /(\*\*[^*]+?\*\*|__[^_]+?__|~~[^~]+?~~|`[^`]+?`|\*[^*\s][^*]*?[^*\s]\*)/g;

      let lastIdx = 0;
      let match;
      while ((match = tokenRegex.exec(s)) !== null) {
        if (match.index > lastIdx) {
          const before = s.slice(lastIdx, match.index).replace(/\*\*|__|`/g, '');
          if (before) frag.appendChild(document.createTextNode(before));
        }
        const tok = match[0];
        if ((tok.startsWith('**') && tok.endsWith('**')) || (tok.startsWith('__') && tok.endsWith('__'))) {
          const el = document.createElement('strong');
          el.textContent = tok.slice(2, -2).replace(/\*\*|__|`/g, '');
          frag.appendChild(el);
        } else if (tok.startsWith('~~') && tok.endsWith('~~')) {
          const el = document.createElement('del');
          el.textContent = tok.slice(2, -2);
          frag.appendChild(el);
        } else if (tok.startsWith('`') && tok.endsWith('`')) {
          frag.appendChild(document.createTextNode(tok.slice(1, -1)));
        } else if (tok.startsWith('*') && tok.endsWith('*')) {
          const el = document.createElement('em');
          el.textContent = tok.slice(1, -1);
          frag.appendChild(el);
        }
        lastIdx = tokenRegex.lastIndex;
      }

      if (lastIdx < s.length) {
        const tail = s.slice(lastIdx).replace(/\*\*|__|`/g, '');
        if (tail) frag.appendChild(document.createTextNode(tail));
      }
      return frag;
    }

    function cleanExistingArticleHtml(dirtyHtml) {
      if (!dirtyHtml) return '';
      const parser = new DOMParser();
      const parsed = parser.parseFromString(String(dirtyHtml), 'text/html');

      // Remove parágrafos que contenham apenas cabeçalho/rodapé de impressão ou cercas ```
      Array.from(parsed.body.querySelectorAll('p, div')).forEach(el => {
        if (el.children.length === 0 && isPrintNoiseText(el.textContent)) {
          el.remove();
        }
      });

      // Higieniza apenas os nós de texto preservando <mark>, <span style="...">, etc.
      const walker = document.createTreeWalker(parsed.body, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let current;
      while ((current = walker.nextNode())) {
        textNodes.push(current);
      }

      for (const tNode of textNodes) {
        const orig = tNode.nodeValue || '';
        if (!orig) continue;
        const hasArtifacts =
          /[\uE000-\uF8FF]|\*\*|__|~~|`|\\[$*_[\]]|<\/?(?:u|b|i|s|a|span|font|div|p|strong|em|del)\b|\[URL|\]\(https?:|planalto\.gov\.br|\d{1,2}\/\d{1,2}\/\d{2,4},?\s+\d{1,2}:\d{2}/i.test(orig);
        if (!hasArtifacts) continue;

        const frag = cleanTextNodeToFragment(orig);
        tNode.parentNode?.replaceChild(frag, tNode);
      }

      Array.from(parsed.body.querySelectorAll('p')).forEach(p => {
        if (!p.textContent.trim() && p.querySelectorAll('br').length === 0) {
          p.remove();
        }
      });

      return sanitizeHtml(parsed.body.innerHTML);
    }

    /**
     * Ação do botão "Limpar tags MD": percorre todos os artigos da lei aberta,
     * remove tags/artefatos literais já salvos no Firestore mantendo grifos e observações.
     */
    async function cleanMarkdownTagsInActiveLaw() {
      if (!currentUser || !activeLawDoc || !activeLawDoc.articles?.length) {
        showToast('Nenhuma lei aberta para limpar.', 'info');
        return;
      }
      if (editingArticleId) finishEditing(editingArticleId, false);

      const btn = document.getElementById('cleanMdTagsBtn');
      if (btn) btn.disabled = true;

      try {
        let cleanedCount = 0;
        for (const art of activeLawDoc.articles) {
          const newHtml = cleanExistingArticleHtml(art.html);
          const newOrig = cleanExistingArticleHtml(art.originalHtml);
          const newSection = String(art.sectionHeader || '')
            .replace(/[\uE000-\uF8FF]/g, '')
            .replace(/\*\*|__|`/g, '')
            .trim();

          if (newHtml !== art.html || newOrig !== art.originalHtml || newSection !== art.sectionHeader) {
            art.html = newHtml;
            art.originalHtml = newOrig;
            art.sectionHeader = newSection;
            cleanedCount++;
          }
        }

        if (cleanedCount === 0) {
          showToast('Nenhum artefato Markdown/HTML encontrado nesta lei.', 'info');
          return;
        }

        hasLocalUnsavedLawChanges = true;
        setSyncStatus('saving', 'Salvando limpeza...');
        await saveLawToCloud(currentUser.uid, activeLawDoc, {
          onProgress: (done, total) => {
            setSyncStatus('saving', `Salvando limpeza (bloco ${done} de ${total})...`);
          }
        });
        hasLocalUnsavedLawChanges = false;
        setSyncStatus('synced');
        renderArticles();
        showToast(`Limpeza concluída: ${cleanedCount} artigo(s) higienizados na nuvem!`);
      } catch (err) {
        console.error('Erro ao limpar tags MD:', err);
        hasLocalUnsavedLawChanges = false;
        setSyncStatus('error', 'Offline / Erro');
        showToast(translateFirebaseError(err), 'error');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function updateImportPreview() {
      const raw = document.getElementById('importRawText').value;
      const box = document.getElementById('importPreviewBox');
      if (!raw.trim()) {
        box.classList.add('hidden');
        return;
      }

      const opts = {
        cleanPlanalto: document.getElementById('optCleanPlanalto').checked,
        extractMods: document.getElementById('optExtractMods').checked
      };
      const result = parseLawText(raw, opts);
      const estBytes = getUtf8ByteSize(result.articles.map(serializeArticleForStorage));
      const estChunks = estBytes > CHUNK_TARGET_BYTES
        ? Math.ceil(estBytes / CHUNK_TARGET_BYTES)
        : 1;

      box.classList.remove('hidden');
      document.getElementById('importPreviewStats').textContent =
        `${result.articles.length} artigo(s) • ${result.totalModsExtracted} modificação(ões) • ~${Math.max(1, Math.round(estBytes / 1024))} KB` +
        (estChunks > 1 ? ` (${estChunks} blocos)` : '');

      document.getElementById('importPreviewList').innerHTML =
        result.articles.slice(0, 4).map(a => `
          <div class="truncate">
            <strong class="text-indigo-700 dark:text-indigo-300">${escapeHtml(a.number)}</strong> —
            ${escapeHtml(stripHtml(a.html).slice(0, 105))}...
            ${a.modifications.length > 0 ? `<span class="text-[10px] font-semibold text-amber-600 dark:text-amber-400">(${a.modifications.length} mod.)</span>` : ''}
          </div>
        `).join('') +
        (result.articles.length > 4
          ? `<div class="text-[11px] italic text-slate-500">+ ${result.articles.length - 4} outros artigos prontos para importação...</div>`
          : '');
    }

    async function handleImportLaw(event) {
      event.preventDefault();
      if (!currentUser) return;

      const selectVal = document.getElementById('importSubjectSelect').value;
      const lawTitle = document.getElementById('importLawTitle').value.trim();
      const rawText = document.getElementById('importRawText').value.trim();
      if (!lawTitle || !rawText) return;

      const submitBtn = document.getElementById('importSubmitBtn');
      const originalBtnText = submitBtn?.textContent || 'Importar e Salvar na Nuvem';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processando texto...';
      }
      setSyncStatus('saving', 'Importando lei...');

      try {
        let targetSubjectId = selectVal;
        if (selectVal === '__new__') {
          const newSubName = document.getElementById('importNewSubjectInput').value.trim();
          if (!newSubName) {
            showToast('Informe o nome da nova matéria.', 'error');
            return;
          }
          targetSubjectId = generateId('sub');
          workspace.subjects.push({
            id: targetSubjectId,
            name: newSubName,
            order: workspace.subjects.length + 1
          });
        }

        const opts = {
          cleanPlanalto: document.getElementById('optCleanPlanalto').checked,
          extractMods: document.getElementById('optExtractMods').checked
        };
        const parsed = parseLawText(rawText, opts);
        const lawId = generateId('law');
        const shortName = lawTitle.length > 26 ? lawTitle.slice(0, 26).trim() + '…' : lawTitle;
        const subtitle = `Importada em ${new Date().toLocaleDateString('pt-BR')}`;
        const order = workspace.lawIndex.filter(l => l.subjectId === targetSubjectId).length + 1;

        const newLawObj = {
          id: lawId,
          subjectId: targetSubjectId,
          shortName,
          title: lawTitle,
          subtitle,
          order,
          chunked: false,
          articles: parsed.articles
        };

        // Salva na nuvem com chunking automático e feedback de progresso por bloco
        const saveRes = await saveLawToCloud(currentUser.uid, newLawObj, {
          skipChunkCleanup: true,
          onProgress: (done, total) => {
            const label = `Salvando ${shortName} (bloco ${done} de ${total})...`;
            setSyncStatus('saving', label);
            if (submitBtn) submitBtn.textContent = label;
          }
        });

        workspace.lawIndex.push({
          id: lawId,
          subjectId: targetSubjectId,
          shortName,
          title: lawTitle,
          subtitle,
          order,
          articleCount: parsed.articles.length
        });
        workspace.preferences.activeSubjectId = targetSubjectId;
        workspace.preferences.activeLawId = lawId;

        await setDoc(workspaceDocRef(currentUser.uid), {
          preferences: workspace.preferences,
          subjects: workspace.subjects,
          lawIndex: workspace.lawIndex,
          updatedAt: Date.now()
        }, { merge: true });

        closeModal('importModal');
        toggleSidebar(false);
        setSyncStatus('synced');
        const chunkMsg = saveRes.chunked ? ` em ${saveRes.chunkCount} blocos` : '';
        showToast(`"${lawTitle}" salva na nuvem (${parsed.articles.length} artigos${chunkMsg})!`);
      } catch (err) {
        console.error('Erro ao importar lei:', err);
        setSyncStatus('error', 'Offline / Erro');
        showToast(translateFirebaseError(err), 'error');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
        }
      }
    }

    // -----------------------------------------------------------------------
    // 14. BACKUP JSON COMPLETO (EXPORTAR E RESTAURAR COM SUPORTE A CHUNKS)
    // -----------------------------------------------------------------------
    function openBackupModal() {
      const input = document.getElementById('backupJsonInput');
      if (input) input.value = '';
      openModal('backupModal');
    }

    async function exportBackupJSON() {
      if (!currentUser) return;
      try {
        setSyncStatus('saving', 'Exportando...');
        const snap = await getDocs(lawsCollectionRef(currentUser.uid));
        const allLaws = [];

        for (const d of snap.docs) {
          const data = d.data();
          const loaded = await loadLawArticlesFromCloud(currentUser.uid, d.id, data);
          allLaws.push({
            id: d.id,
            subjectId: data.subjectId || '',
            shortName: data.shortName || data.title || 'Lei',
            title: data.title || 'Lei',
            subtitle: data.subtitle || '',
            order: Number(data.order) || 1,
            articles: loaded.articles
          });
        }

        const payload = {
          app: 'Lei Seca Studio',
          version: 4,
          exportedAt: new Date().toISOString(),
          workspace,
          laws: allLaws
        };

        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lei-seca-studio-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setSyncStatus('synced');
        showToast('Backup JSON baixado com sucesso!');
      } catch (err) {
        console.error('Erro ao exportar backup:', err);
        setSyncStatus('error', 'Offline / Erro');
        showToast(translateFirebaseError(err), 'error');
      }
    }

    function importBackupJSON(event) {
      const file = event.target.files[0];
      if (!file || !currentUser) return;

      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedSubjects = Array.isArray(parsed.workspace?.subjects)
            ? parsed.workspace.subjects
            : Array.isArray(parsed.subjects)
            ? parsed.subjects
            : [];

          let importedLaws = Array.isArray(parsed.laws) ? parsed.laws : [];

          // Compatibilidade com backup v1 (leis aninhadas em subjects)
          if (importedLaws.length === 0 && importedSubjects.some(s => Array.isArray(s.laws))) {
            importedSubjects.forEach(s => {
              (s.laws || []).forEach((l, idx) => {
                importedLaws.push({ ...l, subjectId: s.id, order: idx + 1 });
              });
            });
          }

          if (importedSubjects.length === 0) {
            throw new Error('Arquivo JSON inválido ou sem matérias.');
          }

          setSyncStatus('saving', 'Limpando dados anteriores...');
          const existingSnap = await getDocs(lawsCollectionRef(currentUser.uid));
          for (const d of existingSnap.docs) {
            await deleteLawChunks(currentUser.uid, d.id, 0);
          }
          for (let i = 0; i < existingSnap.docs.length; i += MAX_BATCH_OPS) {
            const batch = writeBatch(db);
            existingSnap.docs.slice(i, i + MAX_BATCH_OPS).forEach(d => batch.delete(d.ref));
            await batch.commit();
          }

          const cleanSubjects = importedSubjects.map((s, idx) => ({
            id: s.id || generateId('sub'),
            name: String(s.name || 'Matéria'),
            order: Number(s.order) || idx + 1
          }));

          const cleanLawIndex = [];
          for (let idx = 0; idx < importedLaws.length; idx++) {
            const l = importedLaws[idx];
            const lid = l.id || generateId('law');
            const sid = l.subjectId || cleanSubjects[0].id;
            const hydratedArticles = (l.articles || []).map(hydrateArticleFromStorage);

            const lawObj = {
              id: lid,
              subjectId: sid,
              shortName: String(l.shortName || l.title || 'Lei'),
              title: String(l.title || 'Lei'),
              subtitle: String(l.subtitle || ''),
              order: Number(l.order) || idx + 1,
              chunked: false,
              articles: hydratedArticles
            };

            setSyncStatus('saving', `Restaurando ${lawObj.shortName}...`);
            await saveLawToCloud(currentUser.uid, lawObj, {
              skipChunkCleanup: true,
              onProgress: (done, total) => {
                setSyncStatus('saving', `Restaurando ${lawObj.shortName} (bloco ${done} de ${total})...`);
              }
            });

            cleanLawIndex.push({
              id: lid,
              subjectId: sid,
              shortName: lawObj.shortName,
              title: lawObj.title,
              subtitle: lawObj.subtitle,
              order: lawObj.order,
              articleCount: hydratedArticles.length
            });
          }

          const firstLaw = cleanLawIndex[0] || null;
          await setDoc(workspaceDocRef(currentUser.uid), {
            preferences: {
              darkMode: parsed.workspace?.preferences?.darkMode !== undefined
                ? Boolean(parsed.workspace.preferences.darkMode)
                : true,
              fontSize: Number(parsed.workspace?.preferences?.fontSize) || 16,
              fontFamily: parsed.workspace?.preferences?.fontFamily === 'serif' ? 'serif' : 'sans',
              activeSubjectId: firstLaw ? firstLaw.subjectId : cleanSubjects[0].id,
              activeLawId: firstLaw ? firstLaw.id : ''
            },
            subjects: cleanSubjects,
            lawIndex: cleanLawIndex,
            updatedAt: Date.now()
          });

          closeModal('backupModal');
          setSyncStatus('synced');
          showToast('Backup restaurado e sincronizado na nuvem!');
        } catch (err) {
          console.error('Erro ao restaurar backup JSON:', err);
          setSyncStatus('error', 'Offline / Erro');
          showToast(err?.message || 'Erro ao importar arquivo JSON.', 'error');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    // -----------------------------------------------------------------------
    // 15. EXPOSIÇÃO DOS HANDLERS E OBSERVADOR DE AUTENTICAÇÃO
    // -----------------------------------------------------------------------
    Object.assign(window, {
      handleEmailLogin,
      handleGoogleLogin,
      handleSignOut,
      toggleSidebar,
      toggleAccountMenu,
      toggleDarkMode,
      changeFontSize,
      toggleFontFamily,
      selectLaw,
      handleSearch,
      clearSearch,
      handleJumpToArticle,
      loadMoreArticles,
      showAllArticles,
      toggleAnnotatedFilter,
      toggleModsFilter,
      resetAllFilters,
      toggleEditArticle,
      handleSafePaste,
      handleArticleEditInput,
      finishEditing,
      execFormat,
      applyHighlight,
      applyTextColor,
      confirmRestoreOriginal,
      toggleNotes,
      updateArticleNote,
      toggleMods,
      toggleModForm,
      handleAddModification,
      deleteModification,
      openSubjectModal,
      handleCreateSubject,
      openRenameSubjectModal,
      handleRenameSubject,
      confirmDeleteSubject,
      confirmDeleteLaw,
      openAddArticleModal,
      handleAddArticle,
      confirmDeleteArticle,
      openImportModal,
      toggleNewImportSubjectField,
      handleImportFileSelected,
      updateImportPreview,
      handleImportLaw,
      cleanMarkdownTagsInActiveLaw,
      openBackupModal,
      exportBackupJSON,
      importBackupJSON,
      closeModal,
      closeConfirmModal
    });

    // Fecha menus/modais ao clicar fora ou pressionar ESC
    document.addEventListener('click', e => {
      const dropdown = document.getElementById('accountDropdown');
      const btn = document.getElementById('accountMenuBtn');
      if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && !btn?.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        ['subjectModal', 'renameSubjectModal', 'addArticleModal', 'importModal', 'backupModal', 'confirmModal'].forEach(closeModal);
        document.getElementById('accountDropdown')?.classList.add('hidden');
      }
    });

    // Estado inicial de carregamento enquanto o Firebase Auth verifica a sessão
    renderAuthLoading();

    // Gate obrigatório de segurança: só monta o app após confirmação do usuário autenticado
    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        await startCloudSync(user);
      } else {
        teardownAndWipeSession();
      }
    });
  </script>
