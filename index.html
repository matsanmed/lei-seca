    body {

    }

    /* Tipografia jurídica nos cartões */
    .article-body {
      line-height: 1.78;
      word-break: break-word;
    }
    .article-body.font-reading-serif {
      font-family: 'Merriweather', Georgia, serif;
      line-height: 1.88;
    }
    .article-body p {
      margin-bottom: 0.72rem;
    }
    .article-body p:last-child {
      margin-bottom: 0;
    }
    .article-body .law-paragrafo {
      padding-left: 0.6rem;
    }
    .article-body .law-inciso {
      padding-left: 1.35rem;
    }
    .article-body .law-alinea {
      padding-left: 2.55rem;
    }

      outline: none;
    }

    /* Garante leitura nítida em trechos grifados tanto no modo claro quanto no escuro */
    .article-body span[style*="background-color"],
    .article-body mark {
      color: #0f172a !important;
      padding: 0.05rem 0.22rem;
      border-radius: 0.25rem;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .article-body span[style*="background-color: transparent"],
    .article-body span[style*="background-color: rgba(0, 0, 0, 0)"] {
      color: inherit !important;
      padding: 0;
    }

    /* Barra de rolagem discreta */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);

    }

    @keyframes jumpPulse {

      border-color: #6366f1 !important;

    // -----------------------------------------------------------------------
    // 4. SANITIZAÇÃO RIGOROSA CONTRA XSS E OTIMIZAÇÃO DE ARMAZENAMENTO
    // -----------------------------------------------------------------------
    const ALLOWED_TAGS = new Set([
      'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'SPAN', 'MARK',
      'BR', 'P', 'DIV', 'UL', 'OL', 'LI'
    ]);
    const BLOCKED_TAGS_WITH_BODY = new Set([
      'SCRIPT', 'IFRAME', 'STYLE', 'OBJECT', 'EMBED', 'LINK', 'META',
      'SVG', 'MATH', 'FORM', 'INPUT', 'TEXTAREA', 'BUTTON', 'TEMPLATE', 'BASE', 'NOSCRIPT'
    ]);
    const ALLOWED_CLASSES = new Set([
      'law-paragrafo', 'law-inciso', 'law-alinea',
      'text-xs', 'text-slate-500', 'dark:text-slate-400'
    ]);
    const ALLOWED_CSS_PROPS = new Set([
      'background-color', 'color', 'font-weight', 'font-style', 'text-decoration'
    ]);

    /**
     * Valida valores CSS inline para bloquear url(), expression(), javascript:, etc.
     */
    function isSafeCssValue(prop, value) {
      const clean = String(value || '').trim().toLowerCase();
      if (!clean || clean.length > 64) return false;
      if (/url\s*\(|expression\s*\(|javascript:|vbscript:|data:|@import|behavior:/i.test(clean)) {
        return false;
      }
      if (prop === 'color' || prop === 'background-color') {
        return (
          clean === 'transparent' ||
          clean === 'inherit' ||
          /^#[0-9a-f]{3,8}$/i.test(clean) ||
          /^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)$/i.test(clean) ||
          /^[a-z]{3,20}$/i.test(clean)
        );
      }
      if (prop === 'font-weight') {
        return /^(normal|bold|bolder|lighter|[1-9]00)$/.test(clean);
      }
      if (prop === 'font-style') {
        return /^(normal|italic|oblique)$/.test(clean);
      }
      if (prop === 'text-decoration') {
        return /^(none|underline|line-through|overline)(\s+(solid|dotted|dashed))?$/.test(clean);
      }
      return false;
    }

    /**
     * Sanitiza qualquer HTML antes de renderizar no DOM ou gravar no Firestore.
     * Remove scripts, iframes, styles, atributos on* e links javascript:.
     */
    function sanitizeHtml(dirtyHtml) {
      if (!dirtyHtml) return '';
      const parser = new DOMParser();
      const parsedDoc = parser.parseFromString(String(dirtyHtml), 'text/html');

      function cleanNode(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return document.createTextNode(node.textContent || '');
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return document.createDocumentFragment();
        }

        const tag = node.tagName.toUpperCase();

        // Bloqueia completamente elementos perigosos e seu conteúdo interno
        if (BLOCKED_TAGS_WITH_BODY.has(tag)) {
          return document.createDocumentFragment();
        }

        // Converte <font color="..."> (gerado por execCommand em alguns navegadores) em <span> seguro
        if (tag === 'FONT') {
          const span = document.createElement('span');
          const c = node.getAttribute('color');
          if (c && isSafeCssValue('color', c)) {
            span.style.color = c.trim();
          }
          for (const child of Array.from(node.childNodes)) {
            span.appendChild(cleanNode(child));
          }
          return span;
        }

        // Se a tag não está na whitelist, preserva apenas os nós filhos higienizados
        if (!ALLOWED_TAGS.has(tag)) {
          const frag = document.createDocumentFragment();
          for (const child of Array.from(node.childNodes)) {
            frag.appendChild(cleanNode(child));
          }
          return frag;
        }

        const safeEl = document.createElement(tag.toLowerCase());

        // Permite apenas classes jurídicas/tipográficas conhecidas
        if (node.hasAttribute('class')) {
          const safeClasses = (node.getAttribute('class') || '')
            .split(/\s+/)
            .filter(cls => ALLOWED_CLASSES.has(cls));
          if (safeClasses.length > 0) {
            safeEl.setAttribute('class', safeClasses.join(' '));
          }
        }

        // Permite apenas propriedades CSS seguras (descarta qualquer atributo on*, href, src, etc.)
        if (node.hasAttribute('style')) {
          const rawStyle = node.getAttribute('style') || '';
          const safeDecls = [];
          rawStyle.split(';').forEach(pair => {
            const colonIdx = pair.indexOf(':');
            if (colonIdx === -1) return;
            const prop = pair.slice(0, colonIdx).trim().toLowerCase();
            const val = pair.slice(colonIdx + 1).trim();
            if (ALLOWED_CSS_PROPS.has(prop) && isSafeCssValue(prop, val)) {
              safeDecls.push(`${prop}: ${val}`);
            }
          });
          if (safeDecls.length > 0) {
            safeEl.setAttribute('style', safeDecls.join('; '));
          }
        }

        for (const child of Array.from(node.childNodes)) {
          safeEl.appendChild(cleanNode(child));
        }
        return safeEl;
      }

      const container = document.createElement('div');
      for (const child of Array.from(parsedDoc.body.childNodes)) {
        container.appendChild(cleanNode(child));
      }
      return container.innerHTML;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = sanitizeHtml(html || '');
      return tmp.textContent || tmp.innerText || '';
    }

    function generateId(prefix = 'id') {

    /**

    function getUtf8ByteSize(obj) {

    /**
     * Otimiza um artigo para gravação no Firestore:
     * - Omite originalHtml quando o artigo ainda é idêntico ao original (~50% menor)
     * - Omite note quando vazio
     * - Omite modifications quando vazio
     * - Omite sectionHeader quando vazio
     */
    function serializeArticleForStorage(art) {
      const cleanHtml = sanitizeHtml(art.html || '');
      const cleanOrig = sanitizeHtml(art.originalHtml != null ? art.originalHtml : cleanHtml);
      const compact = {
        id: art.id || generateId('art'),
        number: String(art.number || ''),
        html: cleanHtml
      };
      if (art.sectionHeader && String(art.sectionHeader).trim()) {
        compact.sectionHeader = String(art.sectionHeader).trim();
      }
      if (cleanOrig !== cleanHtml) {
        compact.originalHtml = cleanOrig;
      }
      const noteText = String(art.note ?? art.notes ?? '');
      if (noteText.trim().length > 0) {
        compact.note = noteText;
      }
      if (Array.isArray(art.modifications) && art.modifications.length > 0) {
        compact.modifications = art.modifications;
      }
      return compact;
    }

    /**
     * Hidrata um artigo vindo do Firestore para memória (compatível com formato antigo e compacto).
     */
    function hydrateArticleFromStorage(raw) {
      const cleanHtml = sanitizeHtml(raw?.html || '');
      const cleanOrig = raw?.originalHtml != null ? sanitizeHtml(raw.originalHtml) : cleanHtml;
      return {
        id: raw?.id || generateId('art'),
        number: String(raw?.number || ''),
        sectionHeader: String(raw?.sectionHeader || ''),
        originalHtml: cleanOrig,
        html: cleanHtml,
        note: String(raw?.note ?? raw?.notes ?? ''),
        modifications: Array.isArray(raw?.modifications) ? raw.modifications : []

              originalHtml:
                `<p><strong>Art. 4º</strong> Esta Lei não se aplica ao tratamento de dados pessoais:</p>` +
                `<p class="law-inciso">I - realizado por pessoa natural para fins exclusivamente particulares e não econômicos;</p>` +
                `<p class="law-inciso">II - realizado para fins exclusivamente:</p>` +
                `<p class="law-alinea">a) jornalístico e artísticos; ou</p>` +
                `<p class="law-alinea">b) acadêmicos, aplicando-se a esta hipótese os arts. 7º e 11 desta Lei;</p>` +
                `<p class="law-inciso">III - realizado para fins exclusivos de:</p>` +
                `<p class="law-alinea">a) segurança pública;</p>` +
                `<p class="law-alinea">b) defesa nacional;</p>` +
                `<p class="law-alinea">c) segurança do Estado; ou</p>` +
                `<p class="law-alinea">d) atividades de investigação e repressão de infrações penais; ou</p>` +
                `<p class="law-inciso">IV - provenientes de fora do território nacional e que não sejam objeto de comunicação, uso compartilhado de dados com agentes de tratamento brasileiros ou objeto de transferência internacional de dados com outro país que não o de proveniência, desde que o país de proveniência proporcione grau de proteção de dados pessoais adequado ao previsto nesta Lei.</p>` +
                `<p class="law-paragrafo"><strong>§ 1º</strong> O tratamento de dados pessoais previsto no inciso III será regido por legislação específica, que deverá prever medidas proporcionais e estritamente necessárias ao atendimento do interesse público, observados o devido processo legal, os princípios gerais de proteção e os direitos do titular previstos nesta Lei.</p>` +
                `<p class="law-paragrafo"><strong>§ 2º</strong> É vedado o tratamento dos dados a que se refere o inciso III do caput deste artigo por pessoa de direito privado, exceto em procedimentos sob tutela de pessoa jurídica de direito público, que serão objeto de informe específico à autoridade nacional e que deverão observar a limitação imposta no § 4º deste artigo.</p>` +

                `<p class="law-paragrafo"><strong>§ 4º</strong> Em nenhum caso a totalidade dos dados pessoais de banco de dados de que trata o inciso III do caput deste artigo poderá ser tratada por pessoa de direito privado, salvo por aquela que possua capital integralmente constituído pelo poder público. <span class="text-xs text-slate-500 dark:text-slate-400">(Redação dada pela Lei nº 13.853, de 2019)</span></p>`,

            {
              id: 'lgpd-art-5',
              number: 'Art. 5º',
              sectionHeader: '',
              originalHtml:
                `<p><strong>Art. 5º</strong> Para os fins desta Lei, considera-se:</p>` +
                `<p class="law-inciso">I - dado pessoal: informação relacionada a pessoa natural identificada ou identificável;</p>` +
                `<p class="law-inciso">II - dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural;</p>` +
                `<p class="law-inciso">III - dado anonimizado: dado relativo a titular que não possa ser identificado, considerando a utilização de meios técnicos razoáveis e disponíveis na ocasião de seu tratamento;</p>` +
                `<p class="law-inciso">IV - banco de dados: conjunto estruturado de dados pessoais, estabelecido em um ou em vários locais, em suporte eletrônico ou físico;</p>` +
                `<p class="law-inciso">V - titular: pessoa natural a quem se referem os dados pessoais que são objeto de tratamento;</p>` +
                `<p class="law-inciso">VI - controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais;</p>` +
                `<p class="law-inciso">VII - operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador;</p>` +
                `<p class="law-inciso">VIII - encarregado: pessoa indicada pelo controlador e operador para atuar como canal de comunicação entre o controlador, os titulares dos dados e a Agência Nacional de Proteção de Dados (ANPD); <span class="text-xs text-slate-500 dark:text-slate-400">(Redação dada pela Lei nº 15.352, de 2026)</span></p>` +
                `<p class="law-inciso">IX - agentes de tratamento: o controlador e o operador;</p>` +
                `<p class="law-inciso">X - tratamento: toda operação realizada com dados pessoais, como as que se referem a coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação ou controle da informação, modificação, comunicação, transferência, difusão ou extração;</p>` +
                `<p class="law-inciso">XI - anonimização: utilização de meios técnicos razoáveis e disponíveis no momento do tratamento, por meio dos quais um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo;</p>` +
                `<p class="law-inciso">XII - consentimento: manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada;</p>` +
                `<p class="law-inciso">XIII - bloqueio: suspensão temporária de qualquer operação de tratamento, mediante guarda do dado pessoal ou do banco de dados;</p>` +
                `<p class="law-inciso">XIV - eliminação: exclusão de dado ou de conjunto de dados armazenados em banco de dados, independentemente do procedimento empregado;</p>` +
                `<p class="law-inciso">XV - transferência internacional de dados: transferência de dados pessoais para país estrangeiro ou organismo internacional do qual o país seja membro;</p>` +
                `<p class="law-inciso">XVI - uso compartilhado de dados: comunicação, difusão, transferência internacional, interconexão de dados pessoais ou tratamento compartilhado de bancos de dados pessoais por órgãos e entidades públicos no cumprimento de suas competências legais, ou entre esses e entes privados, reciprocamente, com autorização específica, para uma ou mais modalidades de tratamento permitidas por esses entes públicos, ou entre entes privados;</p>` +
                `<p class="law-inciso">XVII - relatório de impacto à proteção de dados pessoais: documentação do controlador que contém a descrição dos processos de tratamento de dados pessoais que podem gerar riscos às liberdades civis e aos direitos fundamentais, bem como medidas, salvaguardas e mecanismos de mitigação de risco;</p>` +
                `<p class="law-inciso">XVIII - órgão de pesquisa: órgão ou entidade da administração pública direta ou indireta ou pessoa jurídica de direito privado sem fins lucrativos legalmente constituída sob as leis brasileiras, com sede e foro no País, que inclua em sua missão institucional ou em seu objetivo social ou estatutário a pesquisa básica ou aplicada de caráter histórico, científico, tecnológico ou estatístico; e <span class="text-xs text-slate-500 dark:text-slate-400">(Redação dada pela Lei nº 13.853, de 2019)</span></p>` +
                `<p class="law-inciso">XIX - autoridade nacional: entidade da administração pública responsável por zelar, implementar e fiscalizar o cumprimento desta Lei em todo o território nacional. <span class="text-xs text-slate-500 dark:text-slate-400">(Redação dada pela Lei nº 15.352, de 2026)</span></p>`,

            {
              id: 'lgpd-art-6',
              number: 'Art. 6º',
              sectionHeader: '',
              originalHtml:
                `<p><strong>Art. 6º</strong> As atividades de tratamento de dados pessoais deverão observar a boa-fé e os seguintes princípios:</p>` +
                `<p class="law-inciso">I - finalidade: realização do tratamento para propósitos legítimos, específicos, explícitos e informados ao titular, sem possibilidade de tratamento posterior de forma incompatível com essas finalidades;</p>` +
                `<p class="law-inciso">II - adequação: compatibilidade do tratamento com as finalidades informadas ao titular, de acordo com o contexto do tratamento;</p>` +
                `<p class="law-inciso">III - necessidade: limitação do tratamento ao mínimo necessário para a realização de suas finalidades, com abrangência dos dados pertinentes, proporcionais e não excessivos em relação às finalidades do tratamento de dados;</p>` +
                `<p class="law-inciso">IV - livre acesso: garantia, aos titulares, de consulta facilitada e gratuita sobre a forma e a duração do tratamento, bem como sobre a integralidade de seus dados pessoais;</p>` +
                `<p class="law-inciso">V - qualidade dos dados: garantia, aos titulares, de exatidão, clareza, relevância e atualização dos dados, de acordo com a necessidade e para o cumprimento da finalidade de seu tratamento;</p>` +
                `<p class="law-inciso">VI - transparência: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial;</p>` +
                `<p class="law-inciso">VII - segurança: utilização de medidas técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou difusão;</p>` +
                `<p class="law-inciso">VIII - prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais;</p>` +
                `<p class="law-inciso">IX - não discriminação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos;</p>` +

            {
              id: 'lgpd-art-7',
              number: 'Art. 7º',
              sectionHeader: 'CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS • Seção I',
              originalHtml:
                `<p><strong>Art. 7º</strong> O tratamento de dados pessoais somente poderá ser realizado nas seguintes hipóteses:</p>` +
                `<p class="law-inciso">I - mediante o fornecimento de consentimento pelo titular;</p>` +
                `<p class="law-inciso">II - para o cumprimento de obrigação legal ou regulatória pelo controlador;</p>` +

    function showAuthError(message) {
      const box = document.getElementById('authErrorBox');
      if (!box) return;
      if (!message) {
        box.classList.add('hidden');
        box.textContent = '';
      } else {
        box.textContent = message;
        box.classList.remove('hidden');
      }
    }

    function translateFirebaseError(err) {
      const code = err?.code || '';
      if (
        code.includes('invalid-credential') ||
        code.includes('wrong-password') ||
        code.includes('user-not-found') ||
        code.includes('invalid-email')
      ) {
        return 'Credenciais inválidas. Verifique o e-mail e a senha cadastrados no Firebase Authentication.';
      }
      if (code.includes('unauthorized-domain')) {
        return 'Domínio não autorizado no Firebase. Adicione este domínio em Authentication → Settings → Authorized domains.';
      }
      if (code.includes('network-request-failed')) {
        return 'Erro de rede. Verifique sua conexão com a internet e tente novamente.';
      }
      if (code.includes('too-many-requests')) {
        return 'Muitas tentativas consecutivas. Aguarde alguns minutos antes de tentar novamente.';
      }
      if (code.includes('popup-closed-by-user')) {
        return 'A janela de login do Google foi fechada antes da conclusão.';
      }
      if (code.includes('popup-blocked')) {
        return 'O navegador bloqueou o pop-up do Google. Permita pop-ups para este site ou use E-mail e Senha.';
      }
      if (code.includes('operation-not-allowed')) {
        return 'Este método de login não está ativado no Firebase Authentication.';
      }
      if (code.includes('permission-denied')) {
        return 'Permissão negada pelas Regras de Segurança do Firestore. Verifique se o seu UID está autorizado nas regras do banco.';
      }
      return err?.message || 'Erro inesperado ao comunicar com o Firebase.';
    }

    async function handleEmailLogin(event) {
      event.preventDefault();
      showAuthError('');
      const email = document.getElementById('loginEmail')?.value.trim() || '';
      const password = document.getElementById('loginPassword')?.value || '';
      const btn = document.getElementById('loginSubmitBtn');
      if (btn) btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error('Erro no login por e-mail:', err);
        showAuthError(translateFirebaseError(err));
        if (btn) btn.disabled = false;
      }
    }

    async function handleGoogleLogin() {
      showAuthError('');
      const btn = document.getElementById('googleLoginBtn');
      if (btn) btn.disabled = true;

      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error('Erro no login com Google:', err);
        showAuthError(translateFirebaseError(err));
        if (btn) btn.disabled = false;
      }
    }

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="p-5 space-y-3">
              <h3 id="confirmTitle" class="text-base font-bold text-slate-900 dark:text-white">Confirmar ação</h3>
              <p id="confirmMessage" class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed"></p>
              <div class="flex justify-end gap-2 pt-3">
                <button type="button" onclick="closeConfirmModal()" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
                <button type="button" id="confirmActionBtn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-700 text-white shadow-sm">Confirmar</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // -----------------------------------------------------------------------
    // 8. SINCRONIZAÇÃO EM TEMPO REAL COM FIRESTORE (COM CHUNKING AUTOMÁTICO)
    // -----------------------------------------------------------------------
    function setSyncStatus(status, customLabel = '') {
      const badge = document.getElementById('syncStatusBadge');
      if (!badge) return;

      if (status === 'saving') {
        badge.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium text-amber-600 dark:text-amber-400';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span><span>${escapeHtml(customLabel || 'Salvando...')}</span>`;
      } else if (status === 'error') {
        badge.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium text-rose-600 dark:text-rose-400';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span><span>${escapeHtml(customLabel || 'Offline / Erro')}</span>`;
      } else {
        badge.className = 'inline-flex items-center gap-1.5 text-[11px] font-medium text-emerald-600 dark:text-emerald-400';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span>Sincronizado na nuvem</span>`;
      }
    }

    function showFirestoreBanner(msg) {
      firestorePermissionError = msg || '';
      const banner = document.getElementById('firestoreErrorBanner');
      if (!banner) return;
      if (!msg) {
        banner.classList.add('hidden');
        banner.textContent = '';
      } else {
        banner.textContent = msg;
        banner.classList.remove('hidden');
      }
    }

    /**
     * Divide um array de artigos já serializados em blocos de no máximo maxBytes UTF-8.
     */
    function splitArticlesIntoChunks(serializedArticles, maxBytes = CHUNK_TARGET_BYTES) {
      const chunks = [];
      let currentChunk = [];
      let currentBytes = 96; // margem para { index, articles: [], updatedAt }

      for (const art of serializedArticles) {
        const artBytes = getUtf8ByteSize(art) + 2;
        if (currentChunk.length > 0 && (currentBytes + artBytes) > maxBytes) {
          chunks.push(currentChunk);
          currentChunk = [art];
          currentBytes = 96 + artBytes;
        } else {
          currentChunk.push(art);
          currentBytes += artBytes;
        }
      }
      if (currentChunk.length > 0) {
        chunks.push(currentChunk);
      }
      return chunks;
    }

    /**
     * Remove todos os documentos da subcoleção `chunks` de uma lei (em lotes seguros).
     */
    async function deleteLawChunks(uid, lawId, minIndex = 0) {
      const snap = await getDocs(lawChunksCollectionRef(uid, lawId));
      const docsToDelete = [];
      snap.forEach(d => {
        const data = d.data();
        const idx = typeof data.index === 'number'
          ? data.index
          : Number(d.id.replace('chunk_', '')) || 0;
        if (idx >= minIndex) {
          docsToDelete.push(d.ref);
        }
      });

      for (let i = 0; i < docsToDelete.length; i += MAX_BATCH_OPS) {
        const batch = writeBatch(db);
        docsToDelete.slice(i, i + MAX_BATCH_OPS).forEach(ref => batch.delete(ref));
        await batch.commit();
      }
    }

    /**
     * Grava uma lei no Cloud Firestore com:
     * 1) Otimização de payload (sem duplicar originalHtml / campos vazios)
     * 2) Edição rápida de chunk único quando apenas 1 artigo foi alterado em lei fragmentada
     * 3) Chunking automático em subcoleção `chunks/chunk_{i}` quando ultrapassar 350 KB
     */
    async function saveLawToCloud(uid, lawObj, options = {}) {
      const { onProgress = null, dirtyArticleId = null, skipChunkCleanup = false } = options;
      const now = Date.now();
      const allArticles = Array.isArray(lawObj.articles) ? lawObj.articles : [];

      // Caminho rápido: edição de 1 único artigo em uma lei já fragmentada
      if (
        dirtyArticleId &&
        lawObj.chunked === true &&
        Array.isArray(lawObj._chunkArticleIds) &&
        lawObj._chunkArticleIds.length > 0
      ) {
        const targetChunkIdx = lawObj._chunkArticleIds.findIndex(ids => ids.includes(dirtyArticleId));
        if (targetChunkIdx !== -1) {
          const idSet = new Set(lawObj._chunkArticleIds[targetChunkIdx]);
          const chunkArticles = allArticles
            .filter(a => idSet.has(a.id))
            .map(serializeArticleForStorage);

          const chunkPayload = {
            index: targetChunkIdx,
            articles: chunkArticles,
            updatedAt: now
          };

          if (getUtf8ByteSize(chunkPayload) <= SINGLE_CHUNK_MAX_BYTES) {
            const batch = writeBatch(db);
            batch.set(lawChunkDocRef(uid, lawObj.id, targetChunkIdx), chunkPayload);
            batch.set(lawDocRef(uid, lawObj.id), {
              articleCount: allArticles.length,
              updatedAt: now
            }, { merge: true });
            await batch.commit();
            lawObj.updatedAt = now;
            lastSavedLawSignature = `${lawObj.id}:${now}`;
            return { chunked: true, chunkCount: lawObj._chunkArticleIds.length, fastUpdate: true };
          }
          // Se o chunk ultrapassou 500 KB após a edição, segue para re-fragmentação completa abaixo
        }
      }

      const serializedArticles = allArticles.map(serializeArticleForStorage);
      const baseMeta = {
        id: lawObj.id,
        subjectId: lawObj.subjectId,
        shortName: String(lawObj.shortName || lawObj.title || 'Lei'),
        title: String(lawObj.title || 'Lei'),
        subtitle: String(lawObj.subtitle || ''),
        order: Number(lawObj.order) || 1,
        articleCount: serializedArticles.length,
        updatedAt: now
      };

      const singleDocPayload = {
        ...baseMeta,
        chunked: false,
        articles: serializedArticles
      };
      const totalBytes = getUtf8ByteSize(singleDocPayload);

      // Lei pequena (<= 350 KB): salva diretamente no documento pai
      if (totalBytes <= CHUNK_TARGET_BYTES) {
        if (lawObj.chunked === true && !skipChunkCleanup) {
          await deleteLawChunks(uid, lawObj.id, 0);
        }
        await setDoc(lawDocRef(uid, lawObj.id), singleDocPayload);
        lawObj.chunked = false;
        lawObj.chunkCount = 0;
        lawObj._chunkArticleIds = [];
        lawObj.updatedAt = now;
        lastSavedLawSignature = `${lawObj.id}:${now}`;
        return { chunked: false, chunkCount: 0, fastUpdate: false };
      }

      // Lei grande (> 350 KB): fragmenta automaticamente em subcoleção `chunks`
      const chunks = splitArticlesIntoChunks(serializedArticles, CHUNK_TARGET_BYTES);
      const totalChunks = chunks.length;

      // Grava blocos em lotes pequenos (seguro contra limite de tamanho de requisição e permite feedback)
      let i = 0;
      while (i < totalChunks) {
        const batch = writeBatch(db);
        let opsInBatch = 0;
        let bytesInBatch = 0;

        while (i < totalChunks && opsInBatch < MAX_BATCH_OPS) {
          const payload = {
            index: i,
            articles: chunks[i],
            updatedAt: now
          };
          const bSize = getUtf8ByteSize(payload);
          if (opsInBatch > 0 && bytesInBatch + bSize > 1200000) break;

          if (typeof onProgress === 'function') {
            onProgress(i + 1, totalChunks);
          }
          batch.set(lawChunkDocRef(uid, lawObj.id, i), payload);
          opsInBatch++;
          bytesInBatch += bSize;
          i++;
        }

        await batch.commit();
      }

      // Remove blocos excedentes de versões anteriores caso o novo número de blocos seja menor
      if (!skipChunkCleanup) {
        await deleteLawChunks(uid, lawObj.id, totalChunks);
      }

      // Grava o documento pai somente com metadados (SEM array articles)
      const parentMetaDoc = {
        ...baseMeta,
        chunked: true,
        chunkCount: totalChunks
      };
      await setDoc(lawDocRef(uid, lawObj.id), parentMetaDoc);

      lawObj.chunked = true;
      lawObj.chunkCount = totalChunks;
      lawObj._chunkArticleIds = chunks.map(c => c.map(a => a.id));
      lawObj.updatedAt = now;
      lastSavedLawSignature = `${lawObj.id}:${now}`;
      return { chunked: true, chunkCount: totalChunks, fastUpdate: false };
    }

    /**
     * Carrega uma lei completa (suporta tanto formato legado não-fragmentado quanto `chunked: true`).
     */
    async function loadLawArticlesFromCloud(uid, lawId, rawParentData) {
      if (rawParentData.chunked === true) {
        const chunksSnap = await getDocs(lawChunksCollectionRef(uid, lawId));
        const chunkList = [];
        chunksSnap.forEach(d => {
          const data = d.data();
          const idx = typeof data.index === 'number'
            ? data.index
            : Number(d.id.replace('chunk_', '')) || 0;
          chunkList.push({
            index: idx,
            articles: Array.isArray(data.articles) ? data.articles : []
          });
        });
        chunkList.sort((a, b) => a.index - b.index);

        const hydrated = [];
        const chunkArticleIds = [];
        for (const c of chunkList) {
          const ids = [];
          for (const rawArt of c.articles) {
            const art = hydrateArticleFromStorage(rawArt);
            hydrated.push(art);
            ids.push(art.id);
          }
          chunkArticleIds.push(ids);
        }
        return {
          articles: hydrated,
          chunked: true,
          chunkCount: chunkList.length,
          _chunkArticleIds: chunkArticleIds
        };
      }

      // Retrocompatibilidade: lei salva em documento único
      const rawArticles = Array.isArray(rawParentData.articles) ? rawParentData.articles : [];
      return {
        articles: rawArticles.map(hydrateArticleFromStorage),
        chunked: false,
        chunkCount: 0,
        _chunkArticleIds: []
      };
    }

    /**
     * Garante o seed inicial no Firestore na primeira vez que o usuário acessa.
     */
    async function seedWorkspaceIfNeeded(uid) {
      if (!currentUser || currentUser.uid !== uid || isSeeding) return;
      isSeeding = true;
      try {
        const wsSnap = await getDoc(workspaceDocRef(uid));
        if (!wsSnap.exists()) {
          setSyncStatus('saving', 'Preparando caderno...');
          const starter = buildStarterSeed();
          const batch = writeBatch(db);
          const now = Date.now();

          batch.set(workspaceDocRef(uid), {
            preferences: {
              darkMode: true,
              fontSize: 16,
              fontFamily: 'sans',
              activeSubjectId: 'sub-adm',
              activeLawId: 'law-lgpd'
            },
            subjects: starter.subjects,
            lawIndex: starter.lawIndex,
            createdAt: now,
            updatedAt: now
          });

          starter.laws.forEach(law => {
            batch.set(lawDocRef(uid, law.id), {
              id: law.id,
              subjectId: law.subjectId,
              shortName: law.shortName,
              title: law.title,
              subtitle: law.subtitle,
              order: law.order,
              chunked: false,
              articleCount: law.articles.length,
              articles: law.articles.map(serializeArticleForStorage),
              createdAt: now,
              updatedAt: now
            });
          });

          await batch.commit();
        }
        showFirestoreBanner('');
      } catch (err) {
        console.error('Erro ao inicializar workspace no Firestore:', err);
        const msg = translateFirebaseError(err);
        setSyncStatus('error', 'Offline / Erro');
        showFirestoreBanner(msg);
        showToast(msg, 'error');
      } finally {
        isSeeding = false;
      }
    }

    /**
     * Inicia o listener em tempo real do documento `meta/workspace`.
     */
    async function startCloudSync(user) {
      if (!user) return;
      mountAuthenticatedAppShell(user);
      setSyncStatus('saving', 'Conectando...');

      await seedWorkspaceIfNeeded(user.uid);
      if (!currentUser || currentUser.uid !== user.uid) return;

      if (unsubWorkspace) unsubWorkspace();
      unsubWorkspace = onSnapshot(
        workspaceDocRef(user.uid),
        snap => {
          if (!currentUser) return;
          showFirestoreBanner('');

          if (snap.exists()) {
            const data = snap.data();
            workspace = {
              preferences: {
                darkMode: data.preferences?.darkMode !== undefined ? Boolean(data.preferences.darkMode) : true,
                fontSize: Number(data.preferences?.fontSize) || 16,
                fontFamily: data.preferences?.fontFamily === 'serif' ? 'serif' : 'sans',
                activeSubjectId: data.preferences?.activeSubjectId || '',
                activeLawId: data.preferences?.activeLawId || ''
              },
              subjects: Array.isArray(data.subjects) ? data.subjects : [],
              lawIndex: Array.isArray(data.lawIndex) ? data.lawIndex : []
            };

            workspace.subjects.sort((a, b) => (a.order || 999) - (b.order || 999));
            workspace.lawIndex.sort((a, b) => (a.order || 999) - (b.order || 999));

            // Garante que existe uma lei ativa válida se houver leis cadastradas
            if (!workspace.lawIndex.some(l => l.id === workspace.preferences.activeLawId)) {
              const firstLaw = workspace.lawIndex[0] || null;
              workspace.preferences.activeLawId = firstLaw ? firstLaw.id : '';
              workspace.preferences.activeSubjectId = firstLaw
                ? firstLaw.subjectId
                : (workspace.subjects[0]?.id || '');
            }

            applyVisualPreferences();
            renderSidebar();
            updateFilterButtons();
            subscribeToActiveLaw(workspace.preferences.activeLawId);
          }

          if (pendingWrites === 0) setSyncStatus('synced');
        },
        err => {
          console.error('Erro no listener do workspace:', err);
          const msg = translateFirebaseError(err);
          setSyncStatus('error', 'Offline / Erro');
          showFirestoreBanner(msg);
        }
      );
    }

    /**
     * Assina em tempo real (`onSnapshot`) a lei atualmente aberta (com suporte a chunks).
     */
    function subscribeToActiveLaw(lawId) {
      if (!currentUser) return;

      if (!lawId) {
        if (unsubActiveLaw) {
          unsubActiveLaw();
          unsubActiveLaw = null;
        }
        currentSubscribedLawId = null;
        activeLawDoc = null;
        renderArticles();
        return;
      }

      if (currentSubscribedLawId === lawId && unsubActiveLaw) {
        renderHeader();
        return;
      }

      if (unsubActiveLaw) {
        unsubActiveLaw();
        unsubActiveLaw = null;
      }

      currentSubscribedLawId = lawId;
      activeLawDoc = null;
      visibleArticlesLimit = INITIAL_VISIBLE_ARTICLES;
      renderLoadingArticles();

      unsubActiveLaw = onSnapshot(
        lawDocRef(currentUser.uid, lawId),
        async snap => {
          if (!currentUser || currentSubscribedLawId !== lawId) return;

          if (!snap.exists()) {
            activeLawDoc = null;
            renderArticles();
            return;
          }

          if (hasLocalUnsavedLawChanges) {
            return;
          }

          const raw = snap.data();
          const snapSig = `${snap.id}:${raw.updatedAt || 0}`;
          if (activeLawDoc && activeLawDoc.id === snap.id && snapSig === lastSavedLawSignature) {
            if (pendingWrites === 0) setSyncStatus('synced');
            return;
          }

          try {
            if (raw.chunked === true && !activeLawDoc) {
              setSyncStatus('saving', 'Carregando blocos...');
            }
            const loaded = await loadLawArticlesFromCloud(currentUser.uid, snap.id, raw);
            if (!currentUser || currentSubscribedLawId !== lawId || hasLocalUnsavedLawChanges) return;

            activeLawDoc = {
              id: snap.id,
              subjectId: raw.subjectId || '',
              shortName: String(raw.shortName || raw.title || 'Lei'),
              title: String(raw.title || 'Lei sem título'),
              subtitle: String(raw.subtitle || ''),
              order: Number(raw.order) || 1,
              updatedAt: raw.updatedAt || 0,
              chunked: loaded.chunked,
              chunkCount: loaded.chunkCount,
              _chunkArticleIds: loaded._chunkArticleIds,
              articles: loaded.articles
            };

            const activeEl = document.activeElement;
            const isTypingInBody = activeEl && activeEl.classList?.contains('article-body') && activeEl.isContentEditable;
            const isTypingInNote = activeEl && activeEl.hasAttribute?.('data-note-art-id');

            if (isTypingInBody || isTypingInNote) {
              renderHeader();
            } else {
              renderArticles();
            }

            if (pendingWrites === 0) setSyncStatus('synced');
          } catch (loadErr) {
            console.error('Erro ao carregar blocos da lei:', loadErr);
            const msg = translateFirebaseError(loadErr);
            setSyncStatus('error', 'Offline / Erro');
            showFirestoreBanner(msg);
          }
        },
        err => {
          console.error('Erro no listener da lei ativa:', err);
          const msg = translateFirebaseError(err);
          setSyncStatus('error', 'Offline / Erro');
          showFirestoreBanner(msg);
        }
      );
    }

    /**
     * Salva o documento `meta/workspace` no Firestore (com debounce opcional).
     */
    function scheduleSaveWorkspace(immediate = false) {
      if (!currentUser) return;
      setSyncStatus('saving');
      clearTimeout(workspaceSaveTimer);

      const persist = async () => {
        if (!currentUser) return;
        pendingWrites++;
        try {
          await setDoc(workspaceDocRef(currentUser.uid), {
            preferences: workspace.preferences,
            subjects: workspace.subjects,
            lawIndex: workspace.lawIndex,
            updatedAt: Date.now()
          }, { merge: true });
        } catch (err) {
          console.error('Erro ao salvar workspace:', err);
          setSyncStatus('error', 'Offline / Erro');
          showToast(translateFirebaseError(err), 'error');
        } finally {
          pendingWrites = Math.max(0, pendingWrites - 1);
          if (pendingWrites === 0) setSyncStatus('synced');
        }
      };

      if (immediate) persist();
      else workspaceSaveTimer = setTimeout(persist, 450);
    }

    /**
     * Salva a lei ativa no Firestore com debounce de 600ms, sanitização XSS,
     * edição rápida de chunk único e fragmentação automática acima de 350 KB.
     */
    function scheduleSaveActiveLaw(immediate = false, dirtyArticleId = null) {
      if (!currentUser || !activeLawDoc) return;
      hasLocalUnsavedLawChanges = true;
      if (dirtyArticleId) {
        dirtyArticleIds.add(dirtyArticleId);
      } else {
        // Indica mudança estrutural (ex: adicionar/excluir artigo ou limpeza em massa)
        dirtyArticleIds.add('__FULL__');
      }

      setSyncStatus('saving');
      clearTimeout(lawSaveTimer);

      const targetLaw = activeLawDoc;

      const persist = async () => {
        if (!currentUser || !targetLaw) return;
        const singleDirtyId =
          dirtyArticleIds.size === 1 && !dirtyArticleIds.has('__FULL__')
            ? Array.from(dirtyArticleIds)[0]
            : null;
        dirtyArticleIds.clear();

        pendingWrites++;
        try {
          await saveLawToCloud(currentUser.uid, targetLaw, {
            dirtyArticleId: singleDirtyId,
            onProgress: (done, total) => {
              setSyncStatus('saving', `Salvando (bloco ${done} de ${total})...`);
            }
          });

          const idxEntry = workspace.lawIndex.find(l => l.id === targetLaw.id);
          if (idxEntry && idxEntry.articleCount !== (targetLaw.articles || []).length) {
            idxEntry.articleCount = (targetLaw.articles || []).length;
            scheduleSaveWorkspace(true);
          }

          hasLocalUnsavedLawChanges = false;
        } catch (err) {
          console.error('Erro ao salvar lei no Firestore:', err);
          setSyncStatus('error', 'Offline / Erro');
          showToast(translateFirebaseError(err), 'error');
        } finally {
          pendingWrites = Math.max(0, pendingWrites - 1);
          if (pendingWrites === 0) setSyncStatus('synced');
        }
      };

      if (immediate) persist();
      else lawSaveTimer = setTimeout(persist, 600);
    }

    /**
     * Desmonta imediatamente todos os listeners, limpa memória e apaga o DOM ao sair.
     */
    function teardownAndWipeSession() {
      if (unsubWorkspace) {
        try { unsubWorkspace(); } catch (_) {}
        unsubWorkspace = null;
      }
      if (unsubActiveLaw) {
        try { unsubActiveLaw(); } catch (_) {}
        unsubActiveLaw = null;
      }
      clearTimeout(lawSaveTimer);
      clearTimeout(workspaceSaveTimer);
      clearTimeout(searchDebounceTimer);

      currentUser = null;
      currentSubscribedLawId = null;
      activeLawDoc = null;
      editingArticleId = null;
      searchQuery = '';
      filterAnnotatedOnly = false;
      filterModsOnly = false;
      visibleArticlesLimit = INITIAL_VISIBLE_ARTICLES;
      pendingWrites = 0;
      hasLocalUnsavedLawChanges = false;
      dirtyArticleIds.clear();
      lastSavedLawSignature = '';
      firestorePermissionError = '';
      pendingConfirmCallback = null;
      renameTargetSubjectId = null;
      lastJumpKey = '';
      lastJumpMatchCursor = -1;
      openNotes.clear();
      openMods.clear();
      openModForms.clear();

      workspace = {
        preferences: {
          darkMode: true,
          fontSize: 16,
          fontFamily: 'sans',
          activeSubjectId: '',
          activeLawId: ''
        },
        subjects: [],
        lawIndex: []
      };

      renderPrivateLoginScreen();
    }

    async function handleSignOut() {
      try {
        teardownAndWipeSession();
        await signOut(auth);
        showToast('Sessão encerrada com segurança.', 'info');
      } catch (err) {
        console.error('Erro ao sair:', err);
        showToast('Não foi possível encerrar a sessão.', 'error');
      }
    }

    // -----------------------------------------------------------------------
    // 9. PREFERÊNCIAS VISUAIS, MODAIS E TOASTS
    // -----------------------------------------------------------------------
    function applyVisualPreferences() {
      const html = document.documentElement;
      const sun = document.getElementById('sunIcon');
      const moon = document.getElementById('moonIcon');
      if (workspace.preferences.darkMode) {
        html.classList.add('dark');
        if (sun) sun.classList.remove('hidden');
        if (moon) moon.classList.add('hidden');
      } else {
        html.classList.remove('dark');
        if (sun) sun.classList.add('hidden');
        if (moon) moon.classList.remove('hidden');
      }

      const fontBtn = document.getElementById('fontFamilyBtn');
      if (fontBtn) {
        fontBtn.textContent = workspace.preferences.fontFamily === 'serif' ? 'Serif' : 'Sans';
      }
    }

    function toggleDarkMode() {
      workspace.preferences.darkMode = !workspace.preferences.darkMode;
      applyVisualPreferences();
      scheduleSaveWorkspace();
    }

    function changeFontSize(delta) {
      const next = Math.min(22, Math.max(13, (workspace.preferences.fontSize || 16) + delta));
      workspace.preferences.fontSize = next;
      scheduleSaveWorkspace();
      renderArticles();
      showToast(`Tamanho da fonte: ${next}px`, 'info');
    }

    function toggleFontFamily() {
      workspace.preferences.fontFamily = workspace.preferences.fontFamily === 'serif' ? 'sans' : 'serif';
      applyVisualPreferences();
      scheduleSaveWorkspace();
      renderArticles();
      showToast(`Tipografia: ${workspace.preferences.fontFamily === 'serif' ? 'Serifada (Leitura)' : 'Sem Serifa (Inter)'}`, 'info');
    }

    function toggleSidebar(forceOpen) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobileOverlay');
      if (!sidebar || !overlay) return;
      const isClosed = sidebar.classList.contains('-translate-x-full');
      const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : isClosed;
      if (shouldOpen) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function toggleAccountMenu() {
      document.getElementById('accountDropdown')?.classList.toggle('hidden');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 border-slate-700 dark:border-slate-300',
        error: 'bg-rose-600 text-white border-rose-500',

      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');

    function handleSearch(val) {
      const trimmed = val.trim();
      document.getElementById('clearSearchBtn')?.classList.toggle('hidden', trimmed.length === 0);
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = trimmed;
        visibleArticlesLimit = INITIAL_VISIBLE_ARTICLES;
        renderArticles();
      }, 200);
    }

    function clearSearch() {
      clearTimeout(searchDebounceTimer);
      searchQuery = '';
      visibleArticlesLimit = INITIAL_VISIBLE_ARTICLES;
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      document.getElementById('clearSearchBtn')?.classList.add('hidden');
      renderArticles();
    }

    function normalizeArticleJumpKey(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/^art\.?\s*/i, '')
        .replace(/[º°.\s]/g, '')
        .trim();
    }

    /**
     * Atalho "Ir para Art.": encontra o artigo exato (ex: 37, 5º, 29-A),
     * expande a paginação se necessário, rola suavemente e destaca a borda.
     */
    function handleJumpToArticle(event) {
      event.preventDefault();
      if (!activeLawDoc || !activeLawDoc.articles?.length) return;
      const input = document.getElementById('jumpArticleInput');
      const rawVal = input?.value.trim() || '';
      if (!rawVal) return;

      const targetKey = normalizeArticleJumpKey(rawVal);
      if (!targetKey) return;
      const targetNoHyphen = targetKey.replace(/-/g, '');

      const matchesArticle = art => {
        const k = normalizeArticleJumpKey(art.number);
        return k === targetKey || k.replace(/-/g, '') === targetNoHyphen;
      };

      // Tenta primeiro na lista filtrada; se estiver filtrado fora, limpa os filtros
      let list = getFilteredArticles();
      let matchingIndices = [];
      list.forEach((a, idx) => {
        if (matchesArticle(a)) matchingIndices.push(idx);
      });

      if (matchingIndices.length === 0 && (searchQuery || filterAnnotatedOnly || filterModsOnly)) {
        filterAnnotatedOnly = false;
        filterModsOnly = false;
        searchQuery = '';
        const sInput = document.getElementById('searchInput');
        if (sInput) sInput.value = '';
        document.getElementById('clearSearchBtn')?.classList.add('hidden');
        updateFilterButtons();
        list = getFilteredArticles();
        list.forEach((a, idx) => {
          if (matchesArticle(a)) matchingIndices.push(idx);
        });
      }

      if (matchingIndices.length === 0) {
        showToast(`Artigo "${rawVal}" não encontrado nesta lei.`, 'error');
        return;
      }

      // Permite alternar entre ocorrências (ex: Art. 1º da CF e Art. 1º do ADCT) ao apertar Enter novamente
      if (lastJumpKey === targetKey) {
        lastJumpMatchCursor = (lastJumpMatchCursor + 1) % matchingIndices.length;
      } else {
        lastJumpKey = targetKey;
        lastJumpMatchCursor = 0;
      }

      const matchIdx = matchingIndices[lastJumpMatchCursor];
      const targetArt = list[matchIdx];

      if (matchIdx >= visibleArticlesLimit) {
        visibleArticlesLimit = matchIdx + 10;
      }
      renderArticles();

      requestAnimationFrame(() => {
        const card = document.getElementById(`card-${targetArt.id}`);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.remove('article-jump-highlight');
          void card.offsetWidth;
          card.classList.add('article-jump-highlight');
          setTimeout(() => card.classList.remove('article-jump-highlight'), 2400);
        }
      });
    }

      visibleArticlesLimit += step;

    function getFilteredArticles() {
      if (!activeLawDoc) return [];
      const q = searchQuery.toLowerCase();
      return (activeLawDoc.articles || []).filter(art => {
        const hasNote = Boolean(art.note && art.note.trim().length > 0);
        const isEdited = art.html !== art.originalHtml;
        const hasMods = Array.isArray(art.modifications) && art.modifications.length > 0;

        if (filterAnnotatedOnly && !hasNote && !isEdited) return false;
        if (filterModsOnly && !hasMods) return false;

        if (q) {
          const hay = `${art.number} ${art.sectionHeader} ${stripHtml(art.html)} ${art.note}`.toLowerCase();
          return hay.includes(q);
        }
        return true;
      });
    }

    function renderHeader(filteredCount) {
      const badge = document.getElementById('activeSubjectBadge');
      const title = document.getElementById('activeLawTitle');
      const meta = document.getElementById('activeLawMeta');
      const chip = document.getElementById('topBarLawChip');
      if (!badge || !title || !meta) return;

      const subject = workspace.subjects.find(s => s.id === (activeLawDoc?.subjectId || workspace.preferences.activeSubjectId));

      if (!activeLawDoc) {
        badge.textContent = subject ? subject.name : 'Caderno Privado';

        meta.textContent = 'Escolha uma lei no menu lateral ou importe um arquivo .md / .txt.';
        if (chip) chip.textContent = '';

      }

      const articles = activeLawDoc.articles || [];
      const total = articles.length;
      const notesCount = articles.filter(a => a.note && a.note.trim()).length;
      const editedCount = articles.filter(a => a.html !== a.originalHtml).length;
      const modsCount = articles.filter(a => a.modifications && a.modifications.length > 0).length;

      badge.textContent = subject ? subject.name : 'Legislação';
      title.textContent = activeLawDoc.title;
      if (chip) chip.textContent = activeLawDoc.shortName || activeLawDoc.title;

      const countText = typeof filteredCount === 'number' && filteredCount !== total
        ? `Exibindo ${filteredCount} de ${total} artigos`

      meta.textContent = `${countText} • ${notesCount} com observações • ${editedCount} grifados/editados • ${modsCount} com modificações`;
