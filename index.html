    body {

    /* Tipografia jurídica nos cartões */
    .article-body {
      line-height: 1.78;
      word-break: break-word;
    }
    .article-body.font-reading-serif {
      font-family: 'Merriweather', Georgia, serif;
      line-height: 1.88;
    }
    .article-body p {
      margin-bottom: 0.72rem;
    }

      margin-bottom: 0;
    }
    .article-body .law-paragrafo {
      padding-left: 0.6rem;
    }
    .article-body .law-inciso {
      padding-left: 1.35rem;
    }
    .article-body .law-alinea {
      padding-left: 2.55rem;
    }
    .article-body[contenteditable="true"] {
      outline: none;
    }

    /* Leitura nítida em trechos grifados (sem !important, permitindo trocar a cor da letra) */
    .article-body span[style*="background-color"],
    .article-body mark {
      color: #0f172a;
      padding: 0.05rem 0.22rem;
      border-radius: 0.25rem;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    /* Quando o navegador envolve um trecho grifado com um span de cor de texto, o grifo herda a cor escolhida */
    .article-body [style^="color:"] span[style*="background-color"],
    .article-body [style*="; color:"] span[style*="background-color"],
    .article-body [style*=";color:"] span[style*="background-color"],
    .article-body [style^="color:"] mark,
    .article-body [style*="; color:"] mark,
    .article-body [style*=";color:"] mark {
      color: inherit;
    }
    .article-body span[style*="background-color: transparent"],
    .article-body span[style*="background-color: rgba(0, 0, 0, 0)"] {
      color: inherit;
      padding: 0;
    }

    /* Barra de rolagem discreta */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.55);
    }

      100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    .article-jump-highlight {
      border-color: #6366f1 !important;
      animation: jumpPulse 1.1s ease-out 2;
    }

    // -----------------------------------------------------------------------

    // -----------------------------------------------------------------------
    // 4. UTILITÁRIOS DE SEGURANÇA, SANITIZAÇÃO CONTRA XSS E NOTIFICAÇÕES
    // -----------------------------------------------------------------------
    function generateId(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function utf8ByteLength(str) {
      return new TextEncoder().encode(String(str || '')).length;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeSearch(str) {
      return String(str || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function stripHtmlToText(html) {
      const div = document.createElement('div');
      div.innerHTML = String(html || '');
      return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function sanitizeStyleAttribute(styleStr) {
      if (!styleStr) return '';
      const allowedProps = new Set(['background-color', 'color', 'font-weight', 'font-style', 'text-decoration']);
      const safeColorRe = /^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(?:\s*,\s*(?:0|1|0?\.\d+))?\s*\)|transparent|inherit)$/i;
      const safeParts = [];

      for (const decl of String(styleStr).split(';')) {
        const idx = decl.indexOf(':');
        if (idx === -1) continue;
        const prop = decl.slice(0, idx).trim().toLowerCase();
        const val = decl.slice(idx + 1).trim();
        if (!allowedProps.has(prop) || !val) continue;
        if (/expression|url\s*\(|javascript:/i.test(val)) continue;

        if (prop === 'background-color' || prop === 'color') {
          if (safeColorRe.test(val)) safeParts.push(`${prop}: ${val}`);
        } else if (prop === 'font-weight' && /^(bold|normal|[1-9]00)$/i.test(val)) {
          safeParts.push(`${prop}: ${val}`);
        } else if (prop === 'font-style' && /^(italic|normal)$/i.test(val)) {
          safeParts.push(`${prop}: ${val}`);
        } else if (prop === 'text-decoration' && /^(underline|line-through|none)$/i.test(val)) {
          safeParts.push(`${prop}: ${val}`);
        }
      }
      return safeParts.join('; ');
    }

    /**
     * Sanitizador estrito contra XSS: permite apenas tags seguras de leitura/edição jurídica,
     * remove scripts, iframes, eventos on* e estilos não autorizados.
     */
    function sanitizeHtml(dirtyHtml) {
      const parser = new DOMParser();
      const docRef = parser.parseFromString(`<div>${String(dirtyHtml || '')}</div>`, 'text/html');
      const root = docRef.body.firstElementChild;
      if (!root) return '';

      const allowedTags = new Set([
        'P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'DEL', 'MARK', 'SPAN', 'DIV', 'SUB', 'SUP'
      ]);
      const allowedClasses = new Set(['law-caput', 'law-paragrafo', 'law-inciso', 'law-alinea']);

      function cleanNode(node) {
        const children = Array.from(node.childNodes);
        for (const child of children) {
          if (child.nodeType === Node.TEXT_NODE) continue;
          if (child.nodeType !== Node.ELEMENT_NODE) {
            child.remove();
            continue;
          }
          const tag = child.tagName.toUpperCase();
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'IFRAME' || tag === 'OBJECT' || tag === 'EMBED') {
            child.remove();
            continue;
          }
          if (tag === 'FONT') {
            // Converte <font color="..."> gerado por alguns navegadores em <span style="color: ...">
            const span = docRef.createElement('span');
            const colorAttr = child.getAttribute('color') || '';
            const safeStyle = sanitizeStyleAttribute(colorAttr ? `color: ${colorAttr}` : (child.getAttribute('style') || ''));
            if (safeStyle) span.setAttribute('style', safeStyle);
            while (child.firstChild) span.appendChild(child.firstChild);
            child.replaceWith(span);
            cleanNode(span);
            continue;
          }
          if (!allowedTags.has(tag)) {
            const frag = docRef.createDocumentFragment();
            while (child.firstChild) frag.appendChild(child.firstChild);
            child.replaceWith(frag);
            cleanNode(node);
            return;
          }

          // Filtra atributos permitidos
          for (const attr of Array.from(child.attributes)) {
            const name = attr.name.toLowerCase();
            if (name === 'style') {
              const safeStyle = sanitizeStyleAttribute(attr.value);
              if (safeStyle) child.setAttribute('style', safeStyle);
              else child.removeAttribute('style');
            } else if (name === 'class') {
              const kept = attr.value.split(/\s+/).filter(c => allowedClasses.has(c));
              if (kept.length > 0) child.setAttribute('class', kept.join(' '));
              else child.removeAttribute('class');
            } else {
              child.removeAttribute(attr.name);
            }
          }
          cleanNode(child);
        }
      }

      cleanNode(root);
      return root.innerHTML;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-900 dark:bg-slate-800 text-white border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold leading-relaxed transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 260);
      }, type === 'error' ? 5200 : 3200);
    }

    function setSyncStatus(state, customText = '') {
      const pill = document.getElementById('syncStatusPill');
      const dot = document.getElementById('syncStatusDot');
      const txt = document.getElementById('syncStatusText');
      if (!pill || !dot || !txt) return;

      if (state === 'saving') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        txt.textContent = customText || 'Salvando na nuvem...';
      } else if (state === 'error') {
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
        txt.textContent = customText || 'Erro ao sincronizar';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        txt.textContent = customText || 'Sincronizado na nuvem';
      }
    }

    // -----------------------------------------------------------------------
    // 5. LIMPEZA DE MARKDOWN/HTML E PARSER INTELIGENTE DE LEI SECA
    // -----------------------------------------------------------------------
    function cleanRawLawLine(line) {
      let s = String(line || '');
      // Remove BOM e caracteres invisíveis zero-width
      s = s.replace(/[\uFEFF\u200B-\u200D\u2060]/g, '');
      // Remove cercas de código Markdown (3 ou mais crases)
      s = s.replace(/\x60{3,}[a-zA-Z0-9_-]*/g, '');
      // Remove glifos Unicode de área privada (ex.: ícone de balança  do Planalto)
      s = s.replace(/[\uE000-\uF8FF]/g, '');
      // Remove marcadores de citação blockquote no início da linha
      s = s.replace(/^\s*>\s*/, '');
      // Remove pipes laterais de tabelas Markdown convertidas de PDF
      if (/^\s*\|.*\|\s*$/.test(s)) {
        s = s.replace(/^\s*\|\s*|\s*\|\s*$/g, '').replace(/\s*\|\s*/g, ' ');
      }
      // Remove links de URL do Planalto gerados por conversores
      s = s.replace(/\[URL\s*🔗?\]\([^)]*\)/gi, '');
      // Converte links Markdown [texto](url) em texto simples
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1');
      // Remove cabeçalhos Markdown (#, ##, ###)
      s = s.replace(/^#{1,6}\s+/, '');
      // Remove marcadores de lista no início da linha (- ou *) sem destruir **negrito**
      s = s.replace(/^\s*(?:[-•]|\*(?!\*))\s+/, '');
      // Normaliza notações LaTeX/OCR de sobrescritos e parágrafos comuns em PDF->MD (ex.: L8112)
      s = s.replace(/\$\s*\\\{\s*(\d+)\s*\^\s*\{?\s*(?:\\Omega|\\circ|o|º|°)\s*\}?\s*\$/g, '§ $1º');
      s = s.replace(/\$\s*(\d+)\s*\^\s*\{?\s*(?:\\underline\{o\}|\\underline\{\\circ\}|\\circ|o|º|°)\s*\}?\s*\$/g, '$1º');
      s = s.replace(/(\d+)\s*\$\s*\^\s*\{?\s*(?:\\underline\{o\}|\\underline\{\\circ\}|\\circ|o|º|°)\s*\}?\s*\$/g, '$1º');
      s = s.replace(/\$\s*\^\s*\{?\s*(?:\\underline\{o\}|\\underline\{\\circ\}|\\circ|o|º|°)\s*\}?\s*\$/g, 'º');
      s = s.replace(/(\d+)\s*\\textsuperscript\{\s*(?:o|º|°)\s*\}/gi, '$1º');
      s = s.replace(/(\d+)\s*\^\s*(?:o|º|°|ª)\s*\^/gi, '$1º');
      // Normaliza sobrescritos HTML do Planalto antes de limpar tags (ex.: Art. 1<sup><u>o</u></sup> -> Art. 1º)
      s = s.replace(/(\d+)\s*(?:<sup>\s*<u>\s*o\s*<\/u>\s*<\/sup>|<u>\s*<sup>\s*o\s*<\/sup>\s*<\/u>|<sup>\s*[oº°]\s*<\/sup>|<u>\s*o\s*<\/u>)/gi, '$1º');
      // Remove tags HTML literais de ruído (<u>, <a>, <span>, <font>, etc.) preservando texto interno
      s = s.replace(/<\/?(?:u|a|span|font|sup|sub|small|big|center|div|p|section|article|header|footer|h[1-6])\b[^>]*>/gi, '');
      // Normaliza escapes Markdown comuns (R\$ -> R$, \* -> *, \. -> .)
      s = s.replace(/\\([\\`*_{}[\]()#+\-.!$])/g, '$1');
      // Normaliza símbolos ordinais alternativos após dígitos (1°, 1⁰, 1ᵒ, 1˚ -> 1º)
      s = s.replace(/\b(Art\.?\s*\d+|§\s*\d+)\.?\s*[\u00BA\u00B0\u02DA\u1D52\u2070]/g, '$1º');
      // Normaliza espaços múltiplos
      s = s.replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim();
      return s;
    }

    function isPlanaltoNoiseLine(line) {
      if (!line) return true;
      // Marcador de página de conversores PDF: [Page 1]
      if (/^\[Page\s+\d+\]$/i.test(line)) return true;
      // Cabeçalho de impressão PDF/Browser: "26/11/2026, 11:48 Constituição"
      if (/^\d{2}\/\d{2}\/\d{4},\s*\d{2}:\d{2}\b/.test(line)) return true;
      // Identificador curto de arquivo do Planalto repetido no cabeçalho (ex.: "L8112consol")
      if (/^L\d+cons(?:ol|olidado)?$/i.test(line)) return true;
      // Rodapé de impressão Planalto: "https://www.planalto.gov.br/... 1/197"
      if (/^https?:\/\/(?:www\.)?planalto\.gov\.br\/\S*(?:\s+\d+\/\d+)?$/i.test(line)) return true;
      // Apenas número de página isolado tipo "12/197"
      if (/^\d{1,4}\/\d{1,4}$/.test(line)) return true;
      // Linha somente com asterisco ou traços
      if (/^[*_\-–—.|]+$/.test(line)) return true;
      return false;
    }

    function inlineMarkdownToSafeHtml(text) {
      let s = escapeHtml(text);
      // Negrito **texto** ou __texto__
      s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/__([^_]+?)__/g, '<strong>$1</strong>');
      // Tachado ~~texto~~
      s = s.replace(/~~([^~]+?)~~/g, '<del>$1</del>');
      // Itálico *texto* (evitando asteriscos soltos)
      s = s.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
      // Remove eventual resquício de **
      s = s.replace(/\*\*/g, '');
      return sanitizeHtml(s);
    }

    function formatLawLineHtml(text) {
      const strippedLead = String(text || '').replace(/^(?:\*\*|__|\*)+/, '').trim();
      let cls = 'law-caput';
      let styled = inlineMarkdownToSafeHtml(text);

      if (/^(Art\.?\s*\d+(?:\.\d+)*\.?\s*[º°oª]?(?:-[A-Z0-9]+)?\.?)/i.test(strippedLead)) {
        cls = 'law-caput';
        styled = styled.replace(
          /^(?:<strong>)?(Art\.?\s*\d+(?:\.\d+)*\.?\s*[º°oª]?(?:-[A-Z0-9]+)?\.?)(?:<\/strong>)?/i,
          '<strong>$1</strong>'
        );
      } else if (/^(Parágrafo único\.?|§\s*\d+\.?\s*[º°oª]?(?:-[A-Z0-9]+)?\.?)/i.test(strippedLead)) {
        cls = 'law-paragrafo';
        styled = styled.replace(
          /^(?:<strong>)?(Parágrafo único\.?|§\s*\d+\.?\s*[º°oª]?(?:-[A-Z0-9]+)?\.?)(?:<\/strong>)?/i,
          '<strong>$1</strong>'
        );
      } else if (/^([IVXLCDM]+(?:-[A-Z])?\s*[-–—]|\d+\s*[-–—])/.test(strippedLead)) {
        cls = 'law-inciso';
        styled = styled.replace(
          /^(?:<strong>)?([IVXLCDM]+(?:-[A-Z])?)(?:<\/strong>)?(\s*[-–—])/,
          '<strong>$1</strong>$2'
        );
      } else if (/^([a-z]\))\s+/i.test(strippedLead)) {
        cls = 'law-alinea';
        styled = styled.replace(
          /^(?:<strong>)?([a-z]\))(?:<\/strong>)?(\s+)/i,
          '<strong>$1</strong>$2'
        );
      }

      return `<p class="${cls}">${styled}</p>`;
    }

    function isStructuralHeadingLine(line) {
      const s = String(line || '').replace(/^(?:\*\*|__|\*)+|(?:\*\*|__|\*)+$/g, '').trim();
      return /^(TÍTULO\s+(?:[IVXLCDM0-9]+|ÚNICO)|CAPÍTULO\s+(?:[IVXLCDM0-9]+|ÚNICO)|SEÇÃO\s+(?:[IVXLCDM0-9]+(?:-[A-Z])?|ÚNICA)|SUBSEÇÃO\s+(?:[IVXLCDM0-9]+|ÚNICA)|LIVRO\s+(?:[IVXLCDM0-9]+|ÚNICO)|PARTE\s+[A-ZÀ-Ú]+|ATO DAS DISPOSIÇÕES CONSTITUCIONAIS TRANSITÓRIAS|DISPOSIÇÕES\s+(?:PRELIMINARES|GERAIS|FINAIS|TRANSITÓRIAS)|PREÂMBULO)\b/i.test(s);
    }

    function isNewClauseStart(line) {
      const s = String(line || '').replace(/^(?:\*\*|__|\*)+/, '').trim();
      return (
        /^(?:Art|ART)\.?\s*\d+/.test(s) ||
        /^(?:Parágrafo único|§\s*\d+)/i.test(s) ||
        /^[IVXLCDM]+(?:-[A-Z])?\s*[-–—]\s+/.test(s) ||
        /^[a-z]\)\s+/.test(s)
      );
    }

    function extractArticleNumberLabel(line) {
      // Remove marcações Markdown ao redor do rótulo (ex.: "**Art. 1º**", "*Art. 2º*")
      const normalizedLead = String(line || '')
        .replace(/^(?:\*\*|__|\*)+/, '')
        .replace(/^(Art\.?\s*\d+(?:\.\d+)*\.?\s*(?:[º°oª]|\*\*o\*\*)?(?:-[A-Z0-9]+)?\.?)(?:\*\*|__|\*)+/, '$1')
        .trim();

      // Exige "Art" ou "ART" com A maiúsculo para não disparar em citações "do art. 37"
      // Suporta "Art. 1º", "Art. 1°", "Art. 1o", "Art. 1 o", "Art. 1.º", "Art. 10.", "Art. 55-A.", "Art. 60-A", "Art. 218."
      const m = normalizedLead.match(
        /^(?:Art|ART)\.?\s*(\d+(?:\.\d+)*)(?:\.?\s*([º°oª]))?(?:-([A-Z0-9]+))?\.?(?=\s|$|[-–—])/
      );
      if (!m) return null;

      const num = m[1];
      const numericVal = Number(num.replace(/\./g, ''));
      const hasOrd = Boolean(m[2]);
      const suffix = m[3] ? `-${m[3].toUpperCase()}` : '';

      // Evita falso positivo em linhas como "Art. 13 da Lei nº 9.527" (referência solta sem texto normativo)
      const rest = normalizedLead.slice(m[0].length).trim();
      if (/^(?:da|do|de|desta|deste)\s+(?:Lei|Constituição|Decreto|Medida)/i.test(rest)) {
        return null;
      }

      const ord = (hasOrd || (numericVal >= 1 && numericVal <= 9 && !suffix)) ? 'º' : '';
      return `Art. ${num}${ord}${suffix}`;
    }

    function extractAmendingNorm(text) {
      const matches = text.match(/\((?:Redação dada|Incluíd[oa]|Revogad[oa]|Renumerad[oa]|Transformad[oa]|Alterad[oa]|Vide)[^)]{3,160}\)/gi);
      if (!matches || matches.length === 0) return 'Redação anterior (Planalto)';
      return matches[matches.length - 1].replace(/^\(|\)$/g, '').trim();
    }

    // Anotações legislativas inline do Planalto: "(Redação dada pela...)", "(Incluído pela...)", "(Revogado...)" etc.
    // "Vide ...", "Regulamento" e "Vigência" também entram (aparecem em outra cor no histórico).
    const MOD_ANNOTATION_SOURCE = '\\((?:Redação dada|Incluíd[oa]|Revogad[oa]|Renumerad[oa]|Transformad[oa]|Alterad[oa]|Suprimid[oa]|Vide|Regulamento|Vigência)[^()]*\\)';

    function extractInlineModificationsFromTexts(texts) {
      const out = [];
      const seen = new Set();
      for (const raw of texts) {
        const text = String(raw || '').replace(/\*\*|__/g, '').replace(/\s+/g, ' ').trim();
        if (!text) continue;
        const matches = text.match(new RegExp(MOD_ANNOTATION_SOURCE, 'gi'));
        if (!matches) continue;
        const clean = text
          .replace(new RegExp(MOD_ANNOTATION_SOURCE, 'gi'), '')
          .replace(/\s+/g, ' ')
          .trim();
        const snippet = clean.length > 130 ? clean.slice(0, 130).trimEnd() + '…' : (clean || '(dispositivo)');
        for (const m of matches) {
          const norm = m.replace(/^\(|\)$/g, '').trim();
          const key = `${norm}|${snippet}`;
          if (seen.has(key)) continue;
          seen.add(key);
          out.push({ id: generateId('mod'), kind: 'auto', oldText: '', newText: snippet, norm, date: '' });
        }
      }
      return out;
    }

    // Recalcula as modificações detectadas automaticamente (mantém as registradas manualmente)
    function refreshAutoModifications(art) {
      const manual = (Array.isArray(art.modifications) ? art.modifications : []).filter(m => m.kind !== 'auto');
      const texts = extractParagraphBlocks(art.originalHtml || art.html).map(b => b.text);
      const auto = extractInlineModificationsFromTexts(texts);
      art.modifications = manual.concat(auto);
      return auto.length;
    }

    /**
     * Parser inteligente de texto/Markdown de legislação brasileira (Planalto):
     * - Remove cercas de código, glifos, LaTeX de sobrescrito, cabeçalhos/rodapés de impressão e tags HTML sujas.
     * - Reúne quebras de linha no meio de frases.
     * - Separa em cartões por Artigo (1º ao último), preservando ADCT como seção distinta.
     * - Agrupa redações anteriores consecutivas do mesmo artigo em `modifications`.
     */
    function parseLawText(rawText) {
      const rawLines = String(rawText || '').replace(/\r\n/g, '\n').split('\n');
      const cleanedLines = [];

      for (const raw of rawLines) {
        const line = cleanRawLawLine(raw);
        if (isPlanaltoNoiseLine(line)) continue;
        cleanedLines.push(line);
      }

      const articles = [];
      let currentArticle = null;
      let pendingHeaders = [];
      let currentMajorScope = 'PRINCIPAL'; // Muda para 'ADCT' ao encontrar ADCT
      let insideSignatureBlock = false;

      function pushLineToCurrentArticle(line) {
        if (!currentArticle) return;
        const lines = currentArticle._lines;
        if (lines.length === 0 || isNewClauseStart(line)) {
          lines.push(line);
        } else {
          const prev = lines[lines.length - 1];
          if (prev.endsWith('-') && !prev.endsWith(' -')) {
            lines[lines.length - 1] = prev + line;
          } else {
            lines[lines.length - 1] = `${prev} ${line}`;
          }
        }
      }

      for (let i = 0; i < cleanedLines.length; i++) {
        const line = cleanedLines[i];

        if (/^Brasília\s*,\s*\d+\s+de\s+[a-zç]+\s+de\s+\d{4}/i.test(line)) {
          insideSignatureBlock = true;
          continue;
        }
        // Item de índice no topo do arquivo (ex.: "Ato das Disposições Constitucionais Transitórias"): ignora
        if (articles.length === 0 && !/^ATO DAS DISPOSIÇÕES CONSTITUCIONAIS TRANSITÓRIAS$/.test(line) &&
            /^ATO DAS DISPOSIÇÕES CONSTITUCIONAIS TRANSITÓRIAS$/i.test(line)) {
          continue;
        }
        // O título real do ADCT vem em CAIXA ALTA; a versão em Title Case é só referência/índice
        if (/^ATO DAS DISPOSIÇÕES CONSTITUCIONAIS TRANSITÓRIAS$/.test(line)) {
          insideSignatureBlock = false;
          currentMajorScope = 'ADCT';
          currentArticle = null;
          pendingHeaders = ['ATO DAS DISPOSIÇÕES CONSTITUCIONAIS TRANSITÓRIAS'];
          continue;
        }
        if (insideSignatureBlock) {
          continue;
        }

        if (isStructuralHeadingLine(line) && line.length < 140) {
          pendingHeaders.push(line.replace(/^(?:\*\*|__|\*)+|(?:\*\*|__|\*)+$/g, '').trim());
          continue;
        }

        // Detecta subtítulo logo após TÍTULO/CAPÍTULO/SEÇÃO (suporta CAIXA ALTA e Title Case como na Lei 8.112)
        if (
          pendingHeaders.length > 0 &&
          !extractArticleNumberLabel(line) &&
          !isNewClauseStart(line) &&
          line.length < 130
        ) {
          const cleanSub = line.replace(/^(?:\*\*|__|\*)+|(?:\*\*|__|\*)+$/g, '').trim();
          const isAllCaps = cleanSub === cleanSub.toUpperCase() && /[A-ZÀ-Ú]{3,}/.test(cleanSub);
          const isTitleCaseHeading =
            /^(?:Das?|Dos?|De|Do|Da|Disposições|Normas|Regras|Princípios|Direitos|Deveres|Proibições|Penalidades|Regime|Processo|Seguridade|Aposentadoria|Pensão|Licença|Férias|Vencimento|Remuneração|Provimento|Vacância|Remoção|Redistribuição|Substituição|Nomeação|Concurso|Posse|Estabilidade|Readaptação|Reversão|Reintegração|Recondução|Disponibilidade|Aproveitamento|Ajuda|Diárias|Indenização|Auxílio|Gratificação|Adicional|Tempo|Direito|Acumulação|Responsabilidades|Inquérito|Julgamento|Revisão|Assistência|Custeio|Contratação)/i.test(cleanSub) &&
            !/[.;:]$/.test(cleanSub);
          const isNormNoteOnHeading = /^\((?:Redação dada|Incluíd[oa]|Revogad[oa]|Vide|Regulamento)/i.test(cleanSub);

          if (isAllCaps || isTitleCaseHeading) {
            pendingHeaders.push(cleanSub);
            continue;
          }
          if (isNormNoteOnHeading && !currentArticle) {
            continue;
          }
        }

        const artLabel = extractArticleNumberLabel(line);
        if (artLabel) {
          const scopeKey = `${currentMajorScope}::${artLabel}`;
          const prevArt = articles.length > 0 ? articles[articles.length - 1] : null;

          // Se o artigo imediatamente anterior tem o MESMO número e mesmo escopo,
          // trata a versão anterior como redação histórica (Planalto) e substitui pela nova redação vigente.
          if (prevArt && prevArt._scopeKey === scopeKey && pendingHeaders.length === 0) {
            const oldText = prevArt._lines.join('\n');
            const norm = extractAmendingNorm(line);
            prevArt.modifications.push({
              id: generateId('mod'),
              oldText: oldText,
              newText: line,
              norm: norm,
              date: ''
            });
            prevArt._lines = [line];
            currentArticle = prevArt;
            continue;
          }

          const sectionHeader = pendingHeaders.length > 0 ? pendingHeaders.join(' • ') : '';
          pendingHeaders = [];

          const displayNumber = currentMajorScope === 'ADCT' ? `${artLabel} (ADCT)` : artLabel;
          const artObj = {
            id: generateId('art'),
            number: displayNumber,
            sectionHeader: sectionHeader,
            _scopeKey: scopeKey,
            _lines: [line],
            note: '',
            modifications: []
          };
          articles.push(artObj);
          currentArticle = artObj;
          continue;
        }

        if (currentArticle) {
          if (/^(Texto compilado|Mensagem de veto|ÍNDICE TEMÁTICO|Este texto não substitui)/i.test(line)) {
            continue;
          }
          pushLineToCurrentArticle(line);
        }
      }

      return articles.map(a => {
        const html = a._lines.map(l => formatLawLineHtml(l)).join('');
        return {
          id: a.id,
          number: a.number,
          sectionHeader: a.sectionHeader,
          html: html,
          originalHtml: html,
          note: a.note || '',
          updateBadge: '',
          modifications: [
            ...(a.modifications || []),
            ...extractInlineModificationsFromTexts(a._lines)
          ]
        };
      });
    }

    /**
     * Limpa tags literais de Markdown/HTML em uma lei já salva no Firestore,
     * preservando marca-textos, cores de texto e observações do usuário.
     */
    function cleanLiteralMarkdownInHtml(html) {
      let s = String(html || '');
      s = s.replace(/\x60{3,}[a-zA-Z0-9_-]*/g, '');
      s = s.replace(/[\uE000-\uF8FF]/g, '');
      s = s.replace(/\$\s*(\d+)\s*\^\s*\{?\s*(?:\\circ|o|º|°)\s*\}?\s*\$/g, '$1º');
      s = s.replace(/(\d+)\s*\$\s*\^\s*\{?\s*(?:\\circ|o|º|°)\s*\}?\s*\$/g, '$1º');
      s = s.replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/&lt;\/?u\b[^&]*&gt;/gi, '');
      s = s.replace(/&lt;\/?span\b[^&]*&gt;/gi, '');
      s = s.replace(/&lt;\/?a\b[^&]*&gt;/gi, '');
      s = s.replace(/\[URL\s*🔗?\]\([^)]*\)/gi, '');
      s = s.replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, '$1');
      s = s.replace(/https?:\/\/(?:www\.)?planalto\.gov\.br\/\S*(?:\s+\d+\/\d+)?/gi, '');
      s = s.replace(/<\/?u\b[^>]*>/gi, '');
      return sanitizeHtml(s);
    }

    // -----------------------------------------------------------------------
    // 5B. MOTOR DE ATUALIZAÇÃO INTELIGENTE DE LEI (OPÇÃO A — DIFF + MERGE)
    // -----------------------------------------------------------------------
    function canonicalArticleKey(numberStr) {
      const raw = String(numberStr || '').trim();
      const isAdct = /\(ADCT\)/i.test(raw);
      const clean = raw
        .replace(/\(ADCT\)/gi, '')
        .replace(/^Art\.?\s*/i, '')
        .replace(/\.?\s*[º°oª](?=-|\s|$|\.)/gi, '')
        .replace(/\.$/, '')
        .replace(/\s+/g, '')
        .toUpperCase();
      return `${isAdct ? 'ADCT' : 'PRINCIPAL'}::${clean}`;
    }

    function normalizeForDiff(text) {
      return String(text || '')
        .replace(/\u00A0/g, ' ')
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/[–—]/g, '-')
        .replace(/[°⁰ᵒ]/g, 'º')
        .replace(/\s+([.,;:!?])/g, '$1')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function extractParagraphBlocks(html) {
      const parser = new DOMParser();
      const docRef = parser.parseFromString(`<div>${sanitizeHtml(html || '')}</div>`, 'text/html');
      const root = docRef.body.firstElementChild;
      if (!root) return [];
      const ps = Array.from(root.querySelectorAll('p'));
      if (ps.length === 0 && (root.textContent || '').trim()) {
        return [{ html: `<p class="law-caput">${root.innerHTML}</p>`, text: (root.textContent || '').trim() }];
      }
      return ps.map(p => ({
        html: p.outerHTML,
        text: (p.textContent || '').trim()
      }));
    }

    function extractClauseKey(text) {
      const t = String(text || '').trim();
      if (/^Art\.?\s*\d+/i.test(t)) return 'CAPUT';
      if (/^Parágrafo único/i.test(t)) return 'PARAGRAFO_UNICO';
      const par = t.match(/^§\s*(\d+)(?:\s*[º°oª])?(?:-[A-Z0-9]+)?/i);
      if (par) return `PARAGRAFO::${par[0].replace(/\s+/g, '').replace(/[°o]/g, 'º').toUpperCase()}`;
      const inc = t.match(/^([IVXLCDM]+(?:-[A-Z])?)\s*[-–—]/);
      if (inc) return `INCISO::${inc[1].toUpperCase()}`;
      const ali = t.match(/^([a-z])\)\s+/i);
      if (ali) return `ALINEA::${ali[1].toLowerCase()}`;
      return null;
    }

    function hasUserFormatting(art) {
      if (!art) return false;
      const html = String(art.html || '');
      const orig = String(art.originalHtml || html);
      return html !== orig || /background-color|style="[^"]*color:|<mark\b/i.test(html);
    }

    function reapplyInlineAnnotations(oldEditedParagraphHtml, newCleanParagraphHtml) {
      const parser = new DOMParser();
      const oldDoc = parser.parseFromString(`<div>${oldEditedParagraphHtml}</div>`, 'text/html');
      const oldRoot = oldDoc.body.firstElementChild;
      if (!oldRoot) return { html: newCleanParagraphHtml, reappliedCount: 0 };

      const styledNodes = Array.from(oldRoot.querySelectorAll('span[style], mark'));
      const snippets = [];
      const seen = new Set();

      for (const el of styledNodes) {
        const text = (el.textContent || '').trim();
        if (text.length < 5) continue;
        const style = el.getAttribute('style') || (el.tagName === 'MARK' ? 'background-color: #fef08a' : '');
        const cleanStyle = sanitizeStyleAttribute(style);
        if (!cleanStyle) continue;
        const key = `${text}::${cleanStyle}`;
        if (seen.has(key)) continue;
        seen.add(key);
        snippets.push({ text, style: cleanStyle });
      }

      if (snippets.length === 0) return { html: newCleanParagraphHtml, reappliedCount: 0 };

      snippets.sort((a, b) => b.text.length - a.text.length);

      const newDoc = parser.parseFromString(`<div>${newCleanParagraphHtml}</div>`, 'text/html');
      const newRoot = newDoc.body.firstElementChild;
      if (!newRoot) return { html: newCleanParagraphHtml, reappliedCount: 0 };

      let reappliedCount = 0;

      for (const snip of snippets) {
        const fullText = newRoot.textContent || '';
        const firstIdx = fullText.indexOf(snip.text);
        if (firstIdx === -1 || fullText.indexOf(snip.text, firstIdx + 1) !== -1) continue;

        const walker = newDoc.createTreeWalker(newRoot, NodeFilter.SHOW_TEXT);
        let tNode = walker.nextNode();
        while (tNode) {
          const val = tNode.nodeValue || '';
          const pos = val.indexOf(snip.text);
          if (pos !== -1) {
            const parent = tNode.parentNode;
            if (parent && parent.nodeType === 1 && parent.hasAttribute('style')) {
              break;
            }
            const before = val.slice(0, pos);
            const match = val.slice(pos, pos + snip.text.length);
            const after = val.slice(pos + snip.text.length);

            const frag = newDoc.createDocumentFragment();
            if (before) frag.appendChild(newDoc.createTextNode(before));
            const span = newDoc.createElement('span');
            span.setAttribute('style', snip.style);
            span.textContent = match;
            frag.appendChild(span);
            if (after) frag.appendChild(newDoc.createTextNode(after));

            parent.replaceChild(frag, tNode);
            reappliedCount++;
            break;
          }
          tNode = walker.nextNode();
        }
      }

      return {
        html: sanitizeHtml(newRoot.innerHTML),
        reappliedCount
      };
    }

    function mergeArticleContentPreservingHighlights(oldArt, newArt) {
      const oldEditedBlocks = extractParagraphBlocks(oldArt.html);
      const oldOrigBlocks = extractParagraphBlocks(oldArt.originalHtml || oldArt.html);
      const newBlocks = extractParagraphBlocks(newArt.html);

      const editedByNormText = new Map();
      const editedByClause = new Map();

      oldEditedBlocks.forEach((blk, idx) => {
        const origBlk = oldOrigBlocks[idx] || blk;
        const normOrig = normalizeForDiff(origBlk.text);
        const normEdit = normalizeForDiff(blk.text);
        if (normOrig && !editedByNormText.has(normOrig)) {
          editedByNormText.set(normOrig, blk.html);
        }
        if (normEdit && !editedByNormText.has(normEdit)) {
          editedByNormText.set(normEdit, blk.html);
        }
        const cKey = extractClauseKey(origBlk.text) || extractClauseKey(blk.text);
        if (cKey && !editedByClause.has(cKey)) {
          editedByClause.set(cKey, { origText: origBlk.text, editedHtml: blk.html });
        }
      });

      const mergedParagraphs = [];
      let preservedClauses = 0;
      let changedClauses = 0;
      let reappliedHighlights = 0;
      const oldChangedSnippets = [];
      const newChangedSnippets = [];

      for (const nBlk of newBlocks) {
        const normNew = normalizeForDiff(nBlk.text);
        if (editedByNormText.has(normNew)) {
          mergedParagraphs.push(editedByNormText.get(normNew));
          preservedClauses++;
          continue;
        }

        changedClauses++;
        const cKey = extractClauseKey(nBlk.text);
        const oldMatch = cKey ? editedByClause.get(cKey) : null;

        if (oldMatch) {
          oldChangedSnippets.push(oldMatch.origText);
          newChangedSnippets.push(nBlk.text);
          const { html: reappliedHtml, reappliedCount } = reapplyInlineAnnotations(oldMatch.editedHtml, nBlk.html);
          reappliedHighlights += reappliedCount;
          mergedParagraphs.push(reappliedHtml);
        } else {
          newChangedSnippets.push(nBlk.text);
          mergedParagraphs.push(nBlk.html);
        }
      }

      const mergedHtml = sanitizeHtml(mergedParagraphs.join(''));
      const todayLabel = new Date().toLocaleDateString('pt-BR');

      const oldSummaryText = oldChangedSnippets.length > 0
        ? oldChangedSnippets.join('\n')
        : stripHtmlToText(oldArt.originalHtml || oldArt.html);
      const newSummaryText = newChangedSnippets.length > 0
        ? newChangedSnippets.join('\n')
        : stripHtmlToText(newArt.html);
      const detectedNorm = extractAmendingNorm(newSummaryText);
      const modNormLabel = detectedNorm !== 'Redação anterior (Planalto)'
        ? `${detectedNorm} • Atualizado em ${todayLabel}`
        : `Atualização legislativa aplicada em ${todayLabel}`;

      return {
        mergedHtml,
        preservedClauses,
        changedClauses,
        reappliedHighlights,
        autoModification: {
          id: generateId('mod'),
          oldText: oldSummaryText,
          newText: newSummaryText,
          norm: modNormLabel,
          date: todayLabel
        }
      };
    }

    function computeLawUpdateDiff(existingArticles, incomingArticles) {
      const existingByKey = new Map();
      existingArticles.forEach((art, idx) => {
        const key = canonicalArticleKey(art.number);
        if (!existingByKey.has(key)) existingByKey.set(key, []);
        existingByKey.get(key).push({ art, idx });
      });

      const matchedExistingIds = new Set();
      const items = [];
      let unchangedCount = 0;
      let updatedCount = 0;
      let newCount = 0;

      for (const inc of incomingArticles) {
        const key = canonicalArticleKey(inc.number);
        const candidates = existingByKey.get(key) || [];
        const matchEntry = candidates.find(c => !matchedExistingIds.has(c.art.id));

        if (!matchEntry) {
          newCount++;
          items.push({
            type: 'new',
            key,
            selected: true,
            newArt: inc,
            oldArt: null
          });
          continue;
        }

        const oldArt = matchEntry.art;
        matchedExistingIds.add(oldArt.id);

        const oldBaseNorm = normalizeForDiff(stripHtmlToText(oldArt.originalHtml || oldArt.html));
        const newBaseNorm = normalizeForDiff(stripHtmlToText(inc.html));

        if (oldBaseNorm === newBaseNorm) {
          unchangedCount++;
          items.push({
            type: 'unchanged',
            key,
            selected: false,
            oldArt,
            newArt: inc
          });
        } else {
          updatedCount++;
          const mergeInfo = mergeArticleContentPreservingHighlights(oldArt, inc);
          items.push({
            type: 'updated',
            key,
            selected: true,
            oldArt,
            newArt: inc,
            mergeInfo,
            hasUserEdits: hasUserFormatting(oldArt),
            hasUserNote: Boolean(oldArt.note && oldArt.note.trim())
          });
        }
      }

      let missingCount = 0;
      for (const oldArt of existingArticles) {
        if (!matchedExistingIds.has(oldArt.id)) {
          missingCount++;
          items.push({
            type: 'missing',
            key: canonicalArticleKey(oldArt.number),
            selected: false, // Desmarcado por padrão = manter no caderno
            oldArt,
            newArt: null,
            hasUserEdits: hasUserFormatting(oldArt),
            hasUserNote: Boolean(oldArt.note && oldArt.note.trim())
          });
        }
      }

      return {
        summary: {
          unchangedCount,
          updatedCount,
          newCount,
          missingCount
        },
        items,
        incomingTotal: incomingArticles.length
      };
    }

    // -----------------------------------------------------------------------
    // 6. COMPACTAÇÃO, HIDRATAÇÃO E FRAGMENTAÇÃO EM BLOCOS (CHUNKING FIRESTORE)
    // -----------------------------------------------------------------------
    function compactArticle(art) {
      const cleanHtml = sanitizeHtml(art.html || '');
      const cleanOrig = sanitizeHtml(art.originalHtml ?? art.html ?? '');
      const out = {
        id: art.id || generateId('art'),
        number: String(art.number || 'Art.').trim(),
        html: cleanHtml
      };
      // Só salva originalHtml se for diferente de html (economiza ~50% de espaço)
      if (cleanOrig && cleanOrig !== cleanHtml) {
        out.originalHtml = cleanOrig;
      }
      if (art.sectionHeader && String(art.sectionHeader).trim()) {
        out.sectionHeader = String(art.sectionHeader).trim();
      }
      if (art.note && String(art.note).trim()) {
        out.note = String(art.note);
      }
      if (art.favorite === true) {
        out.favorite = true;
      }
      if (art.updateBadge === 'new' || art.updateBadge === 'updated') {
        out.updateBadge = art.updateBadge;
      }
      if (Array.isArray(art.modifications) && art.modifications.length > 0) {
        out.modifications = art.modifications.map(m => ({
          id: m.id || generateId('mod'),
          oldText: String(m.oldText || ''),
          newText: String(m.newText || ''),
          norm: String(m.norm || ''),
          date: String(m.date || ''),
          ...(m.kind === 'auto' ? { kind: 'auto' } : {})
        }));
      }
      return out;
    }

    function hydrateArticle(raw) {
      const html = sanitizeHtml(raw.html || '');
      const orig = raw.originalHtml ? sanitizeHtml(raw.originalHtml) : html;
      return {
        id: raw.id || generateId('art'),
        number: String(raw.number || 'Art.'),
        sectionHeader: raw.sectionHeader || '',
        html: html,
        originalHtml: orig,
        note: raw.note || '',
        favorite: raw.favorite === true,
        updateBadge: (raw.updateBadge === 'new' || raw.updateBadge === 'updated') ? raw.updateBadge : '',
        modifications: Array.isArray(raw.modifications) ? raw.modifications : []
      };
    }

    function splitCompactArticlesIntoChunks(compactArticles, targetBytes = CHUNK_TARGET_BYTES) {
      const chunks = [];
      let current = [];
      let currentBytes = 128;

      for (const art of compactArticles) {
        const size = utf8ByteLength(JSON.stringify(art)) + 4;
        if (current.length > 0 && currentBytes + size > targetBytes) {
          chunks.push(current);
          current = [art];
          currentBytes = 128 + size;
        } else {
          current.push(art);
          currentBytes += size;
        }
      }
      if (current.length > 0 || chunks.length === 0) {
        chunks.push(current);
      }
      return chunks;
    }

    async function loadLawFromFirestore(uid, lawId, preloadedSnap = null) {
      const snap = preloadedSnap || await getDoc(lawDocRef(uid, lawId));
      if (!snap.exists()) return null;

      const data = snap.data();
      const baseDoc = {
        id: data.id || lawId,
        subjectId: data.subjectId || '',
        shortName: data.shortName || data.title || 'Lei',
        title: data.title || 'Lei sem título',
        subtitle: data.subtitle || '',
        isChunked: Boolean(data.isChunked),
        chunkCount: Number(data.chunkCount) || 0,
        articles: [],
        _chunkRanges: [] // [{ chunkIndex, startIdx, endIdx }]
      };

      if (baseDoc.isChunked) {
        const chunksSnap = await getDocs(lawChunksCollectionRef(uid, lawId));
        const chunkDocs = [];
        chunksSnap.forEach(d => {
          const cData = d.data();
          const idx = typeof cData.index === 'number'
            ? cData.index
            : Number(String(d.id).replace('chunk_', '')) || 0;
          chunkDocs.push({ index: idx, articles: Array.isArray(cData.articles) ? cData.articles : [] });
        });
        chunkDocs.sort((a, b) => a.index - b.index);

        for (const ch of chunkDocs) {
          const startIdx = baseDoc.articles.length;
          for (const rawArt of ch.articles) {
            baseDoc.articles.push(hydrateArticle(rawArt));
          }
          const endIdx = baseDoc.articles.length;
          baseDoc._chunkRanges.push({ chunkIndex: ch.index, startIdx, endIdx });
        }
        baseDoc.chunkCount = chunkDocs.length;
      } else {
        const rawArticles = Array.isArray(data.articles) ? data.articles : [];
        baseDoc.articles = rawArticles.map(hydrateArticle);
      }

      return baseDoc;
    }

    async function deleteLawChunks(uid, lawId) {
      const chunksSnap = await getDocs(lawChunksCollectionRef(uid, lawId));
      if (chunksSnap.empty) return;
      const docs = chunksSnap.docs;
      for (let i = 0; i < docs.length; i += MAX_BATCH_OPS) {
        const batch = writeBatch(db);
        docs.slice(i, i + MAX_BATCH_OPS).forEach(d => batch.delete(d.ref));
        await batch.commit();
      }
    }

    async function saveFullLawToFirestore(uid, lawObj, onProgress = null) {
      const compactArts = (lawObj.articles || []).map(compactArticle);
      const totalBytes = utf8ByteLength(JSON.stringify(compactArts));
      const needsChunking = totalBytes > CHUNK_TARGET_BYTES;
      const nowIso = new Date().toISOString();

      if (!needsChunking) {
        if (onProgress) onProgress(1, 2);
        // Se antes era fragmentada, remove chunks antigos
        if (lawObj.isChunked) {
          await deleteLawChunks(uid, lawObj.id);
        }
        await setDoc(lawDocRef(uid, lawObj.id), {
          id: lawObj.id,
          subjectId: lawObj.subjectId,
          shortName: lawObj.shortName || lawObj.title,
          title: lawObj.title,
          subtitle: lawObj.subtitle || '',
          isChunked: false,
          chunkCount: 0,
          articleCount: compactArts.length,
          articles: compactArts,
          updatedAt: nowIso
        });
        lawObj.isChunked = false;
        lawObj.chunkCount = 0;
        lawObj._chunkRanges = [];
        if (onProgress) onProgress(2, 2);
        return;
      }

      // Lei grande -> fragmenta em chunks seguros (~350 KB cada)
      const chunks = splitCompactArticlesIntoChunks(compactArts, CHUNK_TARGET_BYTES);
      const totalSteps = chunks.length + 1;
      let completed = 0;

      // Remove chunks excedentes se o número de blocos diminuiu
      const existingChunksSnap = await getDocs(lawChunksCollectionRef(uid, lawObj.id));
      const staleDocs = existingChunksSnap.docs.filter(d => {
        const idx = Number(String(d.id).replace('chunk_', ''));
        return Number.isFinite(idx) && idx >= chunks.length;
      });
      if (staleDocs.length > 0) {
        for (let i = 0; i < staleDocs.length; i += MAX_BATCH_OPS) {
          const batch = writeBatch(db);
          staleDocs.slice(i, i + MAX_BATCH_OPS).forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
      }

      // Grava cada bloco individualmente para exibir progresso suave
      const newRanges = [];
      let cursor = 0;
      for (let i = 0; i < chunks.length; i++) {
        const slice = chunks[i];
        await setDoc(lawChunkDocRef(uid, lawObj.id, i), {
          index: i,
          articles: slice,
          updatedAt: nowIso
        });
        newRanges.push({ chunkIndex: i, startIdx: cursor, endIdx: cursor + slice.length });
        cursor += slice.length;
        completed++;
        if (onProgress) onProgress(completed, totalSteps);
      }

      // Atualiza documento-mestre da lei (sem array de artigos, apenas metadados)
      await setDoc(lawDocRef(uid, lawObj.id), {
        id: lawObj.id,
        subjectId: lawObj.subjectId,
        shortName: lawObj.shortName || lawObj.title,
        title: lawObj.title,
        subtitle: lawObj.subtitle || '',
        isChunked: true,
        chunkCount: chunks.length,
        articleCount: compactArts.length,
        articles: [],
        updatedAt: nowIso
      });

      lawObj.isChunked = true;
      lawObj.chunkCount = chunks.length;
      lawObj._chunkRanges = newRanges;

      if (onProgress) onProgress(totalSteps, totalSteps);
    }

    async function saveSingleChunksForArticles(uid, lawObj, articleIds) {
      if (!lawObj.isChunked || !Array.isArray(lawObj._chunkRanges) || lawObj._chunkRanges.length === 0) {
        await saveFullLawToFirestore(uid, lawObj);
        return;
      }

      const idSet = new Set(articleIds);
      const touchedChunkIndices = new Set();

      for (const range of lawObj._chunkRanges) {
        for (let i = range.startIdx; i < range.endIdx; i++) {
          const art = lawObj.articles[i];
          if (art && idSet.has(art.id)) {
            touchedChunkIndices.add(range.chunkIndex);
            break;
          }
        }
      }

      if (touchedChunkIndices.size === 0) {
        await saveFullLawToFirestore(uid, lawObj);
        return;
      }

      const nowIso = new Date().toISOString();
      for (const chIdx of touchedChunkIndices) {
        const range = lawObj._chunkRanges.find(r => r.chunkIndex === chIdx);
        if (!range) {
          await saveFullLawToFirestore(uid, lawObj);
          return;
        }
        const compactSlice = lawObj.articles.slice(range.startIdx, range.endIdx).map(compactArticle);
        if (utf8ByteLength(JSON.stringify(compactSlice)) > SINGLE_CHUNK_MAX_BYTES) {
          // Bloco cresceu muito após muitas observações -> rebalanceia todos os blocos
          await saveFullLawToFirestore(uid, lawObj);
          return;
        }
        await setDoc(lawChunkDocRef(uid, lawObj.id, chIdx), {
          index: chIdx,
          articles: compactSlice,
          updatedAt: nowIso
        });
      }
    }

    function scheduleSaveWorkspace(immediate = false) {
      if (!currentUser) return;
      clearTimeout(workspaceSaveTimer);
      setSyncStatus('saving');

      const run = async () => {
        if (!currentUser) return;
        try {
          await setDoc(workspaceDocRef(currentUser.uid), {
            preferences: workspace.preferences,
            subjects: workspace.subjects,
            lawIndex: workspace.lawIndex,
            updatedAt: new Date().toISOString()
          });
          setSyncStatus('synced');
        } catch (err) {
          console.error('Erro ao salvar workspace:', err);
          setSyncStatus('error');
          showToast('Erro ao sincronizar preferências na nuvem.', 'error');
        }
      };

      if (immediate) run();
      else workspaceSaveTimer = setTimeout(run, 500);
    }

    function scheduleSaveActiveLaw({ articleId = null, full = false, immediate = false } = {}) {
      if (!currentUser || !activeLawDoc) return;
      if (full || !articleId) pendingLawSaveDirtyFull = true;
      else pendingLawSaveArticleIds.add(articleId);

      clearTimeout(lawSaveTimer);
      setSyncStatus('saving');

      const run = async () => {
        if (!currentUser || !activeLawDoc) return;
        const doFull = pendingLawSaveDirtyFull;
        const ids = Array.from(pendingLawSaveArticleIds);
        pendingLawSaveDirtyFull = false;
        pendingLawSaveArticleIds.clear();

        try {
          if (doFull || !activeLawDoc.isChunked) {
            await saveFullLawToFirestore(currentUser.uid, activeLawDoc);
          } else {
            await saveSingleChunksForArticles(currentUser.uid, activeLawDoc, ids);
          }
          setSyncStatus('synced');
        } catch (err) {
          console.error('Erro ao salvar lei na nuvem:', err);
          setSyncStatus('error');
          showToast(err.message || 'Erro ao salvar alterações na nuvem.', 'error');
        }
      };

      if (immediate) run();
      else lawSaveTimer = setTimeout(run, 650);
    }

    async function seedNewUserAccount(uid) {
      if (isSeeding) return;
      isSeeding = true;
      try {
        const { initialWorkspace, laws } = buildInitialSeedData();
        for (const law of laws) {
          await saveFullLawToFirestore(uid, law);

    async function handleEmailLogin(event) {
      event.preventDefault();
      const email = (document.getElementById('loginEmail')?.value || '').trim();
      const password = document.getElementById('loginPassword')?.value || '';
      const btn = document.getElementById('loginSubmitBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Autenticando...'; }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error('Erro no login:', err);
        const msg = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
          ? 'E-mail ou senha inválidos.'
          : err.code === 'auth/too-many-requests'
            ? 'Muitas tentativas seguidas. Aguarde alguns instantes.'
            : `Falha na autenticação (${err.code || 'erro'}).`;
        renderPrivateLoginScreen(msg);
      }
    }

    async function handleGoogleLogin() {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === 'auth/popup-closed-by-user') return;
        console.error('Erro no Google Login:', err);
        renderPrivateLoginScreen(`Não foi possível entrar com Google (${err.code || 'erro'}).`);
      }
    }

    function teardownSession() {
      clearTimeout(workspaceSaveTimer);
      clearTimeout(lawSaveTimer);
      if (unsubWorkspace) { unsubWorkspace(); unsubWorkspace = null; }
      if (unsubActiveLaw) { unsubActiveLaw(); unsubActiveLaw = null; }
      currentSubscribedLawId = null;
      currentUser = null;
      activeLawDoc = null;
      workspace = {
        preferences: { darkMode: true, fontSize: 16, fontFamily: 'sans', activeSubjectId: '', activeLawId: '' },
        subjects: [],
        lawIndex: []
      };
      searchQuery = '';
      filterAnnotatedOnly = false;
      filterModsOnly = false;
      filterUpdatedOnly = false;
      visibleArticlesLimit = INITIAL_VISIBLE_ARTICLES;
      editingArticleId = null;
      renameTargetSubjectId = null;
      lastJumpKey = '';
      lastJumpMatchCursor = -1;
      isArchivedMenuOpen = false;
      pendingLawUpdatePlan = null;
      updateExpandedDiffs.clear();
      openNotes.clear();
      openMods.clear();
      openModForms.clear();
    }

    async function handleLogout() {
      try {
        teardownSession();
        await signOut(auth);
        renderPrivateLoginScreen();
        showToast('Sessão encerrada com segurança.', 'info');
      } catch (err) {
        console.error('Erro ao sair:', err);
        showToast('Erro ao encerrar sessão.', 'error');
      }
    }

    function subscribeToActiveLaw(uid, lawId) {
      if (currentSubscribedLawId === lawId && unsubActiveLaw) return;
      if (unsubActiveLaw) { unsubActiveLaw(); unsubActiveLaw = null; }
      currentSubscribedLawId = lawId;

      if (!lawId) {
        activeLawDoc = null;
        renderMainView();
        return;
      }

      unsubActiveLaw = onSnapshot(lawDocRef(uid, lawId), async (snap) => {
        if (!currentUser || currentSubscribedLawId !== lawId) return;
        // Evita sobrescrever o DOM enquanto o usuário está digitando no editor ou em uma observação
        const activeTag = document.activeElement?.tagName;
        if (editingArticleId || activeTag === 'TEXTAREA') return;

        if (!snap.exists()) {
          activeLawDoc = null;
          renderMainView();
          return;
        }
        try {
          activeLawDoc = await loadLawFromFirestore(uid, lawId, snap);
          renderMainView();
          applyVisualPreferences();
        } catch (err) {
          console.error('Erro ao carregar lei:', err);
          showToast('Erro ao carregar artigos da nuvem.', 'error');
        }
      }, (err) => {
        console.error('Erro na assinatura da lei:', err);
        setSyncStatus('error', 'Sem permissão ou offline');
      });
    }

    function startAuthenticatedWorkspace(user) {
      currentUser = user;
      mountAuthenticatedAppShell(user);

      unsubWorkspace = onSnapshot(workspaceDocRef(user.uid), async (snap) => {
        if (!currentUser) return;
        if (!snap.exists()) {
          await seedNewUserAccount(user.uid);
          return;
        }
        const data = snap.data();
        workspace.preferences = {
          darkMode: data.preferences?.darkMode !== undefined ? Boolean(data.preferences.darkMode) : true,
          fontSize: Number(data.preferences?.fontSize) || 16,
          fontFamily: data.preferences?.fontFamily === 'serif' ? 'serif' : 'sans',
          activeSubjectId: data.preferences?.activeSubjectId || '',
          activeLawId: data.preferences?.activeLawId || ''
        };
        workspace.subjects = Array.isArray(data.subjects) ? data.subjects : [];
        workspace.lawIndex = Array.isArray(data.lawIndex) ? data.lawIndex : [];

        // Garante que existe uma lei ativa válida se houver leis cadastradas
        const activeExists = workspace.lawIndex.some(l => l.id === workspace.preferences.activeLawId);
        if (!activeExists && workspace.lawIndex.length > 0) {
          const archivedSubIds = new Set(workspace.subjects.filter(s => s.archived).map(s => s.id));
          const firstActive = workspace.lawIndex.find(l => !l.archived && !archivedSubIds.has(l.subjectId)) || workspace.lawIndex[0];
          workspace.preferences.activeSubjectId = firstActive.subjectId;
          workspace.preferences.activeLawId = firstActive.id;
        }

        applyVisualPreferences();
        renderSidebar();
        subscribeToActiveLaw(user.uid, workspace.preferences.activeLawId);
      }, (err) => {
        console.error('Erro ao sincronizar workspace:', err);
        setSyncStatus('error', 'Acesso negado no Firestore');
        showToast('Erro de permissão no Firestore. Verifique as Regras de Segurança e seu UID.', 'error');
      });
    }

    function getFilteredArticles() {
      if (!activeLawDoc || !Array.isArray(activeLawDoc.articles)) return [];
      const q = normalizeSearch(searchQuery.trim());

      return activeLawDoc.articles.filter(art => {
        if (filterAnnotatedOnly) {
          const hasNote = Boolean(art.note && art.note.trim());
          const hasEdit = art.html !== art.originalHtml;
          if (!hasNote && !hasEdit) return false;
        }
        if (filterModsOnly) {
          if (!art.modifications || art.modifications.length === 0) return false;
        }
        if (filterUpdatedOnly) {
          if (!art.updateBadge) return false;
        }
        if (filterFavoritesOnly) {
          if (!art.favorite) return false;
        }
        if (q) {
          const hay = normalizeSearch(
            `${art.number} ${art.sectionHeader || ''} ${stripHtmlToText(art.html)} ${art.note || ''}`
          );
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

            filterUpdatedOnly
              ? 'bg-emerald-600 text-white border-emerald-600'
              : 'border-emerald-300 dark:border-emerald-700 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 hover:border-emerald-500'
          }`;
        } else {
          btnUpd.classList.add('hidden');
          if (filterUpdatedOnly) filterUpdatedOnly = false;
        }
      }
      if (btnClearBadges) {
        btnClearBadges.classList.toggle('hidden', recentUpdatedCount === 0);
      }

      const lawMeta = workspace.lawIndex.find(l => l.id === activeLawDoc.id);
      const isArchived = Boolean(lawMeta?.archived || subject?.archived);
      badge.textContent = `${subject ? subject.name : 'Legislação'}${isArchived ? ' • Arquivada' : ''}`;
      title.textContent = activeLawDoc.title;
      if (chip) chip.textContent = activeLawDoc.shortName || activeLawDoc.title;
      if (subtitle) subtitle.textContent = activeLawDoc.subtitle || '';
      if (metrics) {
        metrics.textContent = `Exibindo ${filteredCount} de ${total} artigos • ${editedCount} editados • ${notesCount} observações • ${modsCount} c/ modificações • ${favCount} favoritos`;
      }
    }

    function renderArticleCardHtml(art) {
      const isEditing = editingArticleId === art.id;
      const isNoteOpen = openNotes.has(art.id);
      const isModsOpen = openMods.has(art.id);
      const isModFormOpen = openModForms.has(art.id);
      const hasNote = Boolean(art.note && art.note.trim());
      const hasMods = Array.isArray(art.modifications) && art.modifications.length > 0;
      const hasEdits = art.html !== art.originalHtml;
      const fontCls = workspace.preferences.fontFamily === 'serif' ? 'font-reading-serif' : '';

      const sectionDividerHtml = art.sectionHeader
        ? `<div class="pt-4 pb-1 flex items-center gap-3">

             <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 text-center px-2">

      const toolbarHtml = isEditing
        ? `<div class="mb-3 p-2 rounded-xl bg-slate-100 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 flex flex-wrap items-center gap-1.5 text-xs">

               class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 italic hover:border-indigo-400">I</button>
             <button type="button" onmousedown="event.preventDefault(); applyFormat('underline')" title="Sublinhado"
               class="px-2.5 py-1 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 underline hover:border-indigo-400">U</button>

             <button type="button" onmousedown="event.preventDefault(); applyTextColor('#15803d')" title="Texto Verde" class="w-5 h-5 rounded-full bg-[#15803d] border border-white/40"></button>
             <button type="button" onmousedown="event.preventDefault(); applyTextColor('default')" title="Cor padrão"
               class="px-2 py-0.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-[11px] text-slate-600 dark:text-slate-300">Padrão</button>

             <div class="ml-auto flex items-center gap-1.5">
               <button type="button" onclick="confirmRestoreArticle('${art.id}')"
                 class="px-2.5 py-1 rounded-lg text-[11px] font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50">Restaurar Original</button>
               <button type="button" onclick="toggleEditArticle('${art.id}')"
                 class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-indigo-600 hover:bg-indigo-500 text-white">Concluir</button>
             </div>
           </div>`
        : '';

      const noteDrawerHtml = isNoteOpen
        ? `<div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-800">
             ${art.updateBadge === 'updated' && hasNote ? `
               <div class="mb-2 px-3 py-2 rounded-xl bg-amber-100/80 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-800 flex items-center justify-between gap-2 text-[11px] text-amber-900 dark:text-amber-200">
                 <span>Este artigo recebeu atualização legislativa — revise se sua observação continua válida.</span>
                 <button type="button" onclick="dismissArticleUpdateBadge('${art.id}')" class="shrink-0 font-bold underline hover:opacity-80">Ok, revisado</button>
               </div>
             ` : ''}
             <div class="flex items-center justify-between mb-1.5">
               <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">Observações & Dicas de Banca</span>
               <span class="text-[10px] text-slate-400">Salvamento automático na nuvem</span>
             </div>
             <textarea rows="3" oninput="handleNoteInput('${art.id}', this.value)"
               placeholder="Escreva mnemônicos, jurisprudência, pegadinhas de prova..."
               class="w-full p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/80 dark:border-amber-900/50 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-400">${escapeHtml(art.note || '')}</textarea>
           </div>`
        : '';

      const modsListHtml = hasMods
        ? art.modifications.map(m => `
            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 space-y-1.5">
              <div class="flex items-start justify-between gap-2">
                <span class="text-[11px] font-bold ${/^(Vide|Regulamento|Vigência)/i.test(m.norm || '') ? 'text-sky-700 dark:text-sky-300' : 'text-violet-700 dark:text-violet-300'}">${escapeHtml(m.norm || 'Alteração legislativa')}</span>
                <button type="button" onclick="deleteModification('${art.id}', '${m.id}')" title="Remover registro"

              ${m.oldText ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-through leading-relaxed whitespace-pre-line">${escapeHtml(m.oldText)}</p>` : ''}
              ${m.newText ? `<p class="text-xs text-slate-700 dark:text-slate-200 leading-relaxed whitespace-pre-line"><span class="font-semibold text-emerald-600 dark:text-emerald-400">${m.kind === 'auto' ? 'Dispositivo:' : 'Nova redação:'}</span> ${escapeHtml(m.newText)}</p>` : ''}

      const modFormHtml = isModFormOpen
        ? `<form onsubmit="handleAddModification(event, '${art.id}')" class="mt-3 p-3 rounded-xl bg-violet-50/60 dark:bg-violet-950/25 border border-violet-200 dark:border-violet-800/60 space-y-2.5">

             <textarea name="oldText" rows="2" required placeholder="Redação anterior (aparecerá tachada no estilo Planalto)..."
               class="w-full px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-violet-500"></textarea>
             <textarea name="newText" rows="2" placeholder="Resumo da nova redação (opcional)..."
               class="w-full px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-violet-500"></textarea>
             <div class="flex justify-end gap-2">
               <button type="button" onclick="toggleModForm('${art.id}')" class="px-3 py-1 rounded-lg text-xs text-slate-500 hover:bg-slate-200/60 dark:hover:bg-slate-800">Cancelar</button>
               <button type="submit" class="px-3 py-1 rounded-lg text-xs font-semibold bg-violet-600 hover:bg-violet-500 text-white">Salvar Modificação</button>
             </div>
           </form>`
        : '';

      const modsDrawerHtml = isModsOpen
        ? `<div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-800">
             <div class="flex items-center justify-between mb-2">
               <span class="text-[11px] font-bold uppercase tracking-wider text-violet-600 dark:text-violet-400">Histórico de Modificações (Planalto)</span>
               <button type="button" onclick="toggleModForm('${art.id}')" class="text-[11px] font-semibold text-violet-600 dark:text-violet-400 hover:underline">
                 ${isModFormOpen ? 'Fechar formulário' : '+ Registrar modificação'}
               </button>
             </div>
             <div class="space-y-2">${modsListHtml}</div>
             ${modFormHtml}
           </div>`
        : '';

      return `
        ${sectionDividerHtml}
        <article id="card_${art.id}" class="relative rounded-2xl border-2 transition-all p-4 sm:p-5 bg-white dark:bg-slate-900/90 shadow-xs ${
          isEditing
            ? 'border-indigo-500 ring-2 ring-indigo-500/20'
            : art.favorite
              ? 'border-amber-300 dark:border-amber-600/60 hover:border-amber-400 dark:hover:border-amber-500'
              : 'border-slate-200/90 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700'
        }">
          ${isEditing ? '' : `
            <button type="button" onclick="toggleFavoriteArticle('${art.id}')"
              title="${art.favorite ? 'Remover dos favoritos' : 'Marcar como favorito'}"
              aria-label="${art.favorite ? 'Remover dos favoritos' : 'Marcar como favorito'}" aria-pressed="${art.favorite ? 'true' : 'false'}"
              class="absolute top-2.5 right-2.5 z-10 p-1.5 rounded-lg transition-colors ${
                art.favorite
                  ? 'text-amber-500 hover:text-amber-600 bg-amber-50 dark:bg-amber-950/40'
                  : 'text-slate-300 dark:text-slate-600 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-950/30'
              }">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="${art.favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.563.563 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
              </svg>
            </button>
          `}
          ${toolbarHtml}

          <div id="body_${art.id}"
            class="article-body ${fontCls} text-slate-800 dark:text-slate-100 ${isEditing ? '' : 'pr-8'}"
            style="font-size: ${workspace.preferences.fontSize}px"
            ${isEditing ? `contenteditable="true" spellcheck="false" oninput="handleArticleBodyInput('${art.id}')"` : ''}>
            ${art.html}
          </div>

          <!-- Rodapé do cartão com os 3 botões do esboço -->
          <div class="mt-4 pt-2.5 border-t border-slate-100 dark:border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2 text-[11px] text-slate-400">
              ${art.updateBadge === 'new' ? `
                <button type="button" onclick="dismissArticleUpdateBadge('${art.id}')" title="Clique para marcar como revisado"
                  class="px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300 border border-emerald-300/70 dark:border-emerald-800 font-bold hover:opacity-80">
                  Novo ×
                </button>
              ` : ''}
              ${art.updateBadge === 'updated' ? `
                <button type="button" onclick="dismissArticleUpdateBadge('${art.id}')" title="Clique para marcar como revisado"
                  class="px-2 py-0.5 rounded-full bg-sky-100 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300 border border-sky-300/70 dark:border-sky-800 font-bold hover:opacity-80">
                  Atualizado ×
                </button>
              ` : ''}
              ${hasEdits ? '<span class="px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 font-semibold">Editado</span>' : ''}
              <button type="button" onclick="confirmDeleteArticle('${art.id}')" title="Excluir artigo"
                class="hover:text-rose-500 transition-colors">Excluir</button>
            </div>

            <div class="flex items-center gap-1.5 ml-auto">
              <!-- Botão 1: Editar -->
              <button type="button" onclick="toggleEditArticle('${art.id}')" title="Botão 1: Editar, grifar ou colorir texto"
                class="px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition-colors ${
                  isEditing
                    ? 'bg-indigo-600 text-white border-indigo-600'
                    : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-indigo-400'
                }">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
                <span>Editar</span>
              </button>

              <!-- Botão 2: Observações -->
              <button type="button" onclick="toggleNoteDrawer('${art.id}')" title="Botão 2: Abrir observações do artigo"
                class="px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition-colors ${
                  isNoteOpen
                    ? 'bg-amber-500 text-white border-amber-500'
                    : hasNote
                      ? 'bg-amber-50 dark:bg-amber-950/50 border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-300'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-amber-400'
                }">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
                </svg>
                <span>Obs${hasNote ? ' •' : ''}</span>
              </button>

              <!-- Botão 3: Modificações -->
              <button type="button" onclick="toggleModsDrawer('${art.id}')" title="Botão 3: Histórico de modificações legislativas"
                class="px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 border transition-colors ${
                  isModsOpen
                    ? 'bg-violet-600 text-white border-violet-600'
                    : hasMods
                      ? 'bg-violet-50 dark:bg-violet-950/50 border-violet-300 dark:border-violet-700 text-violet-800 dark:text-violet-300'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-violet-400'
                }">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Modif.${hasMods ? ` (${art.modifications.length})` : ''}</span>
              </button>
            </div>
          </div>

          ${noteDrawerHtml}
          ${modsDrawerHtml}
        </article>
      `;
    }

    function renderMainView() {
      const container = document.getElementById('articlesContainer');
      const paginationEl = document.getElementById('paginationContainer');
      if (!container) return;

      const filtered = getFilteredArticles();
      renderHeader(filtered.length);

      if (!activeLawDoc) {
        container.innerHTML = `
          <div class="rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-800 p-10 text-center">
            <p class="text-sm font-semibold text-slate-600 dark:text-slate-300">Nenhuma lei aberta no momento</p>
            <p class="text-xs text-slate-400 mt-1 mb-4">Escolha uma lei no menu à esquerda ou clique em Importar para enviar um arquivo .md ou .txt.</p>
            <button type="button" onclick="openImportModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold">Importar Lei Seca</button>
          </div>
        `;
        if (paginationEl) paginationEl.classList.add('hidden');
        return;
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-10 text-center">
            <p class="text-sm font-semibold text-slate-600 dark:text-slate-300">Nenhum artigo encontrado com os filtros atuais.</p>
            <button type="button" onclick="clearFilters()" class="mt-3 px-4 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold text-indigo-600 dark:text-indigo-400">Limpar busca e filtros</button>
          </div>
        `;
        if (paginationEl) paginationEl.classList.add('hidden');
        return;
      }

      const slice = filtered.slice(0, visibleArticlesLimit);
      container.innerHTML = slice.map(renderArticleCardHtml).join('');

      if (paginationEl) {
        const remaining = filtered.length - slice.length;
        if (remaining > 0) {
          paginationEl.classList.remove('hidden');
          paginationEl.innerHTML = `
            <button type="button" onclick="loadMoreArticles()"
              class="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:border-indigo-500 text-slate-700 dark:text-slate-200 shadow-xs transition-colors">
              Carregar mais ${Math.min(LOAD_MORE_STEP, remaining)} artigos (${remaining} restantes)
            </button>
            <button type="button" onclick="showAllArticles()"
              class="px-4 py-2 rounded-xl text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 transition-colors">
              Mostrar todos (${filtered.length})
            </button>
          `;
        } else {
          paginationEl.classList.add('hidden');
          paginationEl.innerHTML = '';
        }
      }
    }

    function rerenderSingleArticleCard(articleId) {
      if (!activeLawDoc) return;
      const art = activeLawDoc.articles.find(a => a.id === articleId);
      const card = document.getElementById(`card_${articleId}`);
      if (!art || !card) {
        renderMainView();
        return;
      }
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderArticleCardHtml(art).trim();
      const newCard = wrapper.querySelector(`#card_${articleId}`);
      if (newCard) {
        card.replaceWith(newCard);
      }
    }

    // -----------------------------------------------------------------------
    // 12. INTERAÇÕES DE ESTUDO (EDIÇÃO, GRIFO, CORES, OBS, MODIFICAÇÕES)
    // -----------------------------------------------------------------------
    function toggleEditArticle(articleId) {
      if (editingArticleId && editingArticleId !== articleId) {
        const prevId = editingArticleId;
        captureEditedArticleBody(prevId, true);
        editingArticleId = null;
        rerenderSingleArticleCard(prevId);
      }

      if (editingArticleId === articleId) {
        captureEditedArticleBody(articleId, true);
        editingArticleId = null;
        rerenderSingleArticleCard(articleId);
      } else {
        editingArticleId = articleId;
        rerenderSingleArticleCard(articleId);
        const bodyEl = document.getElementById(`body_${articleId}`);
        if (bodyEl) bodyEl.focus();
      }
    }

    function captureEditedArticleBody(articleId, immediate = false) {
      if (!activeLawDoc) return;
      const art = activeLawDoc.articles.find(a => a.id === articleId);
      const bodyEl = document.getElementById(`body_${articleId}`);
      if (!art || !bodyEl) return;

      const clean = sanitizeHtml(bodyEl.innerHTML);
      if (clean !== art.html) {
        art.html = clean;
        scheduleSaveActiveLaw({ articleId, immediate });
        renderHeader(getFilteredArticles().length);
      }
    }

    function handleArticleBodyInput(articleId) {
      captureEditedArticleBody(articleId, false);
    }

    function applyFormat(cmd) {
      if (!editingArticleId) return;
      document.execCommand(cmd, false, null);
      captureEditedArticleBody(editingArticleId, false);
    }

    function applyHighlight(color) {
      if (!editingArticleId) return;
      try {
        document.execCommand('styleWithCSS', false, true);
      } catch (_) {}
      document.execCommand('hiliteColor', false, color);
      captureEditedArticleBody(editingArticleId, false);
    }

    function isSelectionInsideHighlight() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return false;
      let node = sel.anchorNode;
      if (node && node.nodeType === Node.TEXT_NODE) node = node.parentElement;
      while (node && !node.classList?.contains('article-body')) {
        if (node.tagName === 'MARK') return true;
        const bg = node.style?.backgroundColor || '';
        if (bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)') return true;
        node = node.parentElement;
      }
      return false;

    function detectModificationsCurrentLaw() {
      if (!activeLawDoc || !activeLawDoc.articles.length) return;
      if (editingArticleId) {
        captureEditedArticleBody(editingArticleId, true);
        editingArticleId = null;
      }
      const sig = art => (art.modifications || []).filter(m => m.kind === 'auto').map(m => `${m.norm}|${m.newText}`).join('\n');
      let totalDetected = 0;
      let articlesWithMods = 0;
      let articlesChanged = 0;
      for (const art of activeLawDoc.articles) {
        const before = sig(art);
        const found = refreshAutoModifications(art);
        if (found > 0) { totalDetected += found; articlesWithMods++; }
        if (sig(art) !== before) articlesChanged++;
      }
      if (articlesChanged === 0) {
        showToast(totalDetected > 0 ? 'As modificações desta lei já estavam atualizadas.' : 'Nenhuma anotação de modificação encontrada no texto desta lei.', 'info');
        renderMainView();
        return;
      }
      scheduleSaveActiveLaw({ full: true, immediate: true });
      renderMainView();
      showToast(`${totalDetected} modificações detectadas em ${articlesWithMods} artigos.`, 'success');
    }

      if (!activeLawDoc || !activeLawDoc.articles.length) return;
