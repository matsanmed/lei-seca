      const cleanTarget = raw
        .replace(/^art\.?\s*/i, '')
        .replace(/[º°oª]/gi, '')
        .replace(/\.$/, '')
        .trim()
        .toUpperCase();

      const matches = [];
      activeLawDoc.articles.forEach((art, index) => {
        const cleanArt = String(art.number || '')
          .replace(/\(ADCT\)/gi, '')
          .replace(/^art\.?\s*/i, '')
          .replace(/[º°oª]/gi, '')
          .replace(/\.$/, '')
          .trim()
          .toUpperCase();
        if (cleanArt === cleanTarget) {
          matches.push({ art, index });
        }
      });

      if (matches.length === 0) {
        showToast(`Artigo "${raw}" não encontrado nesta lei.`, 'error');
        return;

      if (lastJumpKey === cleanTarget) {
        lastJumpMatchCursor = (lastJumpMatchCursor + 1) % matches.length;
      } else {
        lastJumpKey = cleanTarget;
        lastJumpMatchCursor = 0;
      }

      const chosen = matches[lastJumpMatchCursor];

      navigateToArticle(chosen.art.id);

    // -----------------------------------------------------------------------
    // 13B. SUMÁRIO DA LEI (ESTRUTURA E ÍNDICE DE ARTIGOS)
    // -----------------------------------------------------------------------
    function tocLevelOf(label) {
      const s = String(label || '').toUpperCase();
      if (/^(ATO DAS|PREÂMBULO|LIVRO|PARTE)\b/.test(s)) return 0;
      if (/^TÍTULO\b/.test(s)) return 1;
      if (/^CAPÍTULO\b/.test(s)) return 2;
      if (/^SUBSEÇÃO\b/.test(s)) return 4;
      if (/^SEÇÃO\b/.test(s)) return 3;
      return 1;
    }

    function isTocStructuralToken(token) {
      return /^(LIVRO|PARTE|TÍTULO|CAPÍTULO|SEÇÃO|SUBSEÇÃO|ATO DAS DISPOSIÇÕES|PREÂMBULO|DISPOSIÇÕES)\b/i.test(token);
    }

    function buildTocStructure() {
      if (!activeLawDoc) return [];
      const arts = activeLawDoc.articles || [];
      const entries = [];

      arts.forEach((art, idx) => {
        if (!art.sectionHeader) return;
        const tokens = String(art.sectionHeader).split(' • ').map(t => t.trim()).filter(Boolean);
        let current = null;
        tokens.forEach(tok => {
          if (isTocStructuralToken(tok) || !current) {
            current = { label: tok, rawLevel: tocLevelOf(tok), startIdx: idx, artId: art.id };
            entries.push(current);
          } else {
            current.label += ' — ' + tok;
          }
        });
      });

      // Compacta os níveis presentes em 0, 1, 2... para indentar de forma proporcional
      const levels = Array.from(new Set(entries.map(e => e.rawLevel))).sort((a, b) => a - b);
      entries.forEach(e => { e.rank = levels.indexOf(e.rawLevel); });

      entries.forEach((e, i) => {
        let endIdx = arts.length - 1;
        for (let j = i + 1; j < entries.length; j++) {
          if (entries[j].rawLevel <= e.rawLevel && entries[j].startIdx > e.startIdx) {
            endIdx = entries[j].startIdx - 1;
            break;
          }
        }
        e.endIdx = Math.max(endIdx, e.startIdx);
      });
      return entries;
    }

    function tocShortNumber(number) {
      return String(number || '').replace(/^art\.?\s*/i, '').trim();
    }

    function renderToc() {
      const body = document.getElementById('tocBody');
      const nameEl = document.getElementById('tocLawName');
      const tabS = document.getElementById('tocTabStructure');
      const tabA = document.getElementById('tocTabArticles');
      if (!body || !activeLawDoc) return;

      if (nameEl) nameEl.textContent = activeLawDoc.shortName || activeLawDoc.title || '';
      const activeCls = 'px-3 py-1.5 transition-colors bg-indigo-600 text-white';
      const idleCls = 'px-3 py-1.5 transition-colors bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700';
      if (tabS) tabS.className = tocMode === 'structure' ? activeCls : idleCls;
      if (tabA) tabA.className = tocMode === 'articles' ? activeCls : idleCls;

      const q = normalizeSearch(tocQuery.trim());
      const arts = activeLawDoc.articles;

      if (tocMode === 'structure') {
        let entries = buildTocStructure();
        if (entries.length === 0) {
          body.innerHTML = `<p class="text-xs text-slate-500 dark:text-slate-400 text-center py-8">Esta lei não tem títulos ou capítulos identificados.<br/>Use a aba <strong>Artigos</strong> para navegar pelos números.</p>`;
          return;
        }
        if (q) entries = entries.filter(e => normalizeSearch(e.label).includes(q));
        if (entries.length === 0) {
          body.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Nada encontrado para "${escapeHtml(tocQuery)}".</p>`;
          return;
        }
        body.innerHTML = `<div class="space-y-0.5">` + entries.map(e => {
          const first = arts[e.startIdx]?.number || '';
          const last = arts[e.endIdx]?.number || '';
          const range = e.startIdx === e.endIdx ? first : `${first} a ${tocShortNumber(last)}`;
          const strong = e.rank <= 1;
          return `
            <button type="button" onclick="goToTocArticle('${escapeHtml(e.artId)}')"
              style="margin-left: ${Math.min(e.rank, 4) * 14}px; width: calc(100% - ${Math.min(e.rank, 4) * 14}px)"
              class="text-left px-3 py-2 rounded-lg flex items-center justify-between gap-3 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 transition-colors">
              <span class="text-sm ${strong ? 'font-bold text-slate-900 dark:text-slate-100' : 'font-medium text-slate-700 dark:text-slate-300'}">${escapeHtml(e.label)}</span>
              <span class="text-[11px] shrink-0 text-slate-400 dark:text-slate-500">${escapeHtml(range)}</span>
            </button>`;
        }).join('') + `</div>`;
        return;
      }

      // Modo "Artigos": grade com todos os números
      const chips = [];
      arts.forEach(art => {
        const short = tocShortNumber(art.number);
        if (q && !normalizeSearch(short).includes(q)) return;
        const fav = art.favorite === true;
        chips.push(`
          <button type="button" onclick="goToTocArticle('${escapeHtml(art.id)}')" title="${escapeHtml(art.number)}${fav ? ' (favorito)' : ''}"
            class="px-2.5 py-1 rounded-lg text-xs font-semibold border transition-colors ${
              fav
                ? 'bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-300 hover:border-amber-500'
                : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40'
            }">${fav ? '★ ' : ''}${escapeHtml(short)}</button>`);
      });
      body.innerHTML = chips.length === 0
        ? `<p class="text-xs text-slate-400 text-center py-8">Nenhum artigo encontrado para "${escapeHtml(tocQuery)}".</p>`
        : `<div class="flex flex-wrap gap-1.5">${chips.join('')}</div>`;
    }

      const title = (document.getElementById('renameLawTitleInput')?.value || '').trim();
      const subtitle = (document.getElementById('renameLawSubtitleInput')?.value || '').trim();
      if (!shortName || !title) return;

      meta.shortName = shortName;
      meta.title = title;
      meta.subtitle = subtitle;
      if (activeLawDoc && activeLawDoc.id === id) {
        activeLawDoc.shortName = shortName;
        activeLawDoc.title = title;
        activeLawDoc.subtitle = subtitle;
      }

      closeModal('renameLawModal');
      renderSidebar();
      renderHeader(getFilteredArticles().length);
      scheduleSaveWorkspace(true);

      // Grava só os metadados no documento da lei (merge), sem reescrever os artigos
      setSyncStatus('saving');
      try {
        await setDoc(lawDocRef(currentUser.uid, id), {
          shortName, title, subtitle, updatedAt: new Date().toISOString()
        }, { merge: true });
        setSyncStatus('synced');
        showToast('Nome da lei atualizado.', 'success');
      } catch (err) {
        console.error('Erro ao renomear lei:', err);
        setSyncStatus('error');
        showToast('Erro ao salvar o novo nome na nuvem.', 'error');
      }
    }

      const lawsInSub = workspace.lawIndex.filter(l => l.subjectId === subjectId);
      openConfirmModal(
        `Excluir matéria "${sub.name}"?`,

        async () => {

          try {

              await deleteLawChunks(currentUser.uid, l.id);
              await deleteDoc(lawDocRef(currentUser.uid, l.id));

            workspace.subjects = workspace.subjects.filter(s => s.id !== subjectId);

            if (!workspace.lawIndex.some(l => l.id === workspace.preferences.activeLawId)) {

              workspace.preferences.activeLawId = nextLaw ? nextLaw.id : '';

    function scheduleImportPreview() {
      clearTimeout(importPreviewTimer);
      importPreviewTimer = setTimeout(updateImportPreview, 260);
    }

    function updateImportPreview() {
      const box = document.getElementById('importPreviewBox');
      const statsEl = document.getElementById('importPreviewStats');
      const listEl = document.getElementById('importPreviewList');
      const rawText = (document.getElementById('importLawRawText')?.value || '').trim();
      if (!box || !statsEl || !listEl) return;

      if (!rawText) {
        box.classList.add('hidden');
        return;
      }

      const parsed = parseLawText(rawText);
      const totalMods = parsed.reduce((acc, a) => acc + (a.modifications?.length || 0), 0);
      const approxKb = Math.max(1, Math.round(utf8ByteLength(rawText) / 1024));

      box.classList.remove('hidden');
      if (parsed.length === 0) {
        statsEl.textContent = '0 artigo(s)';
        listEl.innerHTML = `<p class="text-rose-600 dark:text-rose-400">Nenhum artigo detectado (verifique se o texto contém "Art. 1º", "Art. 2º", etc.).</p>`;
        return;
      }

      statsEl.textContent = `${parsed.length} artigo(s) • ${totalMods} modificação(ões) • ~${approxKb} KB`;
      const sample = parsed.slice(0, 4).map(a => {
        const plain = stripHtmlToText(a.html);
        const snippet = plain.length > 96 ? `${plain.slice(0, 96)}...` : plain;
        return `<p class="truncate"><strong class="text-indigo-700 dark:text-indigo-300">${escapeHtml(a.number)}</strong> — ${escapeHtml(snippet)}</p>`;
      }).join('');
      const extra = parsed.length > 4
        ? `<p class="italic text-[11px] text-slate-500 dark:text-slate-400 pt-0.5">+ ${parsed.length - 4} outros artigos prontos para importação...</p>`
        : '';
      listEl.innerHTML = sample + extra;
    }

    function handleImportSubjectChange(val) {
      const newInput = document.getElementById('importNewSubjectInput');
      if (!newInput) return;
      if (val === '__new__') {
        newInput.classList.remove('hidden');
        newInput.required = true;
        newInput.focus();
      } else {
        newInput.classList.add('hidden');
        newInput.required = false;
      }
    }

    function handleImportFileSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const baseName = file.name.replace(/\.(md|txt)$/i, '').trim();
      const shortInput = document.getElementById('importLawShortName');
      const titleInput = document.getElementById('importLawTitle');
      if (shortInput && !shortInput.value) shortInput.value = baseName.slice(0, 26);
      if (titleInput && !titleInput.value) titleInput.value = baseName;

      const reader = new FileReader();
      reader.onload = () => {
        const textArea = document.getElementById('importLawRawText');
        if (textArea) textArea.value = String(reader.result || '');
        updateImportPreview();
      };
      reader.readAsText(file, 'UTF-8');
    }

    async function handleImportLaw(event) {
      event.preventDefault();
      if (!currentUser) return;

      const subjectSelectVal = document.getElementById('importSubjectSelect')?.value || '';
      const newSubName = (document.getElementById('importNewSubjectInput')?.value || '').trim();
      const shortName = (document.getElementById('importLawShortName')?.value || '').trim();
      const title = (document.getElementById('importLawTitle')?.value || '').trim();
      const subtitle = (document.getElementById('importLawSubtitle')?.value || '').trim();
      const rawText = (document.getElementById('importLawRawText')?.value || '').trim();
      if (!shortName || !title || !rawText) return;

      const btn = document.getElementById('importSubmitBtn');
      const progressBox = document.getElementById('importProgressBox');
      const progressText = document.getElementById('importProgressText');
      const progressPct = document.getElementById('importProgressPct');
      const progressBar = document.getElementById('importProgressBar');

      if (btn) { btn.disabled = true; btn.textContent = 'Importando...'; }
      if (progressBox) progressBox.classList.remove('hidden');

      try {
        const articles = parseLawText(rawText);
        if (articles.length === 0) {
          throw new Error('Nenhum artigo foi identificado no texto. Verifique se existem artigos no formato "Art. 1º".');
        }

        let targetSubjectId = subjectSelectVal;
        if (subjectSelectVal === '__new__' || !targetSubjectId) {
          const created = {
            id: generateId('sub'),
            name: newSubName || 'Legislação Geral',
            order: workspace.subjects.length,
            archived: false
          };
          workspace.subjects.push(created);
          targetSubjectId = created.id;
        }

        const newLaw = {
          id: generateId('law'),
          subjectId: targetSubjectId,
          shortName,
          title,
          subtitle,
          articles
        };

        await saveFullLawToFirestore(currentUser.uid, newLaw, (done, total) => {
          const pct = Math.min(100, Math.round((done / Math.max(1, total)) * 100));
          if (progressText) {
            progressText.textContent = total > 2
              ? `Salvando bloco ${done} de ${total} na nuvem...`
              : 'Salvando lei na nuvem...';
          }
          if (progressPct) progressPct.textContent = `${pct}%`;
          if (progressBar) progressBar.style.width = `${pct}%`;
        });

        workspace.lawIndex.push({
          id: newLaw.id,
          subjectId: targetSubjectId,
          shortName: newLaw.shortName,
          title: newLaw.title,
          subtitle: newLaw.subtitle,
          order: workspace.lawIndex.length,
          articleCount: articles.length,
          archived: false
        });
        workspace.preferences.activeSubjectId = targetSubjectId;
        workspace.preferences.activeLawId = newLaw.id;

        scheduleSaveWorkspace(true);
        closeModal('importModal');
        selectLaw(targetSubjectId, newLaw.id);
        showToast(`"${shortName}" importada com ${articles.length} artigos!`, 'success');
      } catch (err) {
        console.error('Erro ao importar lei:', err);
        showToast(err.message || 'Erro ao importar lei.', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Importar e Salvar na Nuvem'; }
      }
    }

    async function analyzeLawUpdate() {
      if (!activeLawDoc) return;
      const rawText = (document.getElementById('updateLawRawText')?.value || '').trim();
      if (!rawText) {
        showToast('Selecione um arquivo .md/.txt ou cole o novo texto da lei.', 'error');
        return;
      }

      const btn = document.getElementById('analyzeUpdateBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Comparando artigos...'; }
      await new Promise(r => setTimeout(r, 30));

      try {
        const incomingArticles = parseLawText(rawText);
        if (incomingArticles.length === 0) {
          throw new Error('Nenhum artigo foi encontrado no arquivo enviado.');
        }

        pendingLawUpdatePlan = computeLawUpdateDiff(activeLawDoc.articles || [], incomingArticles);
        updateExpandedDiffs.clear();

        document.getElementById('updateStepInput')?.classList.add('hidden');
        document.getElementById('updateStepReview')?.classList.remove('hidden');
        renderUpdateReviewStep();
      } catch (err) {
        console.error('Erro ao analisar atualização:', err);
        showToast(err.message || 'Erro ao analisar arquivo de atualização.', 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Analisar Alterações'; }
      }
    }

    function renderUpdateReviewStep() {
      if (!pendingLawUpdatePlan) return;
      const { summary, items } = pendingLawUpdatePlan;
      const summaryEl = document.getElementById('updateReviewSummary');
      const listEl = document.getElementById('updateReviewList');
      const applyBtn = document.getElementById('applyUpdateBtn');
      const controlsEl = document.getElementById('updateReviewControls');

      if (summaryEl) {
        summaryEl.innerHTML = `
          <div class="rounded-xl p-3 bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-center">
            <p class="text-lg font-bold text-slate-800 dark:text-slate-100">${summary.unchangedCount}</p>
            <p class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Inalterados (100% intactos)</p>
          </div>
          <div class="rounded-xl p-3 bg-sky-50 dark:bg-sky-950/40 border border-sky-200 dark:border-sky-800/70 text-center">
            <p class="text-lg font-bold text-sky-700 dark:text-sky-300">${summary.updatedCount}</p>
            <p class="text-[11px] font-semibold text-sky-600 dark:text-sky-400">Artigos alterados</p>
          </div>
          <div class="rounded-xl p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/70 text-center">
            <p class="text-lg font-bold text-emerald-700 dark:text-emerald-300">${summary.newCount}</p>
            <p class="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">Artigos novos</p>
          </div>
          <div class="rounded-xl p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/70 text-center">
            <p class="text-lg font-bold text-amber-700 dark:text-amber-300">${summary.missingCount}</p>
            <p class="text-[11px] font-semibold text-amber-600 dark:text-amber-400">Ausentes no arquivo</p>
          </div>
        `;
      }

      const actionable = items
        .map((item, idx) => ({ item, idx }))
        .filter(x => x.item.type !== 'unchanged');

      if (actionable.length === 0) {
        if (controlsEl) controlsEl.classList.add('hidden');
        if (applyBtn) applyBtn.disabled = true;
        if (listEl) {
          listEl.innerHTML = `
            <div class="rounded-2xl border border-emerald-200 dark:border-emerald-800/60 bg-emerald-50/70 dark:bg-emerald-950/30 p-6 text-center">
              <p class="text-sm font-bold text-emerald-800 dark:text-emerald-300">Sua lei já está 100% atualizada!</p>
              <p class="text-xs text-emerald-700/80 dark:text-emerald-400/80 mt-1">Nenhuma alteração de texto foi encontrada em relação aos ${summary.unchangedCount} artigos analisados.</p>
            </div>
          `;
        }
        return;
      }

      if (controlsEl) controlsEl.classList.remove('hidden');

      const selectedCount = actionable.filter(x => x.item.selected).length;
      if (applyBtn) {
        applyBtn.disabled = selectedCount === 0;
        applyBtn.textContent = selectedCount > 0
          ? `Aplicar ${selectedCount} ${selectedCount === 1 ? 'alteração' : 'alterações'} na Nuvem`
          : 'Selecione ao menos 1 item';
      }

      if (!listEl) return;

      listEl.innerHTML = actionable.map(({ item, idx }) => {
        const isExpanded = updateExpandedDiffs.has(idx);

        if (item.type === 'updated') {
          const { mergeInfo } = item;
          const oldPlain = stripHtmlToText(item.oldArt.originalHtml || item.oldArt.html);
          const newPlain = stripHtmlToText(item.newArt.html);
          return `
            <div class="rounded-xl border border-sky-200 dark:border-sky-800/70 bg-white dark:bg-slate-900/80 p-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="flex items-center gap-2.5 cursor-pointer min-w-0">
                  <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleUpdateItemSelection(${idx}, this.checked)"
                    class="rounded border-slate-300 text-sky-600 focus:ring-sky-500" />
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase bg-sky-100 text-sky-700 dark:bg-sky-950/70 dark:text-sky-300">Alterado</span>
                  <span class="text-xs font-bold text-slate-900 dark:text-white">${escapeHtml(item.oldArt.number)}</span>
                  ${item.hasUserEdits ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300">Tem grifos</span>' : ''}
                  ${item.hasUserNote ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300">Obs. preservada</span>' : ''}
                </label>

                <button type="button" onclick="toggleUpdateDiffExpand(${idx})"
                  class="text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
                  ${isExpanded ? 'Ocultar Antes × Depois' : 'Ver Antes × Depois'}
                </button>
              </div>

              <p class="mt-1.5 pl-6 text-[11px] text-slate-500 dark:text-slate-400">
                ${mergeInfo.preservedClauses > 0 ? `${mergeInfo.preservedClauses} dispositivo(s) inalterado(s) preservado(s) • ` : ''}
                ${mergeInfo.changedClauses} dispositivo(s) atualizado(s)
                ${mergeInfo.reappliedHighlights > 0 ? ` • ${mergeInfo.reappliedHighlights} grifo(s) reaplicado(s)` : ''}
              </p>

              ${isExpanded ? `
                <div class="mt-3 grid grid-cols-1 md:grid-cols-2 gap-2.5 text-xs">
                  <div class="p-3 rounded-xl bg-rose-50/70 dark:bg-rose-950/25 border border-rose-200 dark:border-rose-900/60">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400 mb-1.5">Antes (vai p/ Modificações)</p>
                    <p class="text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line">${escapeHtml(oldPlain)}</p>
                  </div>
                  <div class="p-3 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/25 border border-emerald-200 dark:border-emerald-900/60">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-1.5">Depois (com grifos preservados)</p>
                    <div class="article-body text-xs text-slate-800 dark:text-slate-100">${mergeInfo.mergedHtml}</div>
                  </div>
                </div>
              ` : `
                <p class="mt-1 pl-6 text-[11px] text-slate-400 truncate">${escapeHtml(newPlain.slice(0, 140))}${newPlain.length > 140 ? '...' : ''}</p>
              `}
            </div>
          `;
        }

        if (item.type === 'new') {
          const preview = stripHtmlToText(item.newArt.html);
          return `
            <div class="rounded-xl border border-emerald-200 dark:border-emerald-800/70 bg-white dark:bg-slate-900/80 p-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <label class="flex items-center gap-2.5 cursor-pointer min-w-0">
                  <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleUpdateItemSelection(${idx}, this.checked)"
                    class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500" />
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase bg-emerald-100 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-300">Novo</span>
                  <span class="text-xs font-bold text-slate-900 dark:text-white">${escapeHtml(item.newArt.number)}</span>

                <button type="button" onclick="toggleUpdateDiffExpand(${idx})"

          `;
        }

        return `
          <div class="rounded-xl border border-amber-200 dark:border-amber-800/70 bg-amber-50/40 dark:bg-amber-950/15 p-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <label class="flex items-center gap-2.5 cursor-pointer min-w-0">
                <input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleUpdateItemSelection(${idx}, this.checked)"
                  class="rounded border-slate-300 text-rose-600 focus:ring-rose-500" />
                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300">Ausente no arquivo</span>
                <span class="text-xs font-bold text-slate-900 dark:text-white">${escapeHtml(item.oldArt.number)}</span>
                ${item.hasUserEdits ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-indigo-100 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300">Tem grifos</span>' : ''}
                ${item.hasUserNote ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300">Tem obs.</span>' : ''}
              </label>
            </div>
            <p class="mt-1 pl-6 text-[11px] text-amber-800/80 dark:text-amber-300/80">
              ${item.selected
                ? 'Marcado: será REMOVIDO do seu caderno ao confirmar.'
                : 'Desmarcado (recomendado): será MANTIDO intacto no seu caderno.'}
            </p>
          </div>
        `;
      }).join('');
    }

    function toggleUpdateItemSelection(idx, checked) {
      if (!pendingLawUpdatePlan || !pendingLawUpdatePlan.items[idx]) return;
      pendingLawUpdatePlan.items[idx].selected = Boolean(checked);
      renderUpdateReviewStep();
    }

    function toggleAllUpdateSelections(selectChanges) {
      if (!pendingLawUpdatePlan) return;
      for (const item of pendingLawUpdatePlan.items) {
        if (item.type === 'updated' || item.type === 'new') {
          item.selected = Boolean(selectChanges);
        } else if (item.type === 'missing' && !selectChanges) {
          item.selected = false;
        }
      }
      renderUpdateReviewStep();
    }

    function toggleUpdateDiffExpand(idx) {
      if (updateExpandedDiffs.has(idx)) updateExpandedDiffs.delete(idx);
      else updateExpandedDiffs.add(idx);
      renderUpdateReviewStep();
    }

    async function applySelectedLawUpdates() {
      if (!currentUser || !activeLawDoc || !pendingLawUpdatePlan) return;

      const markBadges = Boolean(document.getElementById('updateMarkBadgesCheckbox')?.checked);
      const applyBtn = document.getElementById('applyUpdateBtn');
      const progressBox = document.getElementById('updateProgressBox');
      const progressText = document.getElementById('updateProgressText');
      const progressPct = document.getElementById('updateProgressPct');
      const progressBar = document.getElementById('updateProgressBar');

      if (applyBtn) { applyBtn.disabled = true; applyBtn.textContent = 'Salvando na nuvem...'; }
      if (progressBox) progressBox.classList.remove('hidden');

      try {
        const resultArticles = [];
        let appliedUpdated = 0;
        let appliedNew = 0;
        let removedMissing = 0;

        for (const item of pendingLawUpdatePlan.items) {
          if (item.type === 'unchanged') {
            const kept = { ...item.oldArt };
            if (!kept.sectionHeader && item.newArt.sectionHeader) {
              kept.sectionHeader = item.newArt.sectionHeader;
            }
            resultArticles.push(kept);
          } else if (item.type === 'updated') {
            if (!item.selected) {
              resultArticles.push({ ...item.oldArt });
              continue;
            }
            appliedUpdated++;
            const existingMods = Array.isArray(item.oldArt.modifications) ? [...item.oldArt.modifications] : [];
            const autoMod = item.mergeInfo.autoModification;
            const normAutoOld = normalizeForDiff(autoMod.oldText);
            const alreadyRecorded = existingMods.some(m => normalizeForDiff(m.oldText) === normAutoOld);
            if (!alreadyRecorded && autoMod.oldText) {
              existingMods.push(autoMod);
            }

            resultArticles.push({
              ...item.oldArt,
              sectionHeader: item.newArt.sectionHeader || item.oldArt.sectionHeader || '',
              html: item.mergeInfo.mergedHtml,
              originalHtml: item.newArt.html,
              note: item.oldArt.note || '',
              updateBadge: markBadges ? 'updated' : (item.oldArt.updateBadge || ''),
              modifications: existingMods
            });
          } else if (item.type === 'new') {
            if (!item.selected) continue;
            appliedNew++;
            resultArticles.push({
              ...item.newArt,
              updateBadge: markBadges ? 'new' : ''
            });
          } else if (item.type === 'missing') {
            if (item.selected) {
              removedMissing++;
            } else {
              resultArticles.push({ ...item.oldArt });
            }
          }
        }

        resultArticles.forEach(refreshAutoModifications);
        activeLawDoc.articles = resultArticles;

        await saveFullLawToFirestore(currentUser.uid, activeLawDoc, (done, total) => {
          const pct = Math.min(100, Math.round((done / Math.max(1, total)) * 100));
          if (progressText) {
            progressText.textContent = total > 2
              ? `Atualizando bloco ${done} de ${total} na nuvem...`
              : 'Salvando lei atualizada na nuvem...';
          }
          if (progressPct) progressPct.textContent = `${pct}%`;
          if (progressBar) progressBar.style.width = `${pct}%`;
        });

        const meta = workspace.lawIndex.find(l => l.id === activeLawDoc.id);
        if (meta) {
          meta.articleCount = resultArticles.length;
          scheduleSaveWorkspace(true);
        }

        closeUpdateLawModal();
        renderSidebar();
        renderMainView();

        const parts = [];
        if (appliedUpdated > 0) parts.push(`${appliedUpdated} alterado(s)`);
        if (appliedNew > 0) parts.push(`${appliedNew} novo(s)`);
        if (removedMissing > 0) parts.push(`${removedMissing} removido(s)`);
        showToast(`Lei atualizada: ${parts.join(', ')}. Grifos e observações preservados!`, 'success');
      } catch (err) {
        console.error('Erro ao aplicar atualização:', err);
        showToast(err.message || 'Erro ao gravar atualização na nuvem.', 'error');
        if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = 'Aplicar Atualização na Nuvem'; }
      }
    }

    // -----------------------------------------------------------------------
    // 16. BACKUP E RESTAURAÇÃO COMPLETA EM JSON (SUPORTA LEIS FRAGMENTADAS)
    // -----------------------------------------------------------------------
    function openBackupModal() {
      openModal('backupModal');
    }

    async function exportFullBackupJson() {
      if (!currentUser) return;
      showToast('Preparando backup completo da nuvem...', 'info');
      try {
        const lawsSnap = await getDocs(lawsCollectionRef(currentUser.uid));
        const fullLaws = [];
        for (const d of lawsSnap.docs) {
          const hydrated = await loadLawFromFirestore(currentUser.uid, d.id, d);
          if (hydrated) {
            fullLaws.push({
              id: hydrated.id,
              subjectId: hydrated.subjectId,
              shortName: hydrated.shortName,
              title: hydrated.title,
              subtitle: hydrated.subtitle,
              articles: hydrated.articles
            });
          }
        }
        const payload = {
          version: 2,
          exportedAt: new Date().toISOString(),
          workspace,
          laws: fullLaws
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `lei-seca-studio-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Backup exportado com ${fullLaws.length} leis!`, 'success');
      } catch (err) {
        console.error('Erro no backup:', err);
        showToast('Erro ao gerar backup JSON.', 'error');
      }
    }

    async function handleImportBackupJson(event) {
      const file = event.target.files?.[0];
      event.target.value = '';
      if (!file || !currentUser) return;

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(String(reader.result || '{}'));
          if (!parsed.workspace || !Array.isArray(parsed.laws)) {
            throw new Error('Arquivo de backup inválido.');
          }
          showToast('Restaurando backup na nuvem...', 'info');
          setSyncStatus('saving', 'Restaurando backup...');

          for (const law of parsed.laws) {
            await saveFullLawToFirestore(currentUser.uid, law);
          }

          workspace = {
            preferences: parsed.workspace.preferences || workspace.preferences,
            subjects: Array.isArray(parsed.workspace.subjects) ? parsed.workspace.subjects : [],
            lawIndex: Array.isArray(parsed.workspace.lawIndex) ? parsed.workspace.lawIndex : []
          };
          scheduleSaveWorkspace(true);
          closeModal('backupModal');
          renderSidebar();
          subscribeToActiveLaw(currentUser.uid, workspace.preferences.activeLawId);
          showToast(`Backup restaurado (${parsed.laws.length} leis)!`, 'success');
        } catch (err) {
          console.error('Erro ao restaurar backup:', err);
          setSyncStatus('error');
          showToast(err.message || 'Falha ao restaurar backup JSON.', 'error');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    // -----------------------------------------------------------------------
    // 17. EXPOSIÇÃO SEGURA DAS FUNÇÕES PARA OS HANDLERS HTML + BOOTSTRAP
    // -----------------------------------------------------------------------
    Object.assign(window, {

      openRenameLawModal,
      handleRenameLaw,
      openTocModal,
      setTocMode,
      handleTocSearch,
      goToTocArticle,
      dismissArticleUpdateBadge,
      clearAllUpdateBadges,
      clearFilters,
      loadMoreArticles,
      showAllArticles,
      jumpToArticle,
      toggleEditArticle,
      handleArticleBodyInput,
      applyFormat,
      applyHighlight,
      applyTextColor,
      confirmRestoreArticle,
      toggleNoteDrawer,
      handleNoteInput,
      toggleModsDrawer,
      toggleModForm,
      handleAddModification,
      deleteModification,
      cleanCurrentLawMarkdown,
      detectModificationsCurrentLaw,
      openModal,
      closeModal,
      closeConfirmModal,
      executePendingConfirm,
      openSubjectModal,
      handleCreateSubject,
      openRenameSubjectModal,
      handleRenameSubject,
      confirmDeleteSubject,
      confirmDeleteLaw,
      toggleArchivedMenu,
      toggleArchiveSubject,
      toggleArchiveLaw,
      openAddArticleModal,
      handleAddArticle,
      confirmDeleteArticle,
      openImportModal,
      scheduleImportPreview,
      handleImportSubjectChange,
      handleImportFileSelected,
      handleImportLaw,
      openUpdateLawModal,
      closeUpdateLawModal,
      handleUpdateFileSelected,
      backToUpdateInputStep,
      analyzeLawUpdate,
      toggleUpdateItemSelection,
      toggleAllUpdateSelections,
      toggleUpdateDiffExpand,
      applySelectedLawUpdates,
      openBackupModal,
      exportFullBackupJson,
      handleImportBackupJson
    });

    // Inicia exibindo tela de verificação enquanto o Firebase Auth checa a sessão
    renderAuthLoading();
    onAuthStateChanged(auth, (user) => {
      if (user) {
        startAuthenticatedWorkspace(user);
      } else {
        teardownSession();
        renderPrivateLoginScreen();
      }
    });
  </script>
